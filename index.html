function repReserve(){const s=S();const rows=[['التاريخ','الفصل','الحصة','الغائب','البديل']];Object.keys(s.cover||{}).sort().forEach(dt=>{const di=sundayIndex(s,new Date(dt+'T00:00').getDay());const cov=s.cover[dt]||{};Object.keys(cov).forEach(k=>{const p=k.split('|'),cid=p[0],b=+p[1];const g=s.grid[cid]||{};const orig=(di!=null&&g[di+'-'+b]&&g[di+'-'+b].cont==null)?g[di+'-'+b]:null;rows.push([dt,cls(cid).name,(s.cfg.blocks[b]||{}).t||'',orig?tea(orig.tea).name:'',tea(cov[k]).name||'']);});});return rows;}
function repSupervision(){const s=S();const rows=[['التاريخ','الموقع','الحصة','المشرف']];Object.keys(s.supervision||{}).sort().forEach(dt=>{const m=s.supervision[dt]||{};Object.keys(m).forEach(k=>{const p=k.split('|'),pid=p[0],b=+p[1];rows.push([dt,(s.cfg.supPlaces.find(x=>x.id===pid)||{}).name||'',(s.cfg.blocks[b]||{}).t||'',supName(m[k])]);});});return rows;}
function repAssessment(){const s=S();const rows=[['الفصل','الترم','النوع','رقم الجلوس','الطالب','المادة','الدرجة','التقدير']];Object.keys(s.assess.marks||{}).forEach(key=>{const kp=key.split('|'),term=kp[0],type=kp[1];const cm=s.assess.marks[key];Object.keys(cm).forEach(cid=>{Object.keys(cm[cid]).forEach(sid=>{const st=(aStudents(cid).find(x=>x.id===sid)||{});Object.keys(cm[cid][sid]).forEach(subId=>{const v=cm[cid][sid][subId];rows.push([cls(cid).name,(ATERMS.find(t=>t[0]===term)||['',''])[1],(ATYPES.find(t=>t[0]===type)||['',''])[1],st.seat||'',st.name||'',subj(subId).name,(v.d!=null?v.d:''),v.r||'']);});});});});return rows;}
function repQuality(){const s=S();const rows=[['التاريخ','النوع','المعلم','المقيّم','النتيجة','التقدير']];(s.quality.evals||[]).forEach(e=>rows.push([e.date,(qTpl(e.type).name),e.teacherName||'',e.evaluator||'',e.total,e.rating||'']));return rows;}
function repMonthlyTasks(){const s=S();const mon=(new Date()).toISOString().slice(0,7);const from=mon+'-01';const to=(function(){const d=new Date(mon+'-01');d.setMonth(d.getMonth()+1);d.setDate(0);return d.toISOString().slice(0,10);})();const resBy={},supBy={};Object.keys(s.cover||{}).forEach(dt=>{if(dt<from||dt>to)return;Object.values(s.cover[dt]||{}).forEach(v=>resBy[v]=(resBy[v]||0)+1);});Object.keys(s.supervision||{}).forEach(dt=>{if(dt<from||dt>to)return;Object.values(s.supervision[dt]||{}).forEach(v=>supBy[v]=(supBy[v]||0)+1);});const rows=[['المعلم','احتياطى','إشراف','الإجمالى','الشهر']];s.teachers.forEach(t=>{const r=resBy[t.id]||0,sp=supBy[t.id]||0;if(r||sp)rows.push([t.name,r,sp,r+sp,mon]);});return rows;}

function svgLine(labels,series,opts){opts=opts||{};const w=opts.w||460,h=opts.h||200,pl=32,pb=22,pt=10,pr=10;const n=labels.length;let maxV=1;series.forEach(s=>s.data.forEach(v=>{if(v>maxV)maxV=v;}));const xw=(w-pl-pr)/Math.max(1,n-1);const yh=h-pt-pb;const X=i=>pl+i*xw;const Y=v=>pt+yh-(v/maxV)*yh;let g='<line x1="'+pl+'" y1="'+(pt+yh)+'" x2="'+(w-pr)+'" y2="'+(pt+yh)+'" stroke="#ccc"/>';series.forEach((se,si)=>{let d='';se.data.forEach((v,i)=>{d+=(i?'L':'M')+X(i).toFixed(1)+','+Y(v).toFixed(1)+' ';});g+='<path d="'+d+'" fill="none" stroke="'+(se.color||chColor(si))+'" stroke-width="2.5"/>';se.data.forEach((v,i)=>{g+='<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(v).toFixed(1)+'" r="3" fill="'+(se.color||chColor(si))+'"/>';});});labels.forEach((l,i)=>{if(n<=9||i%2===0)g+='<text x="'+X(i).toFixed(1)+'" y="'+(h-6)+'" font-size="9" text-anchor="middle" fill="#555">'+esc(l)+'</text>';});const legend=series.map((se,si)=>'<span style="display:inline-flex;align-items:center;gap:4px;font-size:11px;margin-left:12px"><span style="width:14px;height:3px;background:'+(se.color||chColor(si))+';display:inline-block"></span>'+esc(se.name)+'</span>').join('');return '<div style="margin-bottom:4px">'+legend+'</div><svg viewBox="0 0 '+w+' '+h+'" width="100%" style="max-width:'+w+'px">'+g+'</svg>';}

function studentWeakSubjects(classId,stuId,term,type){const s=S();const key=term+'|'+type;const mm=((s.assess.marks[key]||{})[classId]||{})[stuId]||{};const weak=[];aExamSubjects(cls(classId).gradeId).forEach(sb=>{const cf=aSubCfg(sb.id);const c=mm[sb.id];if(c&&c.d!=null){const mx=(+cf.max||0)+(cf.practical?(+cf.practicalMax||0):0);const pct=mx?(((+c.d||0)+(cf.practical?(+c.dp||0):0))/mx*100):0;if(pct<s.assess.passPct)weak.push({name:sb.name,pct:Math.round(pct)});}});weak.sort((a,b)=>a.pct-b.pct);return weak;}

function studentPct(classId,stuId,term,type){const s=S();const key=term+'|'+type;const mm=((s.assess.marks[key]||{})[classId]||{})[stuId]||{};let tot=0,max=0,any=false;aExamSubjects(cls(classId).gradeId).forEach(sb=>{const cf=aSubCfg(sb.id);const c=mm[sb.id]||{};if(c.d!=null){const d=(+c.d||0)+(cf.practical?(+c.dp||0):0);const mx=(+cf.max||0)+(cf.practical?(+cf.practicalMax||0):0);tot+=d;max+=mx;any=true;}});return any&&max?Math.round(tot/max*1000)/10:null;}

const GFIELDS=[['seat','رقم الجلوس'],['name','الاسم رباعى'],['nameEn','بالإنجليزية'],['nid','الرقم القومى'],['mobile','المحمول'],['email','الإيميل'],['gradYear','الدفعة (سنة التخرج)'],['spec','التخصص'],['gpa','التقدير'],['score','الدرجة/المعدل الرقمى'],['exam','نتيجة العام'],['status','الحالة الحالية'],['uni','الجامعة/الكلية'],['job','جهة العمل']];
const EXAM_RESULTS=['ناجح ومنقول','ناجح ومتخرّج','له دور ثانٍ','ناجح فى الدور الثانى','راسب فى الدور الثانى','راسب باقٍ للعام التالى','لم يتخرج بعد'];
const GSTATUS=['جامعة','معهد','عمل','عمل ودراسة','باحث عن عمل','غير معروف'];
var grTab='dashboard',grF={year:'',status:'',q:'',mode:'all',spec:'',exam:''},grSel='';
function grCanUse(){return ['manager','principal','assessment'].indexOf(SESSION.role)>=0;}
function reG(){renderGrads(reC());}
function grList(){return (S().grads||[]);}
function grScore(g){const v=parseFloat(g.score!=null&&g.score!==''?g.score:g.gpa);return isNaN(v)?-1:v;}
function grFiltered(){let a=grList();if(grF.year)a=a.filter(x=>String(x.gradYear||'')===grF.year);if(grF.status)a=a.filter(x=>(x.status||'')===grF.status);if(grF.spec)a=a.filter(x=>(x.spec||'')===grF.spec);if(grF.exam)a=a.filter(x=>(x.exam||'')===grF.exam);if(grF.mode==='repeat')a=a.filter(x=>(x.exam||'')==='راسب باقٍ للعام التالى');else if(grF.mode==='second')a=a.filter(x=>/دور ثان/.test(x.exam||''));if(grF.q){const q=grF.q.trim();a=a.filter(x=>((x.name||'')+' '+(x.seat||'')+' '+(x.nid||'')+' '+(x.spec||'')).indexOf(q)>=0);}if(grF.mode==='top20'){a=a.slice().sort((x,y)=>grScore(y)-grScore(x)).slice(0,20);}return a;}
function renderGrads(c){if(!grCanUse()){c.innerHTML='<div class="empty"><div class="empty-ic">🔒</div><div class="empty-t">غير متاح</div></div>';return;}
  const tabs=[['list','📋 السجل'],['dashboard','📊 إحصائيات'],['import','📥 استيراد']];
  const body={list:grListView,dashboard:grDash,import:grImportView}[grTab]();
  c.innerHTML=`<div class="pghdr"><div><div class="pgtitle">🎓 قاعدة الخريجين</div><div class="pgsub">${esc(schoolName(ACTIVE))} — ${grList().length} خريج</div></div></div>${schoolBar('grads')}<div class="tabs">${tabs.map(t=>`<div class="tab ${grTab===t[0]?'on':''}" onclick="grTab='${t[0]}';reG()">${t[1]}</div>`).join('')}</div>${body}`;
}
function grFilters(){const yrs=[...new Set(grList().map(x=>String(x.gradYear||'')).filter(Boolean))].sort().reverse();const specs=[...new Set(grList().map(x=>x.spec||'').filter(Boolean))].sort();return `<div class="filterbar" style="margin-bottom:6px"><div class="fg" style="flex:1"><label>عرض</label><div class="segbtns"><button class="${grF.mode==='all'?'on':''}" onclick="grF.mode='all';reG()">الكل</button><button class="${grF.mode==='top20'?'on':''}" onclick="grF.mode='top20';reG()">🏆 أفضل 20</button><button class="${grF.mode==='repeat'?'on':''}" onclick="grF.mode='repeat';reG()">↩ الباقون للعام التالى</button><button class="${grF.mode==='second'?'on':''}" onclick="grF.mode='second';reG()">📝 الدور الثانى</button></div></div><div class="fg"><label>التخصص</label><select onchange="grF.spec=this.value;reG()"><option value="">الكل</option>${specs.map(x=>`<option ${grF.spec===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div class="fg"><label>نتيجة العام</label><select onchange="grF.exam=this.value;reG()"><option value="">الكل</option>${EXAM_RESULTS.map(x=>`<option ${grF.exam===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div></div><div class="filterbar"><div class="fg"><label>الدفعة</label><select onchange="grF.year=this.value;reG()"><option value="">كل الدفعات</option>${yrs.map(y=>`<option ${grF.year===y?'selected':''}>${esc(y)}</option>`).join('')}</select></div><div class="fg"><label>الحالة</label><select onchange="grF.status=this.value;reG()"><option value="">الكل</option>${GSTATUS.map(s=>`<option ${grF.status===s?'selected':''}>${esc(s)}</option>`).join('')}</select></div><div class="fg grow"><label>🔎 بحث</label><input value="${esc(grF.q)}" placeholder="اسم/جلوس/قومى/تخصص" oninput="grF.q=this.value;reG()"/></div></div>`;}
function grListView(){const rows=grFiltered();const trs=rows.map(g=>`<tr><td>${esc(g.seat||'')}</td><td><b>${esc(g.name||'')}</b></td><td>${esc(g.gradYear||'')}</td><td>${esc(g.spec||'')}</td><td style="text-align:center">${g.score!=null&&g.score!==''?esc(g.score):(esc(g.gpa||''))}</td><td>${g.exam?`<span class="badge ${/راسب/.test(g.exam)?'br':(/دور ثان/.test(g.exam)?'ba':'bg')}">${esc(g.exam)}</span>`:'—'}</td><td><span class="badge bn">${esc(g.status||'—')}</span></td><td>${esc(g.mobile||'')}</td><td style="white-space:nowrap"><button class="btn bxsm bteal" onclick="grOpen('${g.id}')">🗂️ الملف</button><button class="btn bxsm bout" onclick="grEdit('${g.id}')">تعديل</button></td></tr>`).join('');
  return grFilters()+`<div class="card"><div class="chdr"><div class="ctitle">📋 الخريجون (${rows.length})</div><div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn bteal bsm" onclick="grEdit('')">+ خريج</button><button class="btn bout bsm" onclick="grExport('xls')">Excel</button><button class="btn bout bsm" onclick="grExport('doc')">Word</button><button class="btn bout bsm" onclick="grExport('pdf')">PDF</button></div></div><div class="tbwrap"><table><thead><tr><th>الجلوس</th><th>الاسم</th><th>الدفعة</th><th>التخصص</th><th>الدرجة</th><th>نتيجة العام</th><th>الحالة</th><th>المحمول</th><th></th></tr></thead><tbody>${trs||'<tr><td colspan=7><div class="empty"><div class="empty-t">لا خريجين — أضِف أو استورد</div></div></td></tr>'}</tbody></table></div></div>`;}
function grEdit(id){const g=id?(grList().find(x=>x.id===id)||{}):{};openM(`<div class="mbox wide"><div class="mhdr teal"><span class="mtitle">${id?'تعديل خريج':'إضافة خريج'}</span><button class="mcls" onclick="closeM()">✕</button></div><div class="mbody"><div class="fgrid">${GFIELDS.map(fd=>fd[0]==='status'?`<div class="fm"><label>${esc(fd[1])}</label><select id="g-${fd[0]}">${GSTATUS.map(s=>`<option ${g.status===s?'selected':''}>${esc(s)}</option>`).join('')}</select></div>`:fd[0]==='exam'?`<div class="fm"><label>${esc(fd[1])}</label><select id="g-${fd[0]}"><option value=""></option>${EXAM_RESULTS.map(s=>`<option ${g.exam===s?'selected':''}>${esc(s)}</option>`).join('')}</select></div>`:`<div class="fm"><label>${esc(fd[1])}</label><input id="g-${fd[0]}" value="${esc(g[fd[0]]||'')}"/></div>`).join('')}</div></div><div class="mfoot"><button class="btn bout bsm" onclick="closeM()">إلغاء</button><button class="btn bteal bsm" onclick="grSave('${id||''}')">حفظ</button></div></div>`);}
function grSave(id){const s=S();const rec={};GFIELDS.forEach(fd=>rec[fd[0]]=(document.getElementById('g-'+fd[0])||{}).value.trim());if(!rec.name)return toast('الاسم مطلوب','e');s.grads=s.grads||[];rec._v=Date.now();if(id){const g=s.grads.find(x=>x.id===id);if(g)Object.assign(g,rec);}else{rec.id=uid('gr');rec.history=[];s.grads.push(rec);}logAct('خريج',rec.name);save();closeM();reG();toast('تم الحفظ','s');}
function grOpen(id){const g=grList().find(x=>x.id===id);if(!g)return;g.history=g.history||[];const hist=g.history.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const kinds=[['university','التحاق بجامعة/معهد'],['job','التحاق بعمل'],['course','دورة/كورس'],['scholarship','منحة دراسية'],['other','حدث آخر']];
  const rows=hist.map((h,i)=>`<tr><td>${esc(h.date||'')}</td><td>${esc((kinds.find(k=>k[0]===h.kind)||['',h.kind])[1])}</td><td>${esc(h.title||'')}</td><td>${esc(h.place||'')}</td><td>${esc(h.note||'')}</td><td><button class="iconbtn del" onclick="grHistDel('${id}',${i})">🗑</button></td></tr>`).join('');
  openM(`<div class="mbox wide"><div class="mhdr teal"><span class="mtitle">🗂️ ملف الخريج — ${esc(g.name)}</span><button class="mcls" onclick="closeM()">✕</button></div><div class="mbody" style="max-height:66vh;overflow:auto">
    <div class="info" style="margin-bottom:8px">جلوس: ${esc(g.seat||'—')} · تخرّج: ${esc(g.gradYear||'—')} · تخصص: ${esc(g.spec||'—')} · الحالة: ${esc(g.status||'—')}</div>
    <div class="card" style="padding:12px"><div class="ctitle" style="font-size:13px">➕ إضافة حدث للتاريخ</div><div class="fgrid" style="margin-top:6px"><div class="fm"><label>النوع</label><select id="gh-kind">${kinds.map(k=>`<option value="${k[0]}">${k[1]}</option>`).join('')}</select></div><div class="fm"><label>التاريخ</label><input id="gh-date" type="date" value="${todayISO()}"/></div><div class="fm"><label>العنوان (التخصص/المسمى/اسم الكورس)</label><input id="gh-title"/></div><div class="fm"><label>الجهة</label><input id="gh-place"/></div><div class="fm full"><label>ملاحظات</label><input id="gh-note"/></div></div><button class="btn bteal bsm" onclick="grHistAdd('${id}')">إضافة للتاريخ</button></div>
    <div class="ctitle" style="font-size:13px;margin-top:10px">📜 تاريخ الخريج</div><div class="tbwrap"><table><thead><tr><th>التاريخ</th><th>النوع</th><th>العنوان</th><th>الجهة</th><th>ملاحظات</th><th></th></tr></thead><tbody>${rows||'<tr><td colspan=6>لا أحداث بعد</td></tr>'}</tbody></table></div>
  </div><div class="mfoot"><button class="btn bout bsm" onclick="grReport('${id}')">🖨️ تقرير الخريج PDF</button><button class="btn bout bsm" onclick="closeM()">إغلاق</button></div></div>`);}
function grHistAdd(id){const s=S();const g=s.grads.find(x=>x.id===id);if(!g)return;g.history=g.history||[];const h={kind:(document.getElementById('gh-kind')||{}).value,date:normDate((document.getElementById('gh-date')||{}).value)||todayISO(),title:(document.getElementById('gh-title')||{}).value.trim(),place:(document.getElementById('gh-place')||{}).value.trim(),note:(document.getElementById('gh-note')||{}).value.trim()};g.history.push(h);
  const st={university:'جامعة',job:'عمل',course:g.status,scholarship:g.status,other:g.status}[h.kind];if(st&&(h.kind==='university'||h.kind==='job'))g.status=st;logAct('حدث خريج',g.name+' — '+h.title);save();grOpen(id);toast('أُضيف للتاريخ ✓','s');}
function grHistDel(id,i){const s=S();const g=s.grads.find(x=>x.id===id);if(!g)return;confirmM('حذف هذا الحدث؟',()=>{g.history.splice(i,1);save();grOpen(id);});}
function grReportHTML(g){g.history=g.history||[];const kinds={university:'التحاق بجامعة/معهد',job:'التحاق بعمل',course:'دورة/كورس',scholarship:'منحة دراسية',other:'حدث آخر'};
  const hist=g.history.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  return aLogoBar()+`<h2 style="text-align:center;color:#1B2B5A">تقرير الخريج</h2>
    <table style="width:100%;font-size:12px;margin-bottom:8px"><tr><td><b>الاسم:</b> ${esc(g.name||'')}</td><td><b>رقم الجلوس:</b> ${esc(g.seat||'')}</td><td><b>سنة التخرج:</b> ${esc(g.gradYear||'')}</td></tr><tr><td><b>التخصص:</b> ${esc(g.spec||'')}</td><td><b>المعدل:</b> ${esc(g.gpa||'')}</td><td><b>الحالة الحالية:</b> ${esc(g.status||'')}</td></tr><tr><td><b>المحمول:</b> ${esc(g.mobile||'')}</td><td><b>الإيميل:</b> ${esc(g.email||'')}</td><td><b>القومى:</b> ${esc(g.nid||'')}</td></tr></table>
    <h3>📜 تاريخ ما بعد التخرج</h3><table><thead><tr><th>التاريخ</th><th>النوع</th><th>العنوان</th><th>الجهة</th><th>ملاحظات</th></tr></thead><tbody>${hist.map(h=>`<tr><td>${esc(h.date||'')}</td><td>${esc(kinds[h.kind]||h.kind)}</td><td>${esc(h.title||'')}</td><td>${esc(h.place||'')}</td><td>${esc(h.note||'')}</td></tr>`).join('')||'<tr><td colspan=5>لا أحداث مسجّلة</td></tr>'}</tbody></table>`+officialFooter();}
function grReport(id){const g=grList().find(x=>x.id===id);if(!g)return;printPDF('تقرير الخريج - '+g.name,grReportHTML(g));}
function grExport(kind){const rows=grFiltered();const html='<table><thead><tr>'+GFIELDS.map(f=>'<th>'+esc(f[1])+'</th>').join('')+'<th>عدد أحداث التاريخ</th></tr></thead><tbody>'+rows.map(g=>'<tr>'+GFIELDS.map(f=>'<td>'+esc(g[f[0]]||'')+'</td>').join('')+'<td style="text-align:center">'+((g.history||[]).length)+'</td></tr>').join('')+'</tbody></table>';const wrapped=aLogoBar()+'<h2 style="text-align:center">قاعدة بيانات الخريجين</h2>'+html;
  if(kind==='pdf')printPDF('قاعدة الخريجين',wrapped);else if(kind==='xls')downloadDoc('الخريجين.xls','application/vnd.ms-excel',wrapExport('الخريجين',html));else downloadDoc('الخريجين.doc','application/msword',wrapExport('الخريجين',wrapped));}
function grDash(){const rows=grFiltered();const by=(f)=>{const c={};rows.forEach(g=>{const v=g[f]||'—';c[v]=(c[v]||0)+1;});return c;};const byStatus=by('status'),byYear=by('gradYear'),bySpec=by('spec');
  const isUni=g=>['جامعة','معهد','عمل ودراسة'].indexOf(g.status)>=0;const isJob=g=>(g.status||'').indexOf('عمل')>=0;
  const cohorts=[...new Set(rows.map(g=>String(g.gradYear||'—')))].sort().reverse();
  const cohRows=cohorts.map(c=>{const cg=rows.filter(g=>String(g.gradYear||'—')===c);const u=cg.filter(isUni).length,j=cg.filter(isJob).length;return {c,n:cg.length,u,j,uPct:cg.length?Math.round(u/cg.length*100):0,jPct:cg.length?Math.round(j/cg.length*100):0};});
  const cohUniBars=cohRows.map(r=>[r.c,r.u]);const cohJobBars=cohRows.map(r=>[r.c,r.j]);
  const mets=`<div class="mets"><div class="met teal"><div class="mlbl">إجمالى الخريجين</div><div class="mval">${rows.length}</div></div><div class="met purple"><div class="mlbl">التحقوا بجامعات</div><div class="mval">${rows.filter(g=>g.status==='جامعة'||g.status==='معهد').length}</div></div><div class="met amber"><div class="mlbl">التحقوا بعمل</div><div class="mval">${rows.filter(g=>(g.status||'').indexOf('عمل')>=0).length}</div></div><div class="met"><div class="mlbl">سنوات التخرج</div><div class="mval">${Object.keys(byYear).length}</div></div></div>`;
  const card=(t,inner)=>`<div class="card"><div class="ctitle">${t}</div>${inner}</div>`;
  return grFilters()+`<div class="card"><div class="chdr"><div class="ctitle">📊 إحصائيات الخريجين</div><button class="btn bout bsm" onclick="grExport('pdf')">🖨️ PDF</button></div>${mets}<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px">${card('نتيجة العام (نجاح/رسوب/دور ثانٍ)',svgPie(Object.entries((function(){const c={};rows.forEach(g=>{const v=g.exam||'—';c[v]=(c[v]||0)+1;});return c;})())))}${card('حسب الحالة',svgPie(Object.entries(byStatus)))}${card('عدد الخريجين حسب الدفعة',svgBars(Object.entries(byYear)))}${card('الملتحقون بالجامعات حسب الدفعة',svgBars(cohUniBars))}${card('الملتحقون بالعمل حسب الدفعة',svgBars(cohJobBars))}${card('حسب التخصص',svgBars(Object.entries(bySpec)))}<div class="card"><div class="ctitle">📋 ملخّص الدفعات (جامعات/عمل)</div><div class="tbwrap"><table><thead><tr><th>الدفعة</th><th>العدد</th><th>جامعات</th><th>%</th><th>عمل</th><th>%</th></tr></thead><tbody>${cohRows.map(r=>`<tr><td><b>${esc(r.c)}</b></td><td style="text-align:center">${r.n}</td><td style="text-align:center">${r.u}</td><td style="text-align:center">${r.uPct}%</td><td style="text-align:center">${r.j}</td><td style="text-align:center">${r.jPct}%</td></tr>`).join('')}</tbody></table></div></div></div></div>`;}
function grImportView(){return `<div class="card"><div class="chdr"><div class="ctitle">📥 استيراد الخريجين</div><button class="btn bout bsm" onclick="grTemplate()">⬇️ نموذج</button></div><div class="info" style="margin-bottom:10px">الأعمدة: رقم الجلوس · الاسم · بالإنجليزية · الرقم القومى · المحمول · الإيميل · سنة التخرج · التخصص · المعدل · الحالة. يمكن أيضاً الاستيراد من قاعدة الطلاب مباشرةً لصف متخرّج.</div><button class="btn bteal bsm" onclick="grImport()">📥 اختر ملفاً واستورد</button> <button class="btn bpri bsm" onclick="grFromStudents()">👨‍🎓 ترحيل من قاعدة الطلاب (صف الثالث)</button></div>`;}
function grTemplate(){csvDownload([GFIELDS.map(f=>f[1]),['1001','أحمد محمد على حسن','Ahmed','300...','010...','a@x.com','2026','سلاسل إمداد وتوريد','ممتاز','جامعة']],'نموذج_الخريجين.csv');}
function grImport(){pickFile((txt)=>{const rows=parseCSV(txt);if(rows.length<2)return toast('الملف فارغ','e');const H=rows[0].map(x=>String(x).trim());const idx={};GFIELDS.forEach(f=>{idx[f[0]]=H.findIndex(h=>h.indexOf(f[1])>=0||h===f[1]);});if(idx.name<0)idx.name=1;const s=S();let n=0;rows.slice(1).forEach(r=>{const name=String(r[idx.name]||'').trim();if(!name)return;const rec={id:uid('gr'),history:[]};GFIELDS.forEach(f=>{const ci=idx[f[0]];rec[f[0]]=(ci>=0&&r[ci]!=null)?String(r[ci]).trim():'';});s.grads.push(rec);n++;});logAct('استيراد خريجين',n+'');save();toast('تم استيراد '+n+' خريج ✓','s');grTab='list';reG();});}
function grFromStudents(){const s=S();const g3=s.classes.filter(cl=>/الثالث|3/.test(grade(cl.gradeId).name));if(!g3.length)return toast('لا صف ثالث','w');confirmM('ترحيل طلاب الصف الثالث إلى الخريجين ('+g3.reduce((a,cl)=>a+aStudents(cl.id).length,0)+' طالب)؟',()=>{let n=0;const yr=yearLabel().split('/')[1]||(new Date().getFullYear());g3.forEach(cl=>{aStudents(cl.id).forEach(st=>{if(s.grads.some(x=>x.nid&&x.nid===st.nid))return;s.grads.push({id:uid('gr'),seat:st.seat||'',name:st.name||'',nameEn:st.nameEn||'',nid:st.nid||'',mobile:st.mobile||'',email:st.email||'',gradYear:String(yr),spec:st.spec||st.section||'',gpa:'',status:'غير معروف',history:[]});n++;});});logAct('ترحيل خريجين من الطلاب',n+'');save();toast('تم ترحيل '+n+' خريج ✓','s');grTab='list';reG();});}

const FTFIELDS=[['seat','رقم الجلوس'],['name','اسم المتدرب'],['spec','التخصص'],['company','جهة التدريب'],['address','عنوان الجهة'],['mentor','المشرف بالجهة'],['mentorPhone','هاتف المشرف'],['startDate','تاريخ البدء'],['endDate','تاريخ الانتهاء'],['status','الحالة'],['score','التقييم النهائى%']];

function ftList(){return (S().fieldTrain||[]);}

function renderField(c){if(!ftCanUse()){c.innerHTML='<div class="empty"><div class="empty-ic">🔒</div><div class="empty-t">غير متاح</div></div>';return;}
  const tabs=[['list','📋 المتدربون'],['dashboard','📊 إحصائيات'],['import','📥 استيراد']];
  const body={list:ftListView,dashboard:ftDash,import:ftImportView}[ftTab]();
  c.innerHTML=`<div class="pghdr"><div><div class="pgtitle">🏭 التدريب الميدانى ومتابعته</div><div class="pgsub">${esc(schoolName(ACTIVE))} — ${ftList().length} متدرب</div></div></div>${schoolBar('field')}<div class="tabs">${tabs.map(t=>`<div class="tab ${ftTab===t[0]?'on':''}" onclick="ftTab='${t[0]}';reF2()">${t[1]}</div>`).join('')}</div>${body}`;
}
function ftFilters(){const comps=[...new Set(ftList().map(x=>x.company||'').filter(Boolean))].sort();return `<div class="filterbar"><div class="fg"><label>جهة التدريب</label><select onchange="ftF.company=this.value;reF2()"><option value="">الكل</option>${comps.map(x=>`<option ${ftF.company===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div class="fg"><label>الحالة</label><select onchange="ftF.status=this.value;reF2()"><option value="">الكل</option>${FTSTATUS.map(x=>`<option ${ftF.status===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div class="fg grow"><label>🔎 بحث</label><input value="${esc(ftF.q)}" placeholder="اسم/جلوس/جهة/تخصص" oninput="ftF.q=this.value;reF2()"/></div></div>`;}
function ftBadge(st){const c={['جارٍ']:'ba',['مكتمل']:'bg',['منقطع']:'br',['لم يبدأ']:'bn'}[st]||'bn';return '<span class="badge '+c+'">'+esc(st||'—')+'</span>';}
function ftListView(){const rows=ftFiltered();const trs=rows.map(t=>`<tr><td>${esc(t.seat||'')}</td><td><b>${esc(t.name||'')}</b></td><td>${esc(t.spec||'')}</td><td>${esc(t.company||'')}</td><td>${esc(t.mentor||'')}</td><td>${ftBadge(t.status)}</td><td style="text-align:center">${t.score?(t.score+'%'):'—'}</td><td style="white-space:nowrap"><button class="btn bxsm bteal" onclick="ftOpen('${t.id}')">🗂️ المتابعة</button><button class="btn bxsm bout" onclick="ftEdit('${t.id}')">تعديل</button></td></tr>`).join('');
  return ftFilters()+`<div class="card"><div class="chdr"><div class="ctitle">📋 المتدربون (${rows.length})</div><div style="display:flex;gap:6px;flex-wrap:wrap">${ftCanEdit()?'<button class="btn bteal bsm" onclick="ftEdit(\'\')">+ متدرب</button>':''}<button class="btn bout bsm" onclick="ftExport('xls')">Excel</button><button class="btn bout bsm" onclick="ftExport('doc')">Word</button><button class="btn bout bsm" onclick="ftExport('pdf')">PDF</button></div></div><div class="tbwrap"><table><thead><tr><th>الجلوس</th><th>الاسم</th><th>التخصص</th><th>جهة التدريب</th><th>المشرف</th><th>الحالة</th><th>التقييم</th><th></th></tr></thead><tbody>${trs||'<tr><td colspan=8><div class="empty"><div class="empty-t">لا متدربين — أضِف أو استورد</div></div></td></tr>'}</tbody></table></div></div>`;}
function ftEdit(id){const t=id?(ftList().find(x=>x.id===id)||{}):{};openM(`<div class="mbox wide"><div class="mhdr teal"><span class="mtitle">${id?'تعديل متدرب':'إضافة متدرب'}</span><button class="mcls" onclick="closeM()">✕</button></div><div class="mbody"><div class="fgrid">${FTFIELDS.map(fd=>fd[0]==='status'?`<div class="fm"><label>${esc(fd[1])}</label><select id="ft-${fd[0]}">${FTSTATUS.map(v=>`<option ${t.status===v?'selected':''}>${esc(v)}</option>`).join('')}</select></div>`:`<div class="fm"><label>${esc(fd[1])}</label><input id="ft-${fd[0]}" ${/Date/.test(fd[0])?'type="date"':''} value="${esc(t[fd[0]]||'')}"/></div>`).join('')}</div></div><div class="mfoot"><button class="btn bout bsm" onclick="closeM()">إلغاء</button><button class="btn bteal bsm" onclick="ftSave('${id||''}')">حفظ</button></div></div>`);}
function ftSave(id){const s=S();const rec={};FTFIELDS.forEach(fd=>{let v=(document.getElementById('ft-'+fd[0])||{}).value.trim();if(/Date/.test(fd[0]))v=normDate(v)||v;rec[fd[0]]=v;});if(!rec.name)return toast('الاسم مطلوب','e');s.fieldTrain=s.fieldTrain||[];if(id){const t=s.fieldTrain.find(x=>x.id===id);if(t)Object.assign(t,rec);}else{rec.id=uid('ft');rec.visits=[];s.fieldTrain.push(rec);}logAct('تدريب ميدانى',rec.name);save();closeM();reF2();toast('تم الحفظ','s');}
function ftOpen(id){const t=ftList().find(x=>x.id===id);if(!t)return;t.visits=t.visits||[];const vis=t.visits.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const avg=t.visits.length?Math.round(t.visits.filter(v=>v.score).reduce((a,v)=>a+ (+v.score||0),0)/Math.max(1,t.visits.filter(v=>v.score).length)):0;
  const rows=vis.map((v,i)=>`<tr><td>${esc(v.date||'')}</td><td>${esc(v.by||'')}</td><td style="text-align:center">${v.att||'—'}</td><td style="text-align:center">${v.score?(v.score+'%'):'—'}</td><td>${esc(v.note||'')}</td><td><button class="iconbtn del" onclick="ftVisitDel('${id}',${i})">🗑</button></td></tr>`).join('');
  openM(`<div class="mbox wide"><div class="mhdr teal"><span class="mtitle">🗂️ متابعة تدريب — ${esc(t.name)}</span><button class="mcls" onclick="closeM()">✕</button></div><div class="mbody" style="max-height:66vh;overflow:auto">
    <div class="info" style="margin-bottom:8px">الجهة: ${esc(t.company||'—')} · المشرف: ${esc(t.mentor||'—')} (${esc(t.mentorPhone||'')}) · من ${esc(t.startDate||'—')} إلى ${esc(t.endDate||'—')} · الحالة: ${ftBadge(t.status)} · متوسط زيارات المتابعة: ${avg}%</div>
    ${ftCanEdit()?`<div class="card" style="padding:12px"><div class="ctitle" style="font-size:13px">➕ تسجيل زيارة متابعة ميدانية</div><div class="fgrid" style="margin-top:6px"><div class="fm"><label>التاريخ</label><input id="fv-date" type="date" value="${todayISO()}"/></div><div class="fm"><label>القائم بالزيارة</label><input id="fv-by" value="${esc(SESSION.name||'')}"/></div><div class="fm"><label>الحضور</label><select id="fv-att"><option value="">—</option><option>حاضر</option><option>غائب</option></select></div><div class="fm"><label>تقييم الزيارة%</label><input id="fv-score" type="number" min="0" max="100"/></div><div class="fm full"><label>ملاحظات المتابعة</label><input id="fv-note"/></div></div><button class="btn bteal bsm" onclick="ftVisitAdd('${id}')">إضافة الزيارة</button></div>`:''}

  </div><div class="mfoot"><button class="btn bout bsm" onclick="ftReport('${id}')">🖨️ تقرير المتدرب PDF</button><button class="btn bout bsm" onclick="closeM()">إغلاق</button></div></div>`);}
function ftVisitAdd(id){const s=S();const t=s.fieldTrain.find(x=>x.id===id);if(!t)return;t.visits=t.visits||[];t.visits.push({date:normDate((document.getElementById('fv-date')||{}).value)||todayISO(),by:(document.getElementById('fv-by')||{}).value.trim(),att:(document.getElementById('fv-att')||{}).value,score:(document.getElementById('fv-score')||{}).value.trim(),note:(document.getElementById('fv-note')||{}).value.trim()});logAct('زيارة تدريب ميدانى',t.name);save();ftOpen(id);toast('أُضيفت الزيارة ✓','s');}
function ftVisitDel(id,i){const s=S();const t=s.fieldTrain.find(x=>x.id===id);if(!t)return;confirmM('حذف هذه الزيارة؟',()=>{t.visits.splice(i,1);save();ftOpen(id);});}
function ftFinal(id){const s=S();const t=s.fieldTrain.find(x=>x.id===id);if(!t)return;t.score=(document.getElementById('ft-final')||{}).value.trim();t.status=(document.getElementById('ft-fstatus')||{}).value;logAct('تقييم تدريب نهائى',t.name+' — '+t.score);save();ftOpen(id);toast('تم حفظ التقييم النهائى ✓','s');}

function hrSave(id){const s=S();const rec={};HRFIELDS.forEach(fd=>{let v=(document.getElementById('hr-'+fd[0])||{}).value;v=(v||'').trim();if(/Date/.test(fd[0]))v=normDate(v)||v;rec[fd[0]]=v;});if(!rec.name)return toast('الاسم مطلوب','e');s.staff=s.staff||[];rec._v=Date.now();if(id){const t=s.staff.find(x=>x.id===id);if(t)Object.assign(t,rec);}else{rec.id=uid('sf');s.staff.push(rec);}logAct('موظف',rec.name);save();pushNow&&pushNow();closeM();reH();toast('تم الحفظ','s');}

function hrLeaveSave(id){const s=S();const from=normDate((document.getElementById('lv-from')||{}).value),to=normDate((document.getElementById('lv-to')||{}).value);if(!from||!to)return toast('حدّد التواريخ','e');const days=Math.max(1,Math.round((new Date(to)-new Date(from))/86400000)+1);s.leaves.push({id:uid('lv'),staffId:id,name:hrStaff(id).name,type:(document.getElementById('lv-type')||{}).value,from,to,days,note:(document.getElementById('lv-note')||{}).value.trim(),by:SESSION.name,ts:Date.now()});logAct('إجازة',hrStaff(id).name+' — '+days+' يوم');save();closeM();hrTab='leaves';reH();toast('تم تسجيل الإجازة ✓','s');}

function hrDocsExport(kind){let list=hrStaffList();if(hrDocsPrivate)list=list.filter(t=>t.sector==='خاص');const head='<tr><th>الموظف</th><th>الوظيفة</th><th>التعيين</th>'+HR_DOCS.map((d,i)=>'<th>'+(i+1)+'. '+esc(d)+'</th>').join('')+'<th>البنك</th><th>رقم الحساب</th><th>الاكتمال</th><th>المتبقى</th></tr>';const body=list.map(t=>{const stt=hrDocStatus(t);const bk=t.bank||{};return '<tr><td>'+esc(t.name)+'</td><td>'+esc(t.jobKind||'')+'</td><td>'+esc(t.hireDate||'')+'</td>'+HR_DOCS.map((d,i)=>'<td style="text-align:center">'+((t.docs&&t.docs['d'+i])?'✔':'—')+'</td>').join('')+'<td>'+esc(bk.bank||'')+'</td><td>'+esc(bk.acct||'')+'</td><td style="text-align:center">'+stt.done+'/'+stt.total+'</td><td>'+esc(stt.missing.join('، '))+'</td></tr>';}).join('');const tbl='<table><thead>'+head+'</thead><tbody>'+body+'</tbody></table>';if(kind==='xls')downloadDoc('مستندات_التعيين.xls','application/vnd.ms-excel',wrapExport('مستندات التعيين',tbl));else if(kind==='doc')downloadDoc('مستندات_التعيين.doc','application/msword',wrapExport('مستندات التعيين',aLogoBar()+tbl));else printPDF('مستندات التعيين',aLogoBar()+'<h2 style="text-align:center">مستندات التعيين — '+esc(schoolName(ACTIVE))+'</h2>'+tbl+officialFooter());}

function hrCard(id){const t=hrStaff(id);const lv=(S().leaves||[]).filter(x=>x.staffId===id);const html=aLogoBar()+`<h2 style="text-align:center;color:#1B2B5A">بطاقة موظف</h2><table style="width:100%;font-size:12px;margin-bottom:8px">${HRFIELDS.reduce((acc,fd,i)=>acc+(i%3===0?'<tr>':'')+'<td><b>'+esc(fd[1])+':</b> '+esc(t[fd[0]]||'')+'</td>'+(i%3===2?'</tr>':''),'')}</table><h3>🗓️ الإجازات</h3><table><thead><tr><th>النوع</th><th>من</th><th>إلى</th><th>الأيام</th></tr></thead><tbody>${lv.map(x=>`<tr><td>${esc(x.type)}</td><td>${esc(x.from)}</td><td>${esc(x.to)}</td><td>${x.days}</td></tr>`).join('')||'<tr><td colspan=4>لا إجازات</td></tr>'}</tbody></table>`+officialFooter();printPDF('بطاقة موظف - '+t.name,html);}

function hrImportView(){return `<div class="card"><div class="chdr"><div class="ctitle">📥 استيراد العاملين (نموذج دمياط المعتمد)</div><button class="btn bout bsm" onclick="hrTemplate()">⬇️ نموذج</button></div><div class="info" style="margin-bottom:10px">الأعمدة: اسم الموظف · طبيعة الوظيفة (مثل «معلم - خاص») · ثقافى/تخصص · الرقم القومى · التخصص · المدرسة · باق/مستجد · تاريخ التعيين · الايميل · رقم التليفون · ملاحظات. عمود «طبيعة الوظيفة» يُقسَّم تلقائياً إلى (النوع + القطاع).</div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn bteal bsm" onclick="hrImport()">📥 اختر ملفاً واستورد</button>${ACTIVE==='sc_dmt'?'<button class="btn bpri bsm" onclick="hrSeedDmt()">🏫 إضافة بيانات دمياط (23 موظف)</button>':''}</div></div>`;}

function hrImport(){pickFile((txt)=>{const rows=parseCSV(txt);if(rows.length<2)return toast('الملف فارغ','e');const H=rows[0].map(x=>String(x).trim());const F=keys=>{for(let i=0;i<H.length;i++)if(keys.some(k=>H[i].indexOf(k)>=0))return i;return -1;};const idx={name:F(['اسم']),nature:F(['طبيعة']),category:F(['ثقافى','تخصص']),nid:F(['القومى','قومى']),spec:F(['التخصص']),school:F(['المدرسة']),status2:F(['باق','مستجد']),hireDate:F(['التعيين','تعيين']),email:F(['ايميل','إيميل','mail']),phone:F(['التليفون','المحمول','هاتف'])};if(idx.name<0)idx.name=0;const s=S();let n=0;rows.slice(1).forEach(r=>{const name=String(r[idx.name]||'').trim();if(!name)return;const nature=(idx.nature>=0?String(r[idx.nature]||''):'').trim();const jk=nature.indexOf('-')>=0?nature.split('-')[0].trim():nature;const sec=nature.indexOf('-')>=0?nature.split('-')[1].trim():'';const rec={id:uid('sf'),name,jobKind:jk||'معلم',sector:sec,category:idx.category>=0?String(r[idx.category]||'').trim():'',nid:idx.nid>=0?String(r[idx.nid]||'').trim():'',spec:idx.spec>=0?String(r[idx.spec]||'').trim():'',school:idx.school>=0?String(r[idx.school]||'').trim():'',status2:idx.status2>=0?String(r[idx.status2]||'').trim():'',hireDate:idx.hireDate>=0?(normDate(r[idx.hireDate])||String(r[idx.hireDate]||'').trim()):'',email:idx.email>=0?String(r[idx.email]||'').trim():'',phone:idx.phone>=0?String(r[idx.phone]||'').trim():''};s.staff.push(rec);n++;});logAct('استيراد عاملين',n+'');save();toast('تم استيراد '+n+' موظف ✓','s');hrTab='staff';reH();});}
function hrSeedDmt(){const s=S();confirmM('إضافة بيانات عاملى دمياط ('+DMT_STAFF.length+')؟',()=>{let n=0;DMT_STAFF.forEach(d=>{if(s.staff.some(x=>x.nid&&x.nid===d.nid))return;s.staff.push(Object.assign({id:uid('sf')},d));n++;});logAct('إضافة عاملى دمياط',n+'');save();toast('تمت إضافة '+n+' موظف ✓','s');hrTab='dashboard';reH();});}
/* ===== Problems / error tracking ===== */
function probList(){try{return JSON.parse(localStorage.getItem(SK+'_problems')||'[]');}catch(e){return [];}}
function logProblem(type,msg,extra){try{const arr=probList();arr.unshift({t:Date.now(),type:type||'خطأ',msg:String(msg||'').slice(0,600),page:(typeof PAGE!=='undefined'?PAGE:''),user:(typeof SESSION!=='undefined'&&SESSION.name)||'',role:(typeof SESSION!=='undefined'&&SESSION.role)||'',extra:String(extra||'').slice(0,300)});if(arr.length>300)arr.length=300;localStorage.setItem(SK+'_problems',JSON.stringify(arr));const b=document.getElementById('prob-badge');if(b){const u=arr.filter(x=>!x.seen).length;b.textContent=u?String(u):'';b.style.display=u?'inline-flex':'none';}}catch(e){}}
try{window.addEventListener('error',function(e){logProblem('خطأ برمجى',(e&&e.message)||'error',(e&&e.filename?((e.filename.split('/').pop())+':'+e.lineno):''));});window.addEventListener('unhandledrejection',function(e){logProblem('وعد مرفوض',(e&&e.reason&&e.reason.message)||String(e&&e.reason||''));});}catch(e){}
function reportProblem(){openM('<div class="mbox"><div class="mhdr teal"><span class="mtitle">📣 الإبلاغ عن مشكلة</span><button class="mcls" onclick="closeM()">✕</button></div><div class="mbody"><div class="info" style="margin-bottom:8px">صف المشكلة التى واجهتك (ماذا كنت تفعل؟ وماذا حدث؟) وسنسجّلها للمتابعة.</div><textarea id="prob-desc" style="width:100%;min-height:100px;padding:10px;border:1.5px solid var(--bdr);border-radius:8px" placeholder="اكتب وصف المشكلة..."></textarea></div><div class="mfoot"><button class="btn bout bsm" onclick="closeM()">إلغاء</button><button class="btn bteal bsm" onclick="var v=(document.getElementById(\'prob-desc\')||{}).value||\'\';if(!v.trim())return toast(\'اكتب الوصف\',\'e\');logProblem(\'بلاغ مستخدم\',v);closeM();toast(\'تم تسجيل البلاغ ✓\',\'s\');if(PAGE===\'problems\')renderProblems(reC());">إرسال البلاغ</button></div></div>');}
function probClear(){confirmM('مسح كل سجل المشاكل؟',function(){localStorage.removeItem(SK+'_problems');const b=document.getElementById('prob-badge');if(b){b.textContent='';b.style.display='none';}renderProblems(reC());toast('تم المسح','w');});}
function probExport(){const arr=probList();const html='<table><thead><tr><th>التاريخ</th><th>النوع</th><th>الوصف</th><th>الصفحة</th><th>المستخدم</th><th>الدور</th></tr></thead><tbody>'+arr.map(function(p){return '<tr><td>'+esc(new Date(p.t).toLocaleString('ar-EG'))+'</td><td>'+esc(p.type)+'</td><td>'+esc(p.msg)+(p.extra?(' — '+esc(p.extra)):'')+'</td><td>'+esc(p.page)+'</td><td>'+esc(p.user)+'</td><td>'+esc(p.role)+'</td></tr>';}).join('')+'</tbody></table>';downloadDoc('سجل_المشاكل.xls','application/vnd.ms-excel',wrapExport('سجل المشاكل',html));}
function renderProblems(c){if(SESSION.role!=='manager'){c.innerHTML='<div class="empty"><div class="empty-ic">🔒</div><div class="empty-t">لمدير الجدول</div></div>';return;}const arr=probList();arr.forEach(function(p){p.seen=true;});try{localStorage.setItem(SK+'_problems',JSON.stringify(arr));}catch(e){}

  c.innerHTML='<div class="pghdr"><div><div class="pgtitle">🩺 تتبّع المشاكل</div><div class="pgsub">يسجّل الأخطاء التلقائية وبلاغات المستخدمين لمتابعتها وحلّها</div></div><div style="display:flex;gap:6px"><button class="btn bteal bsm" onclick="reportProblem()">📣 إبلاغ عن مشكلة</button><button class="btn bout bsm" onclick="probExport()">Excel</button><button class="btn bred bsm" onclick="probClear()">مسح السجل</button></div></div><div class="card"><div class="chdr"><div class="ctitle">📋 السجل ('+arr.length+')</div></div><div class="tbwrap" style="max-height:70vh;overflow:auto"><table><thead><tr><th>التاريخ والوقت</th><th>النوع</th><th>الوصف</th><th>الصفحة</th><th>المستخدم</th></tr></thead><tbody>'+(rows||'<tr><td colspan=5><div class="empty"><div class="empty-t">لا مشاكل مسجّلة ✅</div></div></td></tr>')+'</tbody></table></div></div>';}

  const rows=studs.map(x=>{const id=x.st.id;return `<tr><td>${esc(x.st.code||x.st.seat||'')}</td><td><b>${esc(x.st.name)}</b></td><td>${esc(grade(x.cl.gradeId).name||'')}</td><td><input type="number" value="${lifeSkillTotal(id)||''}" onchange="lifeSet('skills','${id}',this.value)" style="width:70px;text-align:center;padding:4px;border:1px solid var(--bdr);border-radius:5px"/></td><td><input type="number" value="${S().life.assignment[id]||''}" onchange="lifeSet('assignment','${id}',this.value)" style="width:70px;text-align:center;padding:4px;border:1px solid var(--bdr);border-radius:5px"/></td><td><input type="number" value="${S().life.bonus[id]||''}" onchange="lifeSet('bonus','${id}',this.value)" style="width:70px;text-align:center;padding:4px;border:1px solid var(--bdr);border-radius:5px"/></td><td style="text-align:center;color:#B91C1C">${lifeRecPoints(id)}</td><td style="text-align:center;font-weight:800">${lifeTotal(id)}</td><td style="text-align:center">${Math.round(lifePercent(id)*100)}%</td><td><span class="badge bn">${esc(lifeLevel(id))}</span></td></tr>`;}).join('');
  return `<div class="filterbar"><div class="fg"><label>الصف</label><select onchange="lifeF.gradeId=this.value;reLife()"><option value="">الكل</option>${(s.cfg.grades||[]).map(g=>`<option value="${g.id}" ${lifeF.gradeId===g.id?'selected':''}>الصف ${esc(g.name)}</option>`).join('')}</select></div><div class="fg grow"><label>🔎 بحث</label><input value="${esc(lifeF.q)}" oninput="lifeF.q=this.value;reLife()" placeholder="اسم/كود"/></div></div>
  <div class="card"><div class="chdr"><div class="ctitle">🏅 المهارات والمعسكرات والبونص (${studs.length})</div><button class="btn bout bsm" onclick="lifeExport('points')">Excel</button></div><div class="info" style="margin-bottom:6px">أدخل درجات المهارات + المعسكرات (Assignment) + البونص. الإجمالى = البداية + المهارات + المعسكرات + البونص + نقاط المخالفات/الانضباط (سالبة). المستوى حسب النسبة (الإجمالى ÷ ${lifeCfg().denom}).</div><div class="tbwrap" style="max-height:60vh;overflow:auto"><table><thead><tr><th>الكود</th><th>الطالب</th><th>الصف</th><th>المهارات</th><th>المعسكرات</th><th>البونص</th><th>نقاط المخالفات</th><th>الإجمالى</th><th>النسبة</th><th>المستوى</th></tr></thead><tbody>${rows||'<tr><td colspan=10>لا طلاب</td></tr>'}</tbody></table></div></div>`;}
function lifeSet(kind,id,v){const s=S();v=parseFloat(v)||0;if(kind==='skills'){s.life.skills[id]={total:v};}else{s.life[kind][id]=v;}save();pushNow&&pushNow();reLife();}
function lifeReportView(){const s=S();return `<div class="card"><div class="chdr"><div class="ctitle">📄 تقرير الطالب الفردى</div></div><div class="fgrid"><div class="fm"><label>كود الطالب</label><input id="lp-code" placeholder="الرقم الكودى"/></div><div class="fm" style="align-self:end"><button class="btn bteal bsm" onclick="lifeShowReport()">عرض</button> <button class="btn bout bsm" onclick="lifeShowReport(true)">🖨️ PDF</button></div></div><div id="life-rep-out" style="margin-top:10px"></div></div>`;}
function lifeReportHTML(f){const id=f.st.id;const recs=(S().life.records||[]).filter(r=>r.stuId===id);const viol=recs.filter(r=>r.kind==='violation'),indis=recs.filter(r=>r.kind==='indiscipline');
  return aLogoBar()+`<h2 style="text-align:center;color:#1B2B5A">التقرير الفردى — المهارات الحياتية</h2><div style="text-align:center;font-size:12px;margin-bottom:8px">${esc(schoolName(ACTIVE))} — العام الدراسى</div>
  <table style="width:100%;font-size:12px;margin-bottom:8px"><tr><td><b>الطالب:</b> ${esc(f.st.name)}</td><td><b>الكود:</b> ${esc(f.st.code||f.st.seat||'')}</td><td><b>الصف:</b> ${esc(grade(f.cl.gradeId).name||'')}</td></tr></table>
  <table><thead><tr><th>المهارات</th><th>المعسكرات</th><th>البونص</th><th>نقاط المخالفات</th><th>الإجمالى</th><th>النسبة</th><th>المستوى</th></tr></thead><tbody><tr><td style="text-align:center">${lifeSkillTotal(id)}</td><td style="text-align:center">${lifeAssign(id)}</td><td style="text-align:center">${lifeBonus(id)}</td><td style="text-align:center">${lifeRecPoints(id)}</td><td style="text-align:center"><b>${lifeTotal(id)}</b></td><td style="text-align:center">${lifeHasActivity(id)?Math.round(lifePercent(id)*100)+"%":"—"}</td><td style="text-align:center"><span class="badge ${lifeLevel(id)==="قيد التقييم"?"bn":"bg"}">${esc(lifeLevel(id))}</span></td></tr></tbody></table><div style="font-size:11px;color:#555;margin:4px 0">مواقف إيجابية: <b style="color:#166534">${lifePosCount(id)}</b> · ملاحظات سلبية: <b style="color:#991B1B">${lifeNegCount(id)}</b> · نسبة (المستهدف 4:1): <b>${lifeNegCount(id)?(lifePosCount(id)/lifeNegCount(id)).toFixed(1):(lifePosCount(id)?"∞":"0")}:1</b></div>
  <h3>المخالفات (${viol.length})</h3><table><thead><tr><th>التاريخ</th><th>البند</th><th>النقاط</th></tr></thead><tbody>${viol.map(r=>`<tr><td>${esc(r.date)}</td><td>${esc(r.item)}</td><td style="text-align:center">${r.points}</td></tr>`).join('')||'<tr><td colspan=3>—</td></tr>'}</tbody></table>
  <h3>عدم الانضباط (${indis.length})</h3><table><thead><tr><th>التاريخ</th><th>البند</th><th>النقاط</th></tr></thead><tbody>${indis.map(r=>`<tr><td>${esc(r.date)}</td><td>${esc(r.item)}</td><td style="text-align:center">${r.points}</td></tr>`).join('')||'<tr><td colspan=3>—</td></tr>'}</tbody></table>
  ${(function(){const pos=recs.filter(r=>r.kind==='positive');return '<h3>🌟 سجل المواقف الإيجابية المتميزة ('+pos.length+')</h3><table><thead><tr><th>التاريخ</th><th>الموقف</th><th>النقاط</th></tr></thead><tbody>'+(pos.map(r=>'<tr><td>'+esc(r.date)+'</td><td>'+esc(r.item)+(r.note?(' — '+esc(r.note)):'')+'</td><td style=\'text-align:center;color:#166534\'>+'+r.points+'</td></tr>').join('')||'<tr><td colspan=3>—</td></tr>')+'</tbody></table>';})()}
  ${(function(){var strengths=[],recs2=[];var pos=recs.filter(r=>r.kind==='positive');var lv=lifeLevel(id);
    if(pos.length>=1){var names=[...new Set(pos.map(r=>r.item))].slice(0,3);strengths.push('يُظهر الطالب سلوكيات احترافية متميزة: '+names.join('، ')+'.');}
    if(lv==='المحترف'||lv==='قدوة حسنة')strengths.push('مستوى انضباطى وأدائى عالٍ ('+lv+') يؤهله ليكون قدوة لزملائه.');
    var skillsToDev=[...new Set(recs.filter(r=>(r.kind==='violation'||r.kind==='indiscipline')&&r.skill).map(r=>r.skill))];
    if(skillsToDev.length)recs2.push('خطة تدريب علاجية على المهارات: '+skillsToDev.join('، ')+'.');
    if(indis.length>=2)recs2.push('يُوصى بالتركيز على برامج إدارة الوقت والانضباط الذاتى والمواظبة.');
    if(viol.length>=2)recs2.push('متابعة سلوكية دورية مع الأخصائى لتعزيز الالتزام بالقواعد.');
    if(!strengths.length)strengths.push('لم تُرصد بعدُ مواقف كافية — يُنصح بتشجيع الطالب على المشاركة الإيجابية.');
    if(!recs2.length)recs2.push('استمرار المتابعة الإيجابية والحفاظ على المستوى الحالى.');
    return '<h3>🌟 أبرز نقاط القوة والتميز</h3><div style=\'border:1px solid #86efac;background:#f0fdf4;border-radius:8px;padding:10px;font-size:12px\'>• '+strengths.join('<br>• ')+'</div><h3>🎯 مجالات التطوير وفرص التحسين الموصى بها</h3><div style=\'border:1px solid #fcd34d;background:#fffbeb;border-radius:8px;padding:10px;font-size:12px\'>• '+recs2.join('<br>• ')+'</div>';})()}`+officialFooter();}
function lifeShowReport(pdf){const code=(document.getElementById('lp-code')||{}).value.trim();const f=lifeFindByCode(code);if(!f)return toast('كود غير موجود','e');const html=lifeReportHTML(f);if(pdf){printPDF('تقرير المهارات - '+f.st.name,html);}else{const o=document.getElementById('life-rep-out');if(o)o.innerHTML=html;}}
function lifeScaleView(){const s=S();const c=s.life.cfg;const scRows=(s.life.scale||[]).map((x,i)=>`<tr><td><input value="${esc(x.name)}" onchange="s_lifeScale(${i},'name',this.value)" style="width:100%;padding:3px;border:1px solid var(--bdr);border-radius:5px"/></td><td><input type="number" value="${x.points}" onchange="s_lifeScale(${i},'points',this.value)" style="width:70px;padding:3px;border:1px solid var(--bdr);border-radius:5px"/></td><td><input value="${esc(x.level||'')}" onchange="s_lifeScale(${i},'level',this.value)" style="width:90px;padding:3px;border:1px solid var(--bdr);border-radius:5px"/></td><td><button class="iconbtn del" onclick="s_lifeScaleDel(${i})">🗑</button></td></tr>`).join('');
  return `<div class="card"><div class="chdr"><div class="ctitle">⚙️ إعداد الحساب</div></div><div class="fgrid"><div class="fm"><label>الدرجة المرجعية (المقام)</label><input type="number" value="${c.denom}" onchange="s_lifeCfg('denom',this.value)"/></div><div class="fm"><label>نقاط البداية</label><input type="number" value="${c.start}" onchange="s_lifeCfg('start',this.value)"/></div></div><div class="info">المستويات (النسبة ≥): ${(c.bands||[]).map(b=>esc(b[1])+' ≥ '+Math.round(b[0]*100)+'%').join(' · ')}</div></div>
  <div class="card"><div class="chdr"><div class="ctitle">📋 كتالوج المخالفات (${(s.life.scale||[]).length})</div><button class="btn bteal bsm" onclick="s_lifeScaleAdd()">+ بند</button></div><div class="tbwrap" style="max-height:50vh;overflow:auto"><table><thead><tr><th>البند</th><th>النقاط</th><th>المستوى</th><th></th></tr></thead><tbody>${scRows}</tbody></table></div></div>`;}
function s_lifeScale(i,f,v){const s=S();if(f==='points')v=parseInt(v)||0;s.life.scale[i][f]=v;save();}
function s_lifeScaleDel(i){const s=S();s.life.scale.splice(i,1);save();reLife();}
function s_lifeScaleAdd(){const s=S();s.life.scale.push({name:'بند جديد',points:-5,level:'بسيط'});save();reLife();}
function s_lifeCfg(f,v){const s=S();s.life.cfg[f]=parseFloat(v)||0;save();reLife();}
function lifeExport(kind){const s=S();let html='';if(kind==='records'){html='<table><thead><tr><th>التاريخ</th><th>الطالب</th><th>الكود</th><th>الصف</th><th>النوع</th><th>البند</th><th>النقاط</th></tr></thead><tbody>'+(s.life.records||[]).map(r=>'<tr><td>'+esc(r.date)+'</td><td>'+esc(r.name)+'</td><td>'+esc(r.code)+'</td><td>'+esc(grade(r.gradeId).name||'')+'</td><td>'+(r.kind==='violation'?'مخالفة':'عدم انضباط')+'</td><td>'+esc(r.item)+'</td><td>'+r.points+'</td></tr>').join('')+'</tbody></table>';downloadDoc('سجل_المهارات.xls','application/vnd.ms-excel',wrapExport('سجل المهارات الحياتية',html));return;}
  if(kind==='points'){const studs=lifeStudents();html='<table><thead><tr><th>الكود</th><th>الطالب</th><th>الصف</th><th>المهارات</th><th>المعسكرات</th><th>البونص</th><th>نقاط المخالفات</th><th>الإجمالى</th><th>النسبة%</th><th>المستوى</th></tr></thead><tbody>'+studs.map(x=>{const id=x.st.id;return '<tr><td>'+esc(x.st.code||x.st.seat||'')+'</td><td>'+esc(x.st.name)+'</td><td>'+esc(grade(x.cl.gradeId).name||'')+'</td><td>'+lifeSkillTotal(id)+'</td><td>'+lifeAssign(id)+'</td><td>'+lifeBonus(id)+'</td><td>'+lifeRecPoints(id)+'</td><td>'+lifeTotal(id)+'</td><td>'+Math.round(lifePercent(id)*100)+'</td><td>'+esc(lifeLevel(id))+'</td></tr>';}).join('')+'</tbody></table>';downloadDoc('نقاط_المهارات.xls','application/vnd.ms-excel',wrapExport('نقاط المهارات الحياتية',html));return;}
  printPDF('المهارات الحياتية',aLogoBar()+'<h2 style="text-align:center">المهارات الحياتية — لوحة المؤشرات</h2>'+'<div class="info">راجع الداش بورد داخل النظام.</div>'+officialFooter());}

/* boot */
loadDB();roleChange();try{applyPrefs();}catch(e){}try{window.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&(e.key==='k'||e.key==='K')){e.preventDefault();if(typeof openSearch==='function')openSearch();}});}catch(e){}
(async function bootSnapshot(){try{const changed=await loadSnapshot();if(changed){if(document.getElementById('login').classList.contains('on'))roleChange();else if(SESSION){buildSchoolPick&&buildSchoolPick();goPage(PAGE);}}}catch(e){}})();
(function restore(){try{const raw=localStorage.getItem(SK+'_sess');if(!raw)return;const sess=JSON.parse(raw);if(sess.k==='s'){const sd=DB.data[sess.schoolId];if(sd){const cl=sd.classes.find(c=>c.id===sess.classId);if(cl){SESSION={role:'student',name:'طالب — فصل '+cl.name,username:'student',schoolId:sess.schoolId,classId:sess.classId};ACTIVE=sess.schoolId;enterApp();}}}}catch(e){}})();

</script>
