<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>إدارة الجدول — EBDA</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
:root{
--R:#57B1C9;--Rd:#3E92A8;--Rl:#EEF7FA;--Rm:#BFE3EE;
--N:#1B2B5A;--Nd:#0F1B3D;--Nl:#EEF2FA;--Nm:#B8C4E0;
--W:#FFFFFF;--bg:#F4F6FB;--surf:#FFFFFF;
--bdr:#1B2B5A22;--bdr2:#57B1C935;
--t1:#0F1B3D;--t2:#1E293B;--t3:#475569;
--ok:#1D9E75;--okl:#DCFCE7;--warn:#D97706;--warnl:#FEF3C7;--err:#DC2626;--errl:#FEE2E2;
--r:8px;--r-lg:12px;--r-xl:18px;
--font:"Cairo",system-ui,sans-serif;
--sh:0 1px 3px rgba(27,43,90,.10);--sh-md:0 4px 20px rgba(27,43,90,.14)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--t1);font-size:14px;height:100vh;overflow:hidden;direction:rtl}
::-webkit-scrollbar{width:7px;height:7px}::-webkit-scrollbar-thumb{background:#c7d0e0;border-radius:99px}::-webkit-scrollbar-track{background:transparent}
.screen{display:none;height:100vh}.screen.on{display:flex}
button{font-family:inherit}
input,select,textarea{font-family:inherit}

/* LOGIN */
#login{align-items:center;justify-content:center;background:linear-gradient(145deg,#0F1B3D 0%,#1B2B5A 45%,#2A4A7A 72%,#57B1C9 100%);flex-direction:column;position:relative;overflow:hidden}
.orb{position:absolute;border-radius:50%;pointer-events:none}
.orb1{width:640px;height:640px;top:-220px;right:-180px;background:radial-gradient(circle,rgba(87,177,201,.20) 0%,transparent 65%)}
.orb2{width:560px;height:560px;bottom:-180px;left:-140px;background:radial-gradient(circle,rgba(27,43,90,.42) 0%,transparent 65%)}
.lcard{position:relative;z-index:2;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:var(--r-xl);backdrop-filter:blur(26px);padding:34px 32px;width:440px;max-width:94vw}
.llogo{display:flex;align-items:center;gap:13px;margin-bottom:22px;padding-bottom:20px;border-bottom:1px solid rgba(255,255,255,.1)}
.lmark{width:46px;height:46px;border-radius:13px;background:linear-gradient(135deg,#57B1C9,#3E92A8);display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 6px 18px rgba(87,177,201,.4)}
.lname{font-size:19px;font-weight:800;color:#fff}.ltag{font-size:10.5px;color:rgba(255,255,255,.45);margin-top:2px}
.lh{color:#fff;font-size:17px;font-weight:700;margin-bottom:16px}
.lfg{margin-bottom:14px}.lfg label{display:block;font-size:10px;font-weight:700;color:rgba(255,255,255,.55);margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em}
.li{width:100%;padding:11px 14px;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.14);border-radius:var(--r);color:#fff;font-size:14px;outline:none;transition:.15s}
.li::placeholder{color:rgba(255,255,255,.3)}.li:focus{border-color:#57B1C9;box-shadow:0 0 0 3px rgba(87,177,201,.25)}
.lerr{background:rgba(153,27,27,.32);border:1px solid rgba(239,68,68,.4);color:#FCA5A5;font-size:12px;padding:9px 12px;border-radius:9px;margin-bottom:13px;display:none}.lerr.on{display:block}
.lbtn{width:100%;padding:13px;background:linear-gradient(135deg,#57B1C9,#3E92A8);color:#fff;border:none;border-radius:var(--r);font-size:14px;font-weight:700;cursor:pointer;transition:.15s}
.lbtn:hover{box-shadow:0 8px 22px rgba(87,177,201,.4)}
.lhint{margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.1);font-size:10.5px;color:rgba(255,255,255,.5);line-height:1.9}
.lhint b{color:rgba(255,255,255,.8)}
.lquick{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.lqbtn{flex:1;min-width:78px;padding:7px 6px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:8px;color:#fff;font-size:10.5px;font-weight:600;cursor:pointer;transition:.15s}
.lqbtn:hover{background:rgba(87,177,201,.25);border-color:#57B1C9}

/* APP SHELL */
#app{display:none}
#app.on{display:flex;width:100%}
.sidebar{width:236px;background:linear-gradient(180deg,#0F1B3D 0%,#1B2B5A 62%,#2A2350 88%,#57B1C922 100%);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
.slogo{padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.12);display:flex;align-items:center;gap:11px}
.smark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#57B1C9,#3E92A8);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.slname{font-size:13px;font-weight:800;color:#fff}.sltag{font-size:9px;color:rgba(255,255,255,.4);margin-top:2px}
.school-pick{margin:12px 12px 4px;padding:9px 11px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:10px}
.school-pick label{font-size:8.5px;font-weight:700;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.08em}
.school-pick select{width:100%;margin-top:5px;padding:7px 8px;border-radius:7px;border:1px solid rgba(255,255,255,.16);background:#12203f;color:#fff;font-size:11.5px;font-weight:700;cursor:pointer;outline:none}
.ngrp{padding:13px 15px 5px;font-size:8.5px;font-weight:800;color:rgba(255,255,255,.3);text-transform:uppercase;letter-spacing:.11em}
.ni{display:flex;align-items:center;gap:10px;padding:8px 12px;margin:1px 8px;border-radius:9px;cursor:pointer;font-size:12px;color:rgba(255,255,255,.62);transition:.12s;user-select:none}
.ni:hover{background:rgba(255,255,255,.09);color:#fff}
.ni.on{background:var(--R)!important;color:#fff!important;font-weight:700;box-shadow:0 4px 12px rgba(87,177,201,.35)}
.ni-ic{font-size:15px;width:20px;text-align:center;flex-shrink:0}
.susr{border-top:1px solid rgba(255,255,255,.1);padding:12px 14px;display:flex;align-items:center;gap:9px;margin-top:auto}
.sav{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#57B1C9,#3E92A8);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex-shrink:0}
.suname{font-size:12px;font-weight:700;color:#fff}.surole{font-size:9.5px;color:rgba(255,255,255,.5);margin-top:1px}
.slogout{margin-right:auto;background:rgba(255,255,255,.08);border:none;border-radius:8px;width:30px;height:30px;color:#fff;cursor:pointer;font-size:14px;flex-shrink:0}
.slogout:hover{background:var(--err)}

.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{height:56px;background:var(--surf);border-bottom:3px solid var(--R);display:flex;align-items:center;padding:0 20px;gap:12px;flex-shrink:0;box-shadow:0 2px 8px rgba(27,43,90,.08)}
.tbtitle{font-size:15px;font-weight:800;color:var(--t1);flex:1}
.tbschool{font-size:11px;color:var(--t3);font-weight:600}
.tbbadge{font-size:9.5px;font-weight:800;padding:3px 11px;border-radius:20px;letter-spacing:.03em}
.tbbadge.manager{background:#EDE9FE;color:#5B21B6}.tbbadge.editor{background:var(--Nl);color:var(--N)}
.tbbadge.teacher{background:var(--okl);color:#065F46}.tbbadge.student{background:var(--warnl);color:#92400E}.tbbadge.affairs{background:var(--Rl);color:var(--Rd)}
.content{flex:1;overflow-y:auto;padding:18px 20px}
.page{display:none;flex-direction:column;gap:14px}.page.on{display:flex}

/* COMPONENTS */
.pghdr{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.pgtitle{font-size:16px;font-weight:800;color:var(--N)}
.pgsub{font-size:11.5px;color:var(--t3);margin-top:2px}
.card{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r-lg);padding:18px;box-shadow:var(--sh)}
.chdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.ctitle{font-size:13px;font-weight:800;color:var(--N);display:flex;align-items:center;gap:7px}
.mets{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px}
.met{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r-lg);padding:15px 16px;position:relative;overflow:hidden;box-shadow:var(--sh)}
.met::before{content:"";position:absolute;top:0;right:0;left:0;height:3px;background:var(--N)}
.met.teal::before{background:var(--R)}.met.green::before{background:var(--ok)}.met.amber::before{background:var(--warn)}.met.red::before{background:var(--err)}.met.purple::before{background:#7C3AED}
.mlbl{font-size:10px;font-weight:700;color:var(--t3);margin-bottom:6px;text-transform:uppercase;letter-spacing:.03em}
.mval{font-size:26px;font-weight:800;color:var(--N);line-height:1}
.msub{font-size:10.5px;color:var(--t3);margin-top:5px}
.mic{position:absolute;left:14px;top:14px;font-size:22px;opacity:.14}

.btn{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;border-radius:8px;cursor:pointer;transition:.12s;border:none;padding:8px 14px;white-space:nowrap;text-decoration:none}
.bpri{background:var(--N);color:#fff}.bpri:hover{background:var(--Nd)}
.bteal{background:var(--R);color:#fff}.bteal:hover{background:var(--Rd);box-shadow:0 4px 14px rgba(87,177,201,.35)}
.bgreen{background:var(--ok);color:#fff}.bgreen:hover{filter:brightness(.94)}
.bwarn{background:var(--warn);color:#fff}.bout{background:transparent;color:var(--t2);border:1px solid var(--bdr)}.bout:hover{background:var(--bg)}
.bred{background:transparent;color:var(--err);border:1.5px solid #FCA5A5}.bred:hover{background:var(--errl)}
.bsm{padding:6px 11px;font-size:11px}.bxsm{padding:4px 9px;font-size:10px}
.btn:disabled{opacity:.5;cursor:not-allowed}

.filterbar{display:flex;align-items:flex-end;flex-wrap:wrap;gap:11px;background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r-lg);padding:14px 16px;box-shadow:var(--sh)}
.fg{display:flex;flex-direction:column;gap:5px;min-width:130px}
.fg.grow{flex:1}
.fg label{font-size:10px;font-weight:800;color:var(--N);text-transform:uppercase;letter-spacing:.03em}
.fg input,.fg select{padding:8px 11px;border:1.5px solid var(--bdr);border-radius:8px;font-size:12px;color:var(--t1);background:#fff;outline:none;transition:.15s}
.fg input:focus,.fg select:focus{border-color:var(--R);box-shadow:0 0 0 3px rgba(87,177,201,.13)}

table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:right;padding:10px 11px;font-size:10px;font-weight:800;color:var(--t3);border-bottom:2px solid var(--bdr);white-space:nowrap;background:#EEF1F9;text-transform:uppercase;letter-spacing:.02em}
td{padding:9px 11px;border-bottom:1px solid var(--bdr);color:var(--t2);vertical-align:middle}
tr:last-child td{border-bottom:none}tr:hover td{background:var(--Nl)}
.tbwrap{overflow-x:auto;border-radius:var(--r-lg)}
.badge{display:inline-flex;align-items:center;font-size:10px;font-weight:700;padding:3px 10px;border-radius:20px;white-space:nowrap}
.bg{background:var(--okl);color:#065F46}.br{background:var(--errl);color:#991B1B}.ba{background:var(--warnl);color:#92400E}
.bb{background:var(--Nl);color:var(--N)}.bn{background:#F1F5F9;color:#475569}.bt{background:var(--Rl);color:var(--Rd)}.bpur{background:#EDE9FE;color:#5B21B6}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:5px 11px;border-radius:20px;background:var(--Nl);color:var(--N)}
.chip.teal{background:var(--Rl);color:var(--Rd)}.chip.green{background:var(--okl);color:#065F46}.chip.amber{background:var(--warnl);color:#92400E}.chip.red{background:var(--errl);color:#991B1B}

.empty{text-align:center;padding:40px 20px;color:var(--t3)}
.empty-ic{font-size:40px;opacity:.3;margin-bottom:10px}
.empty-t{font-size:14px;font-weight:700;color:var(--t2)}
.empty-s{font-size:12px;margin-top:5px}

/* TIMETABLE GRID */
.ttwrap{overflow:auto;border:1px solid var(--bdr);border-radius:var(--r-lg);background:#fff}
.ttable{border-collapse:collapse;width:100%;min-width:760px}
.ttable th,.ttable td{border:1px solid #dde3ef;padding:0;text-align:center}
.ttable thead th{background:var(--N);color:#fff;font-size:10.5px;font-weight:700;padding:7px 4px;position:sticky;top:0;z-index:2}
.tt-daycol{background:#EEF1F9;color:var(--N);font-weight:800;font-size:11px;width:74px;position:sticky;right:0;z-index:1}
.tt-brk{background:repeating-linear-gradient(45deg,#f8fafc,#f8fafc 6px,#eef1f7 6px,#eef1f7 12px);width:26px}
.tt-brk span{writing-mode:vertical-rl;font-size:8.5px;color:var(--t3);font-weight:700}
.tt-cell{min-width:66px;height:56px;cursor:pointer;position:relative;transition:.1s;padding:3px}
.tt-cell:hover{outline:2px solid var(--R);outline-offset:-2px;z-index:3}
.tt-cell.filled{color:#fff}
.tt-sub{font-size:10px;font-weight:800;line-height:1.15;padding:1px 2px}
.tt-tea{font-size:8.5px;opacity:.92;margin-top:2px;line-height:1.1}
.tt-topic{font-size:7.5px;opacity:.8;margin-top:1px;line-height:1.05;max-height:20px;overflow:hidden}
.tt-cont{background-image:linear-gradient(rgba(255,255,255,.12),rgba(255,255,255,.12))}
.tt-empty-dot{color:#cbd5e1;font-size:15px}
.tt-cell.editable-topic{box-shadow:inset 0 0 0 2px var(--ok)}

/* MODAL */
.mover{position:fixed;inset:0;background:rgba(15,27,61,.55);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:200;padding:20px}
.mover.on{display:flex}
.mbox{background:#fff;border-radius:var(--r-xl);width:520px;max-width:96vw;max-height:92vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(15,27,61,.4)}
.mbox.wide{width:720px}
.mhdr{padding:15px 20px;display:flex;align-items:center;justify-content:space-between;background:var(--N);color:#fff}
.mhdr.teal{background:var(--R)}.mhdr.green{background:var(--ok)}
.mtitle{font-size:14px;font-weight:800}
.mcls{background:rgba(255,255,255,.16);border:none;width:28px;height:28px;border-radius:8px;color:#fff;cursor:pointer;font-size:14px}
.mcls:hover{background:rgba(255,255,255,.28)}
.mbody{padding:20px;overflow-y:auto}
.mfoot{padding:14px 20px;border-top:1px solid var(--bdr);display:flex;justify-content:flex-end;gap:9px;background:#fafbfe}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.fm{display:flex;flex-direction:column;gap:5px}.fm.full{grid-column:1/-1}
.fm label{font-size:10.5px;font-weight:800;color:var(--t2)}
.fm input,.fm select,.fm textarea{padding:9px 11px;border:1.5px solid var(--bdr);border-radius:8px;font-size:13px;color:var(--t1);background:#fff;outline:none}
.fm input:focus,.fm select:focus,.fm textarea:focus{border-color:var(--R);box-shadow:0 0 0 3px rgba(87,177,201,.13)}

/* TOASTS */
.toasts{position:fixed;bottom:20px;left:20px;z-index:400;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--N);color:#fff;padding:11px 18px;border-radius:10px;font-size:12.5px;font-weight:700;box-shadow:0 10px 30px rgba(15,27,61,.35);animation:tin .25s;display:flex;align-items:center;gap:8px}
.toast.s{background:var(--ok)}.toast.e{background:var(--err)}.toast.w{background:var(--warn)}
@keyframes tin{from{transform:translateY(14px);opacity:0}to{transform:translateY(0);opacity:1}}

.seg{display:inline-flex;background:#EEF1F9;border-radius:9px;padding:3px;gap:2px}
.seg button{border:none;background:transparent;padding:7px 14px;border-radius:7px;font-size:11.5px;font-weight:700;color:var(--t3);cursor:pointer;transition:.12s}
.seg button.on{background:#fff;color:var(--N);box-shadow:var(--sh)}

.info{background:var(--Rl);border:1px solid var(--Rm);border-radius:10px;padding:11px 14px;font-size:11.5px;color:var(--Rd);line-height:1.7}
.warnbox{background:var(--warnl);border:1px solid #FCD34D;border-radius:10px;padding:11px 14px;font-size:11.5px;color:#92400E;line-height:1.7}
.colordot{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:middle;margin-left:5px}
.hidden{display:none!important}
</style>
  <style>
  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap');
  *{font-family:'Cairo',sans-serif;box-sizing:border-box}body{margin:0;padding:24px;color:#0F1B3D}
  .ph{display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid #57B1C9;padding-bottom:12px;margin-bottom:16px}
  .ph h1{font-size:19px;margin:0;color:#1B2B5A}.ph .meta{font-size:11px;color:#64748b;text-align:left}
  table{width:100%;border-collapse:collapse;font-size:11px;margin-top:8px}
  th{background:#1B2B5A;color:#fff;padding:7px 6px;border:1px solid #1B2B5A;font-size:10px}
  td{padding:6px;border:1px solid #cbd5e1;text-align:center}
  h2{font-size:14px;color:#1B2B5A;margin:18px 0 8px;border-right:4px solid #57B1C9;padding-right:8px}
  .tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:9px;font-weight:700}
  .foot{margin-top:22px;font-size:10px;color:#94a3b8;border-top:1px solid #e2e8f0;padding-top:8px;text-align:center}
  @media print{body{padding:8px}.noprint{display:none}}

/* ===== additions v2 ===== */
.slogout-full{margin:8px 12px 12px;padding:11px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:10px;color:#fff;cursor:pointer;font-size:12.5px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px;transition:.15s;font-family:inherit}
.slogout-full:hover{background:var(--err);border-color:var(--err);box-shadow:0 6px 16px rgba(220,38,38,.4)}
.susr{border-top:1px solid rgba(255,255,255,.1);padding:12px 14px 4px;display:flex;align-items:center;gap:9px;margin-top:auto}
/* distinctive lesson topic */
.tt-topic{display:inline-block;margin-top:3px;font-size:8px;font-weight:800;line-height:1.15;background:#fff;color:#0F1B3D;border-radius:5px;padding:2px 5px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.tt-topic::before{content:"📌 "}
.tt-cell.has-topic{box-shadow:inset 0 0 0 2px #fde047}
/* break column */
.tt-brk{background:repeating-linear-gradient(45deg,#FEF3C7,#FEF3C7 6px,#FDE68A 6px,#FDE68A 12px);width:34px;min-width:34px}
.tt-brk span{writing-mode:vertical-rl;transform:rotate(180deg);font-size:10px;color:#92400E;font-weight:900;letter-spacing:1px}
thead th.tt-brk{background:#F59E0B;color:#fff}
thead th.tt-brk span{writing-mode:horizontal-tb;transform:none}
/* tabs */
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--bdr);flex-wrap:wrap}
.tab{padding:9px 15px;font-size:12px;font-weight:700;color:var(--t3);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;transition:.12s;user-select:none}
.tab:hover{color:var(--N)}
.tab.on{color:var(--N);border-bottom-color:var(--R)}
/* active filter chips */
.fchips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.fchip{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;background:var(--Rl);color:var(--Rd);border:1px solid var(--Rm)}
.fchip b{color:var(--N)}
/* period editor */
.prow{display:flex;align-items:center;gap:8px;padding:7px 9px;border:1.5px solid var(--bdr);border-radius:9px;margin-bottom:7px;background:#fff}
.prow.brk{background:#FFFBEB;border-color:#FDE68A}
.prow .pidx{font-size:10px;font-weight:800;min-width:56px;color:var(--N)}
.prow input[type=time]{padding:6px 8px;border:1.5px solid var(--bdr);border-radius:7px;font-family:inherit;font-size:12px}
.prow input.plabel{flex:1;padding:6px 8px;border:1.5px solid var(--bdr);border-radius:7px;font-family:inherit;font-size:12px}
.iconbtn{width:28px;height:28px;border-radius:7px;border:1px solid var(--bdr);background:#fff;cursor:pointer;font-size:13px;color:var(--t2)}
.iconbtn:hover{background:var(--bg)}
.iconbtn.del:hover{background:var(--errl);color:var(--err);border-color:#FCA5A5}
/* stage tree */
.stagebox{border:1px solid var(--bdr);border-radius:11px;padding:12px;margin-bottom:11px;background:#fff}
.stagehd{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.stagehd .nm{font-size:13.5px;font-weight:800;color:var(--N)}
.gradebox{border:1px dashed var(--bdr2);border-radius:9px;padding:9px 11px;margin:7px 0;background:var(--Rl)}
.gradehd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.gradehd .nm{font-size:12px;font-weight:800;color:var(--Rd)}
.clschips{display:flex;flex-wrap:wrap;gap:6px}
.clschip{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--bdr);border-radius:20px;padding:4px 10px;font-size:11px;font-weight:700;color:var(--N)}
.clschip .x{cursor:pointer;color:var(--err);font-weight:900}
/* homework / exam item */
.hwitem{border:1px solid var(--bdr);border-right:4px solid var(--R);border-radius:10px;padding:12px 14px;background:#fff;box-shadow:var(--sh)}
.hwitem.exam{border-right-color:#7C3AED}
.hwitem.quiz{border-right-color:#0891b2}
.hwitem.monthly{border-right-color:#D97706}
.hwitem.midyear,.hwitem.final{border-right-color:#DC2626}
.hwmeta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:7px}
.hwtxt{font-size:13px;color:var(--t1);line-height:1.7;font-weight:600}
.hwdate{font-size:11px;color:var(--t3);font-weight:700}

/* ===== v3 additions ===== */
.tt-off{background:#F1F5F9}
.tt-off span{color:#CBD5E1;font-size:9px}
.ttable.blocks th,.ttable.blocks td{min-width:40px;font-size:9px;padding:3px 2px}
.ttable.blocks .tt-daycol{min-width:70px;font-size:10px}
.ttable.blocks .tt-sub{font-size:9.5px}
.ttable.blocks .tt-tea{font-size:8px}
.blkspan{font-size:7.5px;opacity:.85}
.lremember{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--t2);margin:4px 2px 2px;cursor:pointer;user-select:none}
.lremember input{width:16px;height:16px;accent-color:var(--R)}
/* dashboard stats */
.schoolstat{border:1px solid var(--bdr);border-radius:14px;padding:0;overflow:hidden;background:#fff;box-shadow:var(--sh);margin-bottom:14px}
.schoolstat .sst-hd{background:linear-gradient(120deg,var(--N),#25407e);color:#fff;padding:13px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.schoolstat .sst-hd .nm{font-size:14.5px;font-weight:800}
.schoolstat .sst-hd .sub{font-size:10.5px;opacity:.8}
.sst-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--bdr)}
.sst-cell{background:#fff;padding:12px 13px}
.sst-cell .k{font-size:10.5px;color:var(--t3);font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:5px}
.sst-cell .v{font-size:20px;font-weight:900;color:var(--N);line-height:1}
.sst-cell .d{font-size:10px;color:var(--t3);margin-top:3px}
.sst-cell.good .v{color:#1D9E75}.sst-cell.warn .v{color:#D97706}.sst-cell.bad .v{color:#DC2626}
.sbar{height:7px;border-radius:20px;background:#eef1f7;overflow:hidden;margin-top:7px}
.sbar>span{display:block;height:100%}

/* clearer sidebar menu (always visible, not only on hover) */
.ni{color:rgba(255,255,255,.9)!important}
.ngrp{color:rgba(255,255,255,.5)!important}
.ni-ic{opacity:1}
/* page-level school filter */
.schoolbar{display:flex;align-items:center;gap:10px;background:linear-gradient(120deg,var(--N),#25407e);color:#fff;border-radius:12px;padding:10px 14px;margin-bottom:12px;flex-wrap:wrap}
.schoolbar .lb{font-size:11px;font-weight:800;opacity:.85}
.schoolbar select{background:#fff;color:var(--N);border:none;border-radius:8px;padding:7px 12px;font-family:inherit;font-weight:700;font-size:12.5px;min-width:220px}
.schoolbar .fixed{font-size:13px;font-weight:800}
.segbtns{display:inline-flex;gap:0;border:1.5px solid var(--bdr);border-radius:9px;overflow:hidden}
.segbtns button{border:none;background:#fff;padding:7px 14px;font-family:inherit;font-size:11.5px;font-weight:700;color:var(--t2);cursor:pointer}
.segbtns button.on{background:var(--R);color:#fff}

/* logo chips */
.logo{display:block;height:46px;width:84px;background-size:contain;background-repeat:no-repeat;background-position:center;background-color:#fff;border-radius:9px;padding:5px;box-sizing:border-box}
.logo.moe{background-image:var(--logo-moe)}
.logo.ntss{background-image:var(--logo-ntss)}
.logo.ebda{background-image:var(--logo-ebda)}
.logo.at{background-image:var(--logo-at)}
.lgroup{display:flex;align-items:center;gap:12px}
/* login logo bar */
.loginlogos{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;width:min(760px,94vw);margin-bottom:20px;gap:12px;flex-wrap:wrap}
.loginlogos .logo{height:56px;width:104px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
/* app brand bar */
.brandbar{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff;border-bottom:1px solid var(--bdr);padding:8px 18px}
.brandbar .bcenter{font-size:13px;font-weight:800;color:var(--N);text-align:center;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brandbar .logo{height:40px;width:74px;background-color:transparent;box-shadow:none;padding:0}
@media(max-width:640px){.brandbar .bcenter{display:none}.brandbar .logo{height:32px;width:58px}}
/* FIX: dropdown option contrast (were white-on-white on the login screen) */
select.li option,select.li optgroup{color:#0F1B3D;background:#fff}
select option{color:#0F1B3D;background:#fff}
/* brighten login text so it is always readable (not only on hover) */
.lfg label{color:rgba(255,255,255,.82)!important}
.ltag{color:rgba(255,255,255,.7)!important}
.lhint{color:rgba(255,255,255,.75)!important}
.lhint b{color:#fff!important}
/* logos inside the login card header */
.cardlogos{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.cardlogos .logo{height:42px;width:72px;box-shadow:0 4px 12px rgba(0,0,0,.18)}

/* ===== primary color adoption: #57B1C9 ===== */
:root{--R:#57B1C9;--Rd:#3E92A8;--Rl:#EEF7FA;--Rm:#BFE3EE}
.lbtn,.btn.bpri,.btn.bteal{background:#57B1C9!important;border-color:#57B1C9!important;color:#fff!important}
.lbtn:hover,.btn.bpri:hover,.btn.bteal:hover{background:#3E92A8!important;border-color:#3E92A8!important}
.btn.bout{border-color:#BFE3EE!important;color:#3E92A8!important}
.btn.bout:hover{background:#EEF7FA!important}
.sidebar{background:linear-gradient(165deg,#0F2A38 0%,#12586c 55%,#57B1C9 130%)!important}
.ni.on{background:rgba(87,177,201,.22)!important;border-right:3px solid #57B1C9!important}
.smark{background:#57B1C9!important}

/* ============================================================
   MOBILE RESPONSIVE (login fit/scroll + off-canvas nav + touch grid)
   ============================================================ */
/* login: never hide the button — allow scroll, shrink on small screens */
#login.screen{overflow-y:auto;align-items:center}
@media (max-height:760px){#login.screen{align-items:flex-start}}
@media (max-width:640px){
  .loginlogos{display:none}
  .cardlogos .logo{height:34px;width:58px}
  .lcard{margin:10px auto;padding:20px 18px;max-width:94vw}
  .lname{font-size:16px}.lh{font-size:15px}
  .lfg{margin-bottom:10px}
  .li{padding:11px 12px;font-size:14px}
  .lbtn{padding:13px;font-size:15px}
}
/* hamburger button (hidden on desktop) */
.navtoggle{display:none;background:var(--R);color:#fff;border:none;border-radius:9px;width:40px;height:40px;font-size:20px;cursor:pointer;margin-left:8px}
.navscrim{display:none}
@media (max-width:900px){
  .navtoggle{display:inline-flex;align-items:center;justify-content:center}
  /* app becomes single column with an off-canvas drawer */
  #app.screen{display:block;height:100vh;overflow:hidden}
  .sidebar{position:fixed;top:0;right:-86vw;width:82vw;max-width:320px;height:100vh;z-index:120;transition:right .25s ease;box-shadow:-8px 0 24px rgba(0,0,0,.3);overflow-y:auto}
  #app.nav-open .sidebar{right:0}
  #app.nav-open .navscrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:110}
  .main{height:100vh;display:flex;flex-direction:column}
  .content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px}
  .brandbar{padding:6px 10px}
  .brandbar .logo{height:30px;width:52px}
  .topbar{position:sticky;top:0;z-index:60}
  /* filters & cards wrap and go full width */
  .filterbar{flex-direction:column;align-items:stretch}
  .filterbar .fg{width:100%}
  .filterbar select,.filterbar input{width:100%}
  .schoolbar{flex-direction:column;align-items:stretch}
  .schoolbar select{width:100%;min-width:0}
  .mets{grid-template-columns:1fr 1fr}
  .pghdr{flex-direction:column;align-items:flex-start;gap:8px}
  .mbox,.mbox.wide{width:94vw!important;max-width:94vw}
  .fgrid{grid-template-columns:1fr!important}
  /* timetable: smooth horizontal scroll + bigger touch targets */
  .ttwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--bdr);border-radius:10px}
  .ttable.blocks th,.ttable.blocks td{min-width:46px;font-size:10px;padding:5px 3px}
  .ttable.blocks .tt-daycol{min-width:66px}
  .tt-cell{min-height:40px}
  table{font-size:12px}
  .btn{padding:9px 12px}
}
@media (max-width:400px){ .mets{grid-template-columns:1fr} }

/* ============================================================
   LOGIN LAYOUT FIX — center the card, fit content, tidy logos
   ============================================================ */
/* center vertically & horizontally; scroll only if truly needed */
#login.screen{align-items:center!important;justify-content:center!important;padding:20px 12px;overflow-y:auto}
/* the top wide logo bar: smaller and centered above the card */
.loginlogos{justify-content:center;gap:18px;width:auto;max-width:96vw;margin:0 auto 14px}
.loginlogos .logo{height:44px;width:80px;box-shadow:0 4px 14px rgba(0,0,0,.22)}
/* login card: compact, centered, capped height with internal scroll as last resort */
.lcard{margin:0 auto;max-height:92vh;overflow-y:auto}
.cardlogos{margin-bottom:12px}
.cardlogos .logo{height:38px;width:66px}
.lh{margin:10px 0 12px}
.lfg{margin-bottom:11px}
/* on shorter/desktop screens keep it centered but allow scroll if the card is tall */
@media (min-width:641px) and (max-height:820px){
  .loginlogos{display:none} /* logos already shown inside the card */
  .lcard{margin:0 auto}
}
/* small screens: hide the wide bar, rely on in-card logos, comfortable spacing */
@media (max-width:640px){
  .loginlogos{display:none}
  #login.screen{align-items:flex-start;padding-top:14px}
  .cardlogos .logo{height:34px;width:58px}
}

/* block engine (ACTIVE) */
function BLOCKS(){return S().cfg.blocks||[];}
function isBrk(b){return !!(BLOCKS()[b]&&BLOCKS()[b].brk);}
function blabel(b){const p=BLOCKS()[b]||{};return p.brk?(p.label||'بريك'):(p.t+'-'+p.e);}
function btime(b){const p=BLOCKS()[b]||{};return (p.t||'')+'–'+(p.e||'');}
function dayEnd(d){const dd=S().cfg.days[d];return dd?(dd.end||BLOCKS().length):BLOCKS().length;}
function dayName(d){const dd=S().cfg.days[d];return dd?dd.name:'';}
function nDays(){return S().cfg.days.length;}
function teachBlocks(d){const out=[];const end=dayEnd(d);for(let b=0;b<end;b++)if(!isBrk(b))out.push(b);return out;}
/* generic (any sd) */
function gCoverAt(g,d,b){const c=g[d+'-'+b];if(!c)return null;const start=(c.cont!=null)?c.cont:b;return {start,cell:g[d+'-'+start]};}
function gLoad(sd,teaId){let n=0;Object.values(sd.grid||{}).forEach(g=>Object.keys(g).forEach(k=>{const c=g[k];if(c&&c.cont==null&&c.tea===teaId)n+=(c.span||2)/2;}));return n;}
function gLessons(sd,teaId,dayIdx){const out=[];(sd.classes||[]).forEach(cl=>{const g=sd.grid[cl.id]||{};Object.keys(g).forEach(k=>{const c=g[k];if(!c||c.cont!=null)return;if(teaId&&c.tea!==teaId)return;const[d,b]=k.split('-').map(Number);if(dayIdx!=null&&d!==dayIdx)return;out.push({classId:cl.id,d,b,c});});});return out;}
/* ACTIVE wrappers */
function coverAt(classId,d,b){return gCoverAt(S().grid[classId]||{},d,b);}
function teacherLoad(teaId){return gLoad(S(),teaId);}
function teacherBusyRange(teaId,d,b,span,exceptClass){for(let k=0;k<span;k++){for(const cl of S().classes){if(cl.id===exceptClass)continue;const ci=gCoverAt(S().grid[cl.id]||{},d,b+k);if(ci&&ci.cell&&ci.cell.tea===teaId)return true;}}return false;}
function roomBusyRange(roomId,d,b,span,exceptClass){if(!roomId)return false;for(let k=0;k<span;k++){for(const cl of S().classes){if(cl.id===exceptClass)continue;const ci=gCoverAt(S().grid[cl.id]||{},d,b+k);if(ci&&ci.cell&&ci.cell.room===roomId)return true;}}return false;}
function classFreeRange(classId,d,b,span,exceptStart){const g=S().grid[classId]||{};const end=dayEnd(d);for(let k=0;k<span;k++){const bb=b+k;if(bb>=end||isBrk(bb))return false;const ci=gCoverAt(g,d,bb);if(ci&&ci.start!==exceptStart)return false;}return true;}
function validStart(d,b,span){const end=dayEnd(d);for(let k=0;k<span;k++){if(b+k>=end||isBrk(b+k))return false;}return true;}
function countConflicts(){let n=0;const s=S();for(let d=0;d<nDays();d++){const end=dayEnd(d);for(let b=0;b<end;b++){if(isBrk(b))continue;const seen={};s.classes.forEach(cl=>{const ci=gCoverAt(s.grid[cl.id]||{},d,b);if(ci&&ci.cell&&ci.cell.tea)seen[ci.cell.tea]=(seen[ci.cell.tea]||0)+1;});Object.values(seen).forEach(v=>{if(v>1)n++;});}}return n;}

function seedSchool(sd){
  const stg={id:'st_sec',name:'المرحلة الثانوية'};sd.cfg.stages=[stg];
  const grs=[{id:'g1',name:'الأول',stageId:stg.id},{id:'g2',name:'الثانى',stageId:stg.id},{id:'g3',name:'الثالث',stageId:stg.id}];sd.cfg.grades=grs;
  const SUB=[['اللغة العربية','Arabic',4,'ثقافية','#0891b2',2],['اللغة الإنجليزية','English',4,'ثقافية','#0e7490',2],['الرياضيات','Math',4,'ثقافية','#dc2626',2],['التربية الدينية','Religion',2,'ثقافية','#059669',2],['الدراسات الاجتماعية','Social',2,'ثقافية','#d97706',2],['التربية الرياضية','PE',2,'ثقافية','#16a34a',2],['تكنولوجيا المعلومات','ICT',3,'تخصصية','#4f46e5',2],['سلاسل الإمداد نظرى','SupplyT',3,'تخصصية','#57B1C9',2],['سلاسل الإمداد عملى','SupplyP',3,'تخصصية','#3E92A8',3],['التدريب الميدانى','Onsite',2,'تدريب ميدانى','#ea580c',3]];
  grs.forEach((g,gi)=>SUB.forEach((x,i)=>sd.subjects.push({id:'sb_'+gi+'_'+i,name:x[0],en:x[1],gradeId:g.id,hours:x[2],type:x[3],color:x[4],span:x[5]})));
  const TE=[['محمد الطنطاوى','اللغة العربية'],['غادة الفيومى','اللغة الإنجليزية'],['باهر الصعيدى','الرياضيات'],['نوران الشافعى','التربية الدينية'],['هناء عسل','الدراسات الاجتماعية'],['محمد برغوت','التربية الرياضية'],['سالى الدالى','تكنولوجيا المعلومات'],['شروق المهدي','سلاسل الإمداد نظرى'],['محمد عبدالرازق','سلاسل الإمداد عملى'],['محمود تعيلب','التدريب الميدانى'],['سالى الشربينى','اللغة الإنجليزية'],['محمود عبدالعزيز','الرياضيات']];
  TE.forEach((t,i)=>sd.teachers.push({id:'tc_'+i,name:t[0],spec:t[1],subjects:sd.subjects.filter(s=>s.name===t[1]).map(s=>s.id),max:QUOTA}));
  [['قاعة 101','class'],['قاعة 102','class'],['قاعة 103','class'],['معمل الحاسب','lab'],['معمل اللغات','lab'],['ورشة سلاسل الإمداد','workshop'],['ورشة التدريب الميدانى','workshop']].forEach((r,i)=>sd.rooms.push({id:'rm_'+i,name:r[0],kind:r[1]}));
  [['1/1','g1'],['1/2','g1'],['2/1','g2'],['3/1','g3']].forEach((c,i)=>sd.classes.push({id:'cl_'+i,name:c[0],gradeId:c[1],roomId:sd.rooms[i%3].id,kind:'class'}));

}
function roomKindForSubject(sb){if(sb.type==='تدريب ميدانى')return'workshop';if(/عملى/.test(sb.name)||sb.en==='SupplyP')return'workshop';if(/تكنولوجيا|حاسب|ICT/.test(sb.name)||sb.en==='ICT')return'lab';return'class';}
function autoGenerate(sd,silent){
  const days=sd.cfg.days.map((_,i)=>i);
  sd.grid={};const teaBusy={},roomBusy={};
  const bT=(m,t,d,b)=>m[t]&&m[t][d+'-'+b],setB=(m,t,d,b)=>{m[t]=m[t]||{};m[t][d+'-'+b]=1;};
  const brk=b=>!!(sd.cfg.blocks[b]&&sd.cfg.blocks[b].brk);
  const end=d=>{const dd=sd.cfg.days[d];return dd?(dd.end||sd.cfg.blocks.length):sd.cfg.blocks.length;};
  const teaCount={};const tload=id=>teaCount[id]||0;
  sd.classes.forEach(cl=>{
    const g={};const gCover=b=>g[b]!=null;
    const subs=sd.subjects.filter(s=>s.gradeId===cl.gradeId).slice().sort((a,b)=>(b.hours||0)-(a.hours||0));
    subs.forEach(sb=>{let need=Math.round(sb.hours||0);const span=sb.span||2;
      const cands=sd.teachers.filter(x=>(x.subjects||[]).includes(sb.id));if(!cands.length)return;
      const kind=roomKindForSubject(sb);const pool=sd.rooms.filter(r=>r.kind===kind);
      const starts=[];days.forEach(d=>{const e=end(d);for(let b=0;b+span<=e;b++){let ok=true;for(let k=0;k<span;k++)if(brk(b+k)){ok=false;break;}if(ok)starts.push([d,b]);}});shuffle(starts);
      for(const [d,b] of starts){if(need<=0)break;
        let free=true;for(let k=0;k<span;k++){if(gCover(d+'-'+(b+k))){free=false;break;}}if(!free)continue;
        let chosen=null,best=1e9;for(const t of cands){let ok=true;for(let k=0;k<span;k++){if(bT(teaBusy,t.id,d,b+k)){ok=false;break;}}if(!ok)continue;if(tload(t.id)<best){best=tload(t.id);chosen=t;}}
        if(!chosen)continue;
        let rm='';if(pool.length){const cand=pool.find(r=>{for(let k=0;k<span;k++)if(bT(roomBusy,r.id,d,b+k))return false;return true;});if(kind!=='class'&&!cand)continue;rm=(cand||pool[0]||{}).id||'';}
        g[d+'-'+b]={sub:sb.id,tea:chosen.id,topic:'',room:rm,span};for(let k=1;k<span;k++)g[d+'-'+(b+k)]={cont:b};
        for(let k=0;k<span;k++){setB(teaBusy,chosen.id,d,b+k);if(rm)setB(roomBusy,rm,d,b+k);}teaCount[chosen.id]=tload(chosen.id)+span/2;need--;}
    });
    sd.grid[cl.id]=g;
  });
  if(!silent)toast('تم توليد الجدول تلقائياً','s');
}

function topicStatus(teaId,classId,subId,topic){if(!topic)return '';const ps=(S().plans||[]).filter(p=>p.teacherId===teaId&&p.classId===classId&&p.subId===subId&&p.status==='approved');if(!ps.length)return '';const set=new Set();ps.forEach(p=>(p.items||[]).forEach(it=>{if(it.title)set.add(it.title.trim());}));return set.has((topic||'').trim())?'ok':'off';}

function collectLessons(f){const s=S(),out=[];s.classes.forEach(cl=>{if(f.classId&&cl.id!==f.classId)return;if(f.gradeId&&cl.gradeId!==f.gradeId)return;const g=s.grid[cl.id]||{};Object.keys(g).forEach(k=>{const c=g[k];if(!c||c.cont!=null||!c.sub)return;const[d,b]=k.split('-').map(Number);if(f.day!==''&&f.day!=null&&+f.day!==d)return;if(f.block!==''&&f.block!=null&&+f.block!==b)return;if(f.teaId&&c.tea!==f.teaId)return;out.push({classId:cl.id,d,b,c});});});return out;}

function sundayIndex(sd,jsDay){const nm=DAYS_ALL[jsDay];const i=sd.cfg.days.findIndex(x=>x.name===nm);return i<0?null:i;}
function gConflicts(sd){let n=0;for(let d=0;d<sd.cfg.days.length;d++){const end=sd.cfg.days[d].end||sd.cfg.blocks.length;for(let b=0;b<end;b++){if(sd.cfg.blocks[b]&&sd.cfg.blocks[b].brk)continue;const seen={};sd.classes.forEach(cl=>{const ci=gCoverAt(sd.grid[cl.id]||{},d,b);if(ci&&ci.cell&&ci.cell.tea)seen[ci.cell.tea]=(seen[ci.cell.tea]||0)+1;});Object.values(seen).forEach(v=>{if(v>1)n++;});}}return n;}
function schoolStats(sd){const quota=sd.cfg.quota;let matched=0,over=0,under=0,totLoad=0;sd.teachers.forEach(t=>{const load=gLoad(sd,t.id);totLoad+=load;const q=t.max||quota;if(Math.abs(load-q)<0.001)matched++;else if(load>q)over++;else under++;});
  const today=todayISO();const di=sundayIndex(sd,new Date(today+'T00:00').getDay());const absentToday=(sd.absence[today]||[]);const gapsToday=di!=null?absentToday.reduce((s,tid)=>s+gLessons(sd,tid,di).length,0):0;const coveredToday=Object.keys(sd.cover[today]||{}).length;
  const rng=days=>{let g=0,c=0;const now=Date.now();Object.keys(sd.absence||{}).forEach(dt=>{const t=new Date(dt+'T00:00').getTime();if(isNaN(t)||now-t>days*864e5||t>now+864e5)return;const dd=sundayIndex(sd,new Date(dt+'T00:00').getDay());if(dd==null)return;g+=(sd.absence[dt]||[]).reduce((s,tid)=>s+gLessons(sd,tid,dd).length,0);});Object.keys(sd.cover||{}).forEach(dt=>{const t=new Date(dt+'T00:00').getTime();if(isNaN(t)||now-t>days*864e5||t>now+864e5)return;c+=Object.keys(sd.cover[dt]||{}).length;});return{g,c};};
  return{teachers:sd.teachers.length,classes:sd.classes.length,subjects:sd.subjects.length,matched,over,under,totLoad,absentToday:absentToday.length,gapsToday,coveredToday,wk:rng(7),mo:rng(30),yr:rng(365),conflicts:gConflicts(sd),homework:(sd.homework||[]).length,exams:(sd.exams||[]).length};}

function repairGrid(){const s=S();s.classes.forEach(cl=>{const g=s.grid[cl.id]||{};const starts=[];Object.keys(g).forEach(k=>{const c=g[k];if(c&&c.cont==null&&c.sub){const[d,b]=k.split('-').map(Number);starts.push({d,b,c});}});const ng={};starts.forEach(L=>{const span=L.c.span||2,end=(s.cfg.days[L.d]?s.cfg.days[L.d].end:s.cfg.blocks.length)||s.cfg.blocks.length;let ok=L.b+span<=end;for(let k=0;k<span&&ok;k++){if(s.cfg.blocks[L.b+k]&&s.cfg.blocks[L.b+k].brk)ok=false;if(ng[L.d+'-'+(L.b+k)])ok=false;}if(!ok)return;ng[L.d+'-'+L.b]={sub:L.c.sub,tea:L.c.tea,topic:L.c.topic||'',room:L.c.room||'',span};for(let k=1;k<span;k++)ng[L.d+'-'+(L.b+k)]={cont:L.b};});s.grid[cl.id]=ng;});}

function updDay(i,f,v){const s=S();if(f==='end'){v=Math.max(1,Math.min(s.cfg.blocks.length,parseInt(v)||s.cfg.blocks.length));s.cfg.days[i].end=v;repairGrid();}else s.cfg.days[i][f]=v.trim();save();reManage();}

function renderLoads(c){const rows=loadsRows();const canAdd=rows.filter(r=>r.load<r.q*0.9).length,full=rows.filter(r=>r.load>=r.q).length;const seg=`<div class="filterbar"><div class="fg"><label>تصنيف المواد</label><div class="segbtns"><button class="${loadsType===''?'on':''}" onclick="setLoadsType('')">الكل</button><button class="${loadsType==='ثقافية'?'on':''}" onclick="setLoadsType('ثقافية')">مواد ثقافية</button><button class="${loadsType==='تخصص'?'on':''}" onclick="setLoadsType('تخصص')">مواد التخصص</button></div></div></div>`;c.innerHTML=`<div class="pghdr"><div><div class="pgtitle">⚖️ أنصبة المعلمين</div><div class="pgsub">الحصة = مربعان · حصة ونصف تُحتسب ١.٥</div></div><div style="display:flex;gap:8px"><button class="btn bout bsm" onclick="exportLoadsCSV()">↓ CSV</button><button class="btn bout bsm" onclick="printLoads()">🖨️ PDF</button></div></div>${schoolBar('loads')}${seg}<div class="mets"><div class="met green"><div class="mlbl">يمكن الإضافة لهم</div><div class="mval">${canAdd}</div></div><div class="met red"><div class="mlbl">مكتملو النصاب</div><div class="mval">${full}</div></div><div class="met teal"><div class="mlbl">المعلمون</div><div class="mval">${rows.length}</div></div></div><div class="card"><div class="tbwrap"><table><thead><tr><th>المعلم</th><th>النصاب</th><th>الحصص</th><th>المتبقى</th><th>النسبة</th><th>الحالة</th></tr></thead><tbody>${rows.map(r=>`<tr><td><b>${esc(r.t.name)}</b><div style="font-size:9px;color:var(--t3)">${esc(r.t.spec||'')}</div></td><td style="text-align:center">${r.q}</td><td style="text-align:center;font-weight:800;color:var(--N)">${r.load}</td><td style="text-align:center">${r.rem>0?r.rem:0}</td><td style="min-width:130px"><div style="background:#eef1f7;border-radius:20px;height:8px;overflow:hidden"><div style="height:100%;width:${Math.min(100,r.pct)}%;background:${r.load>=r.q?'#DC2626':r.load>=r.q*0.9?'#D97706':'#1D9E75'}"></div></div><div style="font-size:9px;color:var(--t3);margin-top:3px">${r.pct}%</div></td><td><span class="badge ${r.cl}">${r.status}</span></td></tr>`).join('')||'<tr><td colspan=6><div class="empty"><div class="empty-t">لا معلمون</div></div></td></tr>'}</tbody></table></div></div>`;}
function exportLoadsCSV(){const rows=[['المعلم','التخصص','النصاب','الحصص','المتبقى','النسبة%','الحالة']];loadsRows().forEach(r=>rows.push([r.t.name,r.t.spec||'',r.q,r.load,r.rem>0?r.rem:0,r.pct,r.status]));csvDownload(rows,'الأنصبة.csv');}

function reserveGridHTML(dateISO,forExport){const s=S();const di=sundayIndex(s,new Date(dateISO+'T00:00').getDay());if(di==null)return '<div class="info">التاريخ ليس يوم دراسة.</div>';const cov=s.cover[dateISO]||{};const absent=(s.absence[dateISO]||[]);const cols=teachBlocks(di);

  s.classes.forEach(cl=>{const g=s.grid[cl.id]||{};let has=false;cols.forEach(b=>{const ci=gCoverAt(g,di,b);if(ci&&ci.cell&&ci.cell.sub)has=true;});if(!has)return;h+='<tr><td class="tt-daycol">'+esc(cl.name)+'</td>';let skip=0;cols.forEach((b,idx)=>{if(skip>0){skip--;return;}const c=g[di+'-'+b];if(!c||c.cont!=null||!c.sub){h+='<td class="tt-cell"></td>';return;}const span=c.span||2;skip=span-1;const sb=subj(c.sub);const isGap=absent.includes(c.tea);const sub=cov[cl.id+'|'+b];if(isGap){h+='<td class="tt-cell" colspan="'+span+'" style="background:'+(sub?'#DCFCE7':'#FEE2E2')+';color:#111"><div class="tt-sub">'+esc(sb.name)+'</div><div class="tt-tea">غائب: '+esc(tea(c.tea).name||'')+'</div><div class="blkspan" style="font-weight:800;color:'+(sub?'#166534':'#991B1B')+'">'+(sub?('بديل: '+esc(tea(sub).name||'')):'بدون بديل')+'</div></td>';}else{h+='<td class="tt-cell" colspan="'+span+'" style="background:'+sb.color+'"><div class="tt-sub">'+esc(sb.name)+'</div><div class="tt-tea">'+esc(tea(c.tea).name||'')+'</div></td>';}});h+='</tr>';});
  return h+'</tbody></table></div>';}
function exportReserve(kind){const title='الجدول الاحتياطى — '+resDate;const html=reserveGridHTML(resDate,true);if(kind==='pdf')printPDF(title,html.replace(/class=\"[^\"]*\"/g,''));else if(kind==='xls')downloadDoc(title+'.xls','application/vnd.ms-excel',wrapExport(title,html));else downloadDoc(title+'.doc','application/msword',wrapExport(title,html));}
function reserveData(dateISO){const s=S();const di=sundayIndex(s,new Date(dateISO+'T00:00').getDay());const absent=(s.absence[dateISO]||[]);const gaps=[];if(di!=null)s.classes.forEach(cl=>{const g=s.grid[cl.id]||{};Object.keys(g).forEach(k=>{const cc=g[k];if(!cc||cc.cont!=null||!cc.tea)return;const[d,b]=k.split('-').map(Number);if(d!==di)return;if(absent.includes(cc.tea))gaps.push({classId:cl.id,b,span:cc.span||2,sub:cc.sub,absentTea:cc.tea});});});return{di,absent,gaps};}
function coverLoadOf(dateISO,teaId){const cov=S().cover[dateISO]||{};return Object.values(cov).filter(v=>v===teaId).length;}
function subCandidates(di,b,span,sub,absent,dateISO,busy){const s=S(),out=[];s.teachers.forEach(t=>{if(absent.includes(t.id))return;if(busy&&busy.has(t.id))return;if(teacherBusyRange(t.id,di,b,span))return;const load=teacherLoad(t.id)+(dateISO?coverLoadOf(dateISO,t.id):0);const q=t.max||s.cfg.quota;const nearFull=load>=q||load>=q*0.9;const match=(t.subjects||[]).includes(sub)||t.spec===subj(sub).name;out.push({t,load,q,nearFull,match});});out.sort((a,b)=>a.nearFull!==b.nearFull?a.nearFull-b.nearFull:a.load!==b.load?a.load-b.load:(b.match?1:0)-(a.match?1:0));return out;}

function markAll(a){S().absence[resDate]=a?S().teachers.map(t=>t.id):[];save();renderReserve(reC());}
function setCover(classId,b,teaId){const cov=S().cover[resDate]=S().cover[resDate]||{};if(teaId)cov[classId+'|'+b]=teaId;else delete cov[classId+'|'+b];logAct('تعيين احتياطى',(teaId?tea(teaId).name:'إزالة')+' — فصل '+cls(classId).name+' — '+resDate);save();renderReserve(reC());}
function autoAssignAll(){const info=reserveData(resDate);if(!info.gaps.length)return toast('لا حصص تحتاج تغطية','w');const cov=S().cover[resDate]={};const busyBy={};info.gaps.forEach(gp=>{const key=gp.b;const busy=busyBy[key]=busyBy[key]||new Set();const cand=subCandidates(info.di,gp.b,gp.span,gp.sub,info.absent,resDate,busy);if(cand.length){cov[gp.classId+'|'+gp.b]=cand[0].t.id;busy.add(cand[0].t.id);}});logAct('توليد احتياطى تلقائى',resDate+' — '+info.gaps.length+' حصة');save();renderReserve(reC());toast('تم اقتراح البدائل','s');}
function coverHistory(){const s=S();const dates=Object.keys(s.cover||{}).filter(d=>Object.keys(s.cover[d]||{}).length).sort((a,b)=>b.localeCompare(a));if(!dates.length)return '<div class="card"><div class="ctitle">🗂️ ما نفّذه مدير المدرسة فى الاحتياطى</div><div class="info" style="margin-top:8px">لا تغطيات مسجّلة بعد لهذه المدرسة.</div></div>';let rows='';dates.forEach(dt=>{const di=sundayIndex(s,new Date(dt+"T00:00").getDay());const cov=s.cover[dt]||{};Object.keys(cov).forEach(k=>{const parts=k.split("|"),cid=parts[0],b=+parts[1];const cl=cls(cid);if(!cl.id)return;const g=s.grid[cid]||{};const orig=(di!=null&&g[di+"-"+b]&&g[di+"-"+b].cont==null)?g[di+"-"+b]:null;const span=orig?(orig.span||2):2;const ee=b+span-1;rows+=`<tr><td>${esc(dt)}</td><td>${di!=null?esc(s.cfg.days[di].name):"—"}</td><td>${esc((s.cfg.blocks[b]||{}).t)}–${esc((s.cfg.blocks[ee]||{}).e)}</td><td><b>${esc(cl.name)}</b></td><td>${orig?esc(subj(orig.sub).name):"—"}</td><td><span class="badge br">${orig&&orig.tea?esc(tea(orig.tea).name):"—"}</span></td><td><span class="badge bg">${esc(tea(cov[k]).name||"—")}</span></td></tr>`;});});return `<div class="card"><div class="chdr"><div class="ctitle">🗂️ ما نفّذه مدير المدرسة فى الاحتياطى (${esc(schoolName(ACTIVE))})</div><button class="btn bout bsm" onclick="printCoverHistory()">🖨️ PDF</button></div><div class="info" style="margin-bottom:10px">عرض لكل التغطيات التى سجّلها مدير المدرسة عند غياب المعلمين.</div><div class="tbwrap"><table><thead><tr><th>التاريخ</th><th>اليوم</th><th>التوقيت</th><th>الفصل</th><th>المادة</th><th>الغائب</th><th>البديل الذى كُلِّف</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;}

function renderReserve(c){if(!can('reserve')){c.innerHTML='<div class="empty"><div class="empty-ic">🔒</div><div class="empty-t">لإدارة الجدول ومدير المدرسة</div></div>';return;}const s=S();const di=sundayIndex(s,new Date(resDate+'T00:00').getDay());const schoolDay=di!=null;const absent=(s.absence[resDate]||[]);

s}</tbody></table></div></div>`;}}
  c.innerHTML=`<div class="pghdr"><div><div class="pgtitle">🔄 الجدول الاحتياطى</div><div class="pgsub">ما نفّذه مدير المدرسة عند غياب معلم — ${esc(schoolDay?s.cfg.days[di].name:DAYS_ALL[new Date(resDate+'T00:00').getDay()])}</div></div></div>${schoolBar('reserve')}<div class="filterbar"><div class="fg"><label>التاريخ</label><input type="date" value="${resDate}" onchange="resDate=this.value;renderReserve(reC())"/></div><div class="fg"><label>إجراءات</label><div style="display:flex;gap:6px"><button class="btn bred bsm" onclick="markAll(true)">الكل غائب</button><button class="btn bout bsm" onclick="markAll(false)">مسح</button></div></div><div class="fg grow"><label>ملخص</label><div style="padding-top:6px"><span class="chip red">🚫 غائبون: ${absent.length}</span></div></div></div><div class="card"><div class="ctitle" style="margin-bottom:12px">حدّد الغائبين</div><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px">${toggles}</div></div>${gaps}${schoolDay?`<div class="card"><div class="chdr"><div class="ctitle">🗓️ جدول اليوم بعد التغطية</div><div style="display:flex;gap:6px"><button class="btn bout bsm" onclick="exportReserve('pdf')">🖨️ PDF</button><button class="btn bout bsm" onclick="exportReserve('xls')">📊 Excel</button><button class="btn bout bsm" onclick="exportReserve('doc')">📄 Word</button></div></div>${reserveGridHTML(resDate)}</div>`:''}${coverHistory()}`;}

function editHomework(id){const s=S();const h=id?s.homework.find(x=>x.id===id):null;const isT=SESSION.role==='teacher';const clsPool=isT?teacherClasses(SESSION.teacherId).map(cls):s.classes;if(!clsPool.length)return toast(isT?'لا فصول مسندة إليك':'أضف فصولاً أولاً','w');const curCls=h?h.classId:clsPool[0].id;const subPool=isT?teacherSubjectsInClass(SESSION.teacherId,curCls).map(subj):subjectsOfGrade(cls(curCls).gradeId);

function saveHomework(id){const s=S();const classId=document.getElementById('hw-cls').value,subId=document.getElementById('hw-sub').value,date=document.getElementById('hw-date').value,text=document.getElementById('hw-text').value.trim();if(!text)return toast('اكتب الواجب','e');const teaId=SESSION.role==='teacher'?SESSION.teacherId:(document.getElementById('hw-tea')||{}).value||'';if(id){const h=s.homework.find(x=>x.id===id);Object.assign(h,{classId,subId,teaId,date,text});}else{s.homework.unshift({id:uid('hw'),ts:Date.now(),classId,subId,teaId,date,text,by:SESSION.name});}logAct('واجب',subj(subId).name+' — فصل '+cls(classId).name);save();closeM();renderHomework(reC());toast('تم الحفظ','s');}
function delHomework(id){confirmM('حذف هذا الواجب؟',()=>{const s=S();s.homework=s.homework.filter(x=>x.id!==id);save();renderHomework(reC());toast('تم الحذف','e');});}

  c.innerHTML=`<div class="pghdr"><div><div class="pgtitle">📝 الاختبارات و Quizzes</div><div class="pgsub">الكويزات والاختبارات الشهرية ونصف/آخر العام</div></div>${can('addExam')?`<button class="btn bteal bsm" onclick="editExam()">+ إضافة موعد</button>`:''}</div>${schoolBar('exams')}${typeTabs}${filters}<div style="display:flex;flex-direction:column;gap:10px">${items||'<div class="empty"><div class="empty-ic">📭</div><div class="empty-t">لا اختبارات</div></div>'}</div>`;}

var repTab='status',repF={gradeId:'',classId:'',teaId:'',type:'',from:'',to:''};
function repScope(){ // teacher sees only own classes/teacher
  if(SESSION.role==='teacher'){const ids=teacherClasses(SESSION.teacherId);return {teacher:true,classIds:ids,teaId:SESSION.teacherId};}
  return {teacher:false,classIds:S().classes.map(c=>c.id),teaId:''};}
function repClassesForGrade(sc,gid){return (gid?classesOfGrade(gid):S().classes).filter(c=>sc.classIds.includes(c.id));}
function scheduleStatus(sc){const s=S();const rows=[];let capB=0,useB=0,lessons=0;
  s.classes.forEach(cl=>{if(!sc.classIds.includes(cl.id))return;if(repF.gradeId&&cl.gradeId!==repF.gradeId)return;if(repF.classId&&cl.id!==repF.classId)return;
    const g=s.grid[cl.id]||{};let cap=0,use=0,les=0;for(let d=0;d<nDays();d++){cap+=teachBlocks(d).length;}
    Object.keys(g).forEach(k=>{const c=g[k];if(c&&c.cont==null&&c.sub){les++;use+=(c.span||2);}});
    capB+=cap;useB+=use;lessons+=les;
    rows.push({cl,cap,use,les,pct:cap?Math.round(use/cap*100):0,empty:cap-use});});
  return {rows,capB,useB,lessons,pct:capB?Math.round(useB/capB*100):0};}
function renderReports(c){const s=S();const sc=repScope();
  const TABS=[['status','🗓️ حالة الجدول'],['curr','📗 حالة المناهج'],['reserverep','🔄 الاحتياطى (تفصيلى)'],['exams','📝 الاختبارات'],['homework','📚 الواجبات'],['loads','⚖️ الأنصبة'],['absence','🔄 الغياب والتغطية']];
  const tabs=`<div class="tabs">${TABS.map(t=>`<div class="tab ${repTab===t[0]?'on':''}" onclick="repTab='${t[0]}';renderReports(reC())">${t[1]}</div>`).join('')}</div>`;
  const gradeSel=`<div class="fg"><label>الصف</label><select onchange="repF.gradeId=this.value;repF.classId='';renderReports(reC())"><option value="">الكل</option>${s.cfg.grades.map(g=>`<option value="${g.id}" ${repF.gradeId===g.id?'selected':''}>الصف ${esc(g.name)}</option>`).join('')}</select></div>`;
  const clsSel=`<div class="fg"><label>الفصل</label><select onchange="repF.classId=this.value;renderReports(reC())"><option value="">الكل</option>${repClassesForGrade(sc,repF.gradeId).map(x=>`<option value="${x.id}" ${repF.classId===x.id?'selected':''}>فصل ${esc(x.name)}</option>`).join('')}</select></div>`;
  const teaSel=sc.teacher?'':`<div class="fg"><label>المعلم</label><select onchange="repF.teaId=this.value;renderReports(reC())"><option value="">الكل</option>${s.teachers.map(t=>`<option value="${t.id}" ${repF.teaId===t.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div>`;
  const typeSel=`<div class="fg"><label>نوع الاختبار</label><select onchange="repF.type=this.value;renderReports(reC())"><option value="">الكل</option>${Object.keys(EXAM_TYPES).map(k=>`<option value="${k}" ${repF.type===k?'selected':''}>${EXAM_TYPES[k].l}</option>`).join('')}</select></div>`;
  const teaId=sc.teacher?sc.teaId:repF.teaId;
  let filters='',table='',head='',exp;
  if(repTab==='status'){filters=gradeSel+clsSel;const st=scheduleStatus(sc);
    head=`<div class="mets"><div class="met teal"><div class="mlbl">نسبة اكتمال الجدول</div><div class="mval">${st.pct}%</div><div class="msub">${st.useB}/${st.capB} مربع</div></div><div class="met purple"><div class="mlbl">عدد الحصص</div><div class="mval">${st.lessons}</div></div><div class="met ${countConflicts()?'red':'green'}"><div class="mlbl">التعارضات</div><div class="mval">${countConflicts()}</div></div><div class="met amber"><div class="mlbl">مربعات شاغرة</div><div class="mval">${st.capB-st.useB}</div></div></div>`;
    table=`<table><thead><tr><th>الفصل</th><th>الصف</th><th>حصص</th><th>مربعات مشغولة</th><th>السعة</th><th>الاكتمال</th><th>شاغر</th></tr></thead><tbody>${st.rows.map(R=>`<tr><td><b>${esc(R.cl.name)}</b></td><td>${esc(grade(R.cl.gradeId).name)}</td><td style="text-align:center">${R.les}</td><td style="text-align:center">${R.use}</td><td style="text-align:center">${R.cap}</td><td style="text-align:center"><span class="badge ${R.pct>=90?'bg':R.pct>=70?'ba':'br'}">${R.pct}%</span></td><td style="text-align:center">${R.empty}</td></tr>`).join('')||'<tr><td colspan=7>لا بيانات</td></tr>'}</tbody></table>`;exp=()=>printPDF('حالة الجدول',head.replace(/met/g,'')+table);}
  else if(repTab==='curr'){filters=gradeSel+clsSel+teaSel;const cm=compliance(s,{teaId:teaId,classId:repF.classId,term:''});
    // aggregate by class
    const byClass={};cm.rows.forEach(R=>{if(repF.gradeId&&cls(R.p.classId).gradeId!==repF.gradeId)return;const cid=R.p.classId;byClass[cid]=byClass[cid]||{pt:0,pd:0,pdue:0,pdd:0};byClass[cid].pt+=R.pt;byClass[cid].pd+=R.pd;byClass[cid].pdue+=R.pdue;byClass[cid].pdd+=R.pdd;});
    head=`<div class="mets"><div class="met ${cm.commit>=80?'green':cm.commit>=50?'amber':'red'}"><div class="mlbl">الالتزام العام</div><div class="mval">${cm.due?cm.commit+'%':'—'}</div><div class="msub">${cm.doneDue}/${cm.due} بند مستحق</div></div><div class="met teal"><div class="mlbl">بنود مخطّطة</div><div class="mval">${cm.planned}</div></div><div class="met purple"><div class="mlbl">نُفِّذت</div><div class="mval">${cm.done}</div></div><div class="met"><div class="mlbl">الالتزام بالتوقيت</div><div class="mval">${cm.ontimePct}%</div></div></div>`;

  else if(repTab==='exams'){filters=gradeSel+clsSel+typeSel;let arr=s.exams.filter(e=>sc.classIds.includes(e.classId));if(sc.teacher)arr=arr.filter(e=>e.teaId===sc.teaId);if(repF.type)arr=arr.filter(e=>e.type===repF.type);if(repF.classId)arr=arr.filter(e=>e.classId===repF.classId);else if(repF.gradeId)arr=arr.filter(e=>cls(e.classId).gradeId===repF.gradeId);arr.sort((a,b)=>(a.date||'').localeCompare(b.date||''));table=`<table><thead><tr><th>النوع</th><th>التاريخ</th><th>الوقت</th><th>الصف/الفصل</th><th>المادة</th><th>العنوان</th><th>المعلم</th></tr></thead><tbody>${arr.map(e=>{const cl=cls(e.classId);return `<tr><td>${EXAM_TYPES[e.type]?EXAM_TYPES[e.type].l:e.type}</td><td>${esc(e.date||'')}</td><td>${esc(e.time||'')}</td><td>${esc(grade(cl.gradeId).name)} / ${esc(cl.name)}</td><td>${esc(subj(e.subId).name)}</td><td>${esc(e.title||'')}</td><td>${esc(tea(e.teaId).name||e.by||'')}</td></tr>`;}).join('')||'<tr><td colspan=7>لا بيانات</td></tr>'}</tbody></table>`;exp=()=>printPDF('تقرير الاختبارات',table);}
