<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<title>إدارة الجدول — EBDA</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
:root{
--R:#57B1C9;--Rd:#3E92A8;--Rl:#EEF7FA;--Rm:#BFE3EE;
--N:#1B2B5A;--Nd:#0F1B3D;--Nl:#EEF2FA;--Nm:#B8C4E0;
--W:#FFFFFF;--bg:#F4F6FB;--surf:#FFFFFF;
--bdr:#1B2B5A22;--bdr2:#57B1C935;
--t1:#0F1B3D;--t2:#1E293B;--t3:#475569;
--ok:#1D9E75;--okl:#DCFCE7;--warn:#D97706;--warnl:#FEF3C7;--err:#DC2626;--errl:#FEE2E2;
--r:8px;--r-lg:12px;--r-xl:18px;
--font:"Cairo",system-ui,sans-serif;
--sh:0 1px 3px rgba(27,43,90,.10);--sh-md:0 4px 20px rgba(27,43,90,.14)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--t1);font-size:14px;height:100vh;overflow:hidden;direction:rtl}
::-webkit-scrollbar{width:7px;height:7px}::-webkit-scrollbar-thumb{background:#c7d0e0;border-radius:99px}::-webkit-scrollbar-track{background:transparent}
.screen{display:none;height:100vh}.screen.on{display:flex}
button{font-family:inherit}
input,select,textarea{font-family:inherit}

/* LOGIN */
#login{align-items:center;justify-content:center;background:linear-gradient(145deg,#0F1B3D 0%,#1B2B5A 45%,#2A4A7A 72%,#57B1C9 100%);flex-direction:column;position:relative;overflow:hidden}
.orb{position:absolute;border-radius:50%;pointer-events:none}
.orb1{width:640px;height:640px;top:-220px;right:-180px;background:radial-gradient(circle,rgba(87,177,201,.20) 0%,transparent 65%)}
.orb2{width:560px;height:560px;bottom:-180px;left:-140px;background:radial-gradient(circle,rgba(27,43,90,.42) 0%,transparent 65%)}
.lcard{position:relative;z-index:2;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:var(--r-xl);backdrop-filter:blur(26px);padding:34px 32px;width:440px;max-width:94vw}
.llogo{display:flex;align-items:center;gap:13px;margin-bottom:22px;padding-bottom:20px;border-bottom:1px solid rgba(255,255,255,.1)}
.lmark{width:46px;height:46px;border-radius:13px;background:linear-gradient(135deg,#57B1C9,#3E92A8);display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 6px 18px rgba(87,177,201,.4)}
.lname{font-size:19px;font-weight:800;color:#fff}.ltag{font-size:10.5px;color:rgba(255,255,255,.45);margin-top:2px}
.lh{color:#fff;font-size:17px;font-weight:700;margin-bottom:16px}
.lfg{margin-bottom:14px}.lfg label{display:block;font-size:10px;font-weight:700;color:rgba(255,255,255,.55);margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em}
.li{width:100%;padding:11px 14px;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.14);border-radius:var(--r);color:#fff;font-size:14px;outline:none;transition:.15s}
.li::placeholder{color:rgba(255,255,255,.3)}.li:focus{border-color:#57B1C9;box-shadow:0 0 0 3px rgba(87,177,201,.25)}
.lerr{background:rgba(153,27,27,.32);border:1px solid rgba(239,68,68,.4);color:#FCA5A5;font-size:12px;padding:9px 12px;border-radius:9px;margin-bottom:13px;display:none}.lerr.on{display:block}
.lbtn{width:100%;padding:13px;background:linear-gradient(135deg,#57B1C9,#3E92A8);color:#fff;border:none;border-radius:var(--r);font-size:14px;font-weight:700;cursor:pointer;transition:.15s}
.lbtn:hover{box-shadow:0 8px 22px rgba(87,177,201,.4)}
.lhint{margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.1);font-size:10.5px;color:rgba(255,255,255,.5);line-height:1.9}
.lhint b{color:rgba(255,255,255,.8)}
.lquick{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.lqbtn{flex:1;min-width:78px;padding:7px 6px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:8px;color:#fff;font-size:10.5px;font-weight:600;cursor:pointer;transition:.15s}
.lqbtn:hover{background:rgba(87,177,201,.25);border-color:#57B1C9}

/* APP SHELL */
#app{display:none}
#app.on{display:flex;width:100%}
.sidebar{width:236px;background:linear-gradient(180deg,#0F1B3D 0%,#1B2B5A 62%,#2A2350 88%,#57B1C922 100%);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
.slogo{padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.12);display:flex;align-items:center;gap:11px}
.smark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#57B1C9,#3E92A8);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.slname{font-size:13px;font-weight:800;color:#fff}.sltag{font-size:9px;color:rgba(255,255,255,.4);margin-top:2px}
.school-pick{margin:12px 12px 4px;padding:9px 11px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:10px}
.school-pick label{font-size:8.5px;font-weight:700;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.08em}
.school-pick select{width:100%;margin-top:5px;padding:7px 8px;border-radius:7px;border:1px solid rgba(255,255,255,.16);background:#12203f;color:#fff;font-size:11.5px;font-weight:700;cursor:pointer;outline:none}
.ngrp{padding:13px 15px 5px;font-size:8.5px;font-weight:800;color:rgba(255,255,255,.3);text-transform:uppercase;letter-spacing:.11em}
.ni{display:flex;align-items:center;gap:10px;padding:8px 12px;margin:1px 8px;border-radius:9px;cursor:pointer;font-size:12px;color:rgba(255,255,255,.62);transition:.12s;user-select:none}
.ni:hover{background:rgba(255,255,255,.09);color:#fff}
.ni.on{background:var(--R)!important;color:#fff!important;font-weight:700;box-shadow:0 4px 12px rgba(87,177,201,.35)}
.ni-ic{font-size:15px;width:20px;text-align:center;flex-shrink:0}
.susr{border-top:1px solid rgba(255,255,255,.1);padding:12px 14px;display:flex;align-items:center;gap:9px;margin-top:auto}
.sav{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#57B1C9,#3E92A8);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex-shrink:0}
.suname{font-size:12px;font-weight:700;color:#fff}.surole{font-size:9.5px;color:rgba(255,255,255,.5);margin-top:1px}
.slogout{margin-right:auto;background:rgba(255,255,255,.08);border:none;border-radius:8px;width:30px;height:30px;color:#fff;cursor:pointer;font-size:14px;flex-shrink:0}
.slogout:hover{background:var(--err)}

.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{height:56px;background:var(--surf);border-bottom:3px solid var(--R);display:flex;align-items:center;padding:0 20px;gap:12px;flex-shrink:0;box-shadow:0 2px 8px rgba(27,43,90,.08)}
.tbtitle{font-size:15px;font-weight:800;color:var(--t1);flex:1}
.tbschool{font-size:11px;color:var(--t3);font-weight:600}
.tbbadge{font-size:9.5px;font-weight:800;padding:3px 11px;border-radius:20px;letter-spacing:.03em}
.tbbadge.manager{background:#EDE9FE;color:#5B21B6}.tbbadge.editor{background:var(--Nl);color:var(--N)}
.tbbadge.teacher{background:var(--okl);color:#065F46}.tbbadge.student{background:var(--warnl);color:#92400E}.tbbadge.affairs{background:var(--Rl);color:var(--Rd)}
.content{flex:1;overflow-y:auto;padding:18px 20px}
.page{display:none;flex-direction:column;gap:14px}.page.on{display:flex}

/* COMPONENTS */
.pghdr{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.pgtitle{font-size:16px;font-weight:800;color:var(--N)}
.pgsub{font-size:11.5px;color:var(--t3);margin-top:2px}
.card{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r-lg);padding:18px;box-shadow:var(--sh)}
.chdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.ctitle{font-size:13px;font-weight:800;color:var(--N);display:flex;align-items:center;gap:7px}
.mets{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px}
.met{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r-lg);padding:15px 16px;position:relative;overflow:hidden;box-shadow:var(--sh)}
.met::before{content:"";position:absolute;top:0;right:0;left:0;height:3px;background:var(--N)}
.met.teal::before{background:var(--R)}.met.green::before{background:var(--ok)}.met.amber::before{background:var(--warn)}.met.red::before{background:var(--err)}.met.purple::before{background:#7C3AED}
.mlbl{font-size:10px;font-weight:700;color:var(--t3);margin-bottom:6px;text-transform:uppercase;letter-spacing:.03em}
.mval{font-size:26px;font-weight:800;color:var(--N);line-height:1}
.msub{font-size:10.5px;color:var(--t3);margin-top:5px}
.mic{position:absolute;left:14px;top:14px;font-size:22px;opacity:.14}

.btn{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;border-radius:8px;cursor:pointer;transition:.12s;border:none;padding:8px 14px;white-space:nowrap;text-decoration:none}
.bpri{background:var(--N);color:#fff}.bpri:hover{background:var(--Nd)}
.bteal{background:var(--R);color:#fff}.bteal:hover{background:var(--Rd);box-shadow:0 4px 14px rgba(87,177,201,.35)}
.bgreen{background:var(--ok);color:#fff}.bgreen:hover{filter:brightness(.94)}
.bwarn{background:var(--warn);color:#fff}.bout{background:transparent;color:var(--t2);border:1px solid var(--bdr)}.bout:hover{background:var(--bg)}
.bred{background:transparent;color:var(--err);border:1.5px solid #FCA5A5}.bred:hover{background:var(--errl)}
.bsm{padding:6px 11px;font-size:11px}.bxsm{padding:4px 9px;font-size:10px}
.btn:disabled{opacity:.5;cursor:not-allowed}

.filterbar{display:flex;align-items:flex-end;flex-wrap:wrap;gap:11px;background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r-lg);padding:14px 16px;box-shadow:var(--sh)}
.fg{display:flex;flex-direction:column;gap:5px;min-width:130px}
.fg.grow{flex:1}
.fg label{font-size:10px;font-weight:800;color:var(--N);text-transform:uppercase;letter-spacing:.03em}
.fg input,.fg select{padding:8px 11px;border:1.5px solid var(--bdr);border-radius:8px;font-size:12px;color:var(--t1);background:#fff;outline:none;transition:.15s}
.fg input:focus,.fg select:focus{border-color:var(--R);box-shadow:0 0 0 3px rgba(87,177,201,.13)}

table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:right;padding:10px 11px;font-size:10px;font-weight:800;color:var(--t3);border-bottom:2px solid var(--bdr);white-space:nowrap;background:#EEF1F9;text-transform:uppercase;letter-spacing:.02em}
td{padding:9px 11px;border-bottom:1px solid var(--bdr);color:var(--t2);vertical-align:middle}
tr:last-child td{border-bottom:none}tr:hover td{background:var(--Nl)}
.tbwrap{overflow-x:auto;border-radius:var(--r-lg)}
.badge{display:inline-flex;align-items:center;font-size:10px;font-weight:700;padding:3px 10px;border-radius:20px;white-space:nowrap}
.bg{background:var(--okl);color:#065F46}.br{background:var(--errl);color:#991B1B}.ba{background:var(--warnl);color:#92400E}
.bb{background:var(--Nl);color:var(--N)}.bn{background:#F1F5F9;color:#475569}.bt{background:var(--Rl);color:var(--Rd)}.bpur{background:#EDE9FE;color:#5B21B6}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:5px 11px;border-radius:20px;background:var(--Nl);color:var(--N)}
.chip.teal{background:var(--Rl);color:var(--Rd)}.chip.green{background:var(--okl);color:#065F46}.chip.amber{background:var(--warnl);color:#92400E}.chip.red{background:var(--errl);color:#991B1B}

.empty{text-align:center;padding:40px 20px;color:var(--t3)}
.empty-ic{font-size:40px;opacity:.3;margin-bottom:10px}
.empty-t{font-size:14px;font-weight:700;color:var(--t2)}
.empty-s{font-size:12px;margin-top:5px}

/* TIMETABLE GRID */
.ttwrap{overflow:auto;border:1px solid var(--bdr);border-radius:var(--r-lg);background:#fff}
.ttable{border-collapse:collapse;width:100%;min-width:760px}
.ttable th,.ttable td{border:1px solid #dde3ef;padding:0;text-align:center}
.ttable thead th{background:var(--N);color:#fff;font-size:10.5px;font-weight:700;padding:7px 4px;position:sticky;top:0;z-index:2}
.tt-daycol{background:#EEF1F9;color:var(--N);font-weight:800;font-size:11px;width:74px;position:sticky;right:0;z-index:1}
.tt-brk{background:repeating-linear-gradient(45deg,#f8fafc,#f8fafc 6px,#eef1f7 6px,#eef1f7 12px);width:26px}
.tt-brk span{writing-mode:vertical-rl;font-size:8.5px;color:var(--t3);font-weight:700}
.tt-cell{min-width:66px;height:56px;cursor:pointer;position:relative;transition:.1s;padding:3px}
.tt-cell:hover{outline:2px solid var(--R);outline-offset:-2px;z-index:3}
.tt-cell.filled{color:#fff}
.tt-sub{font-size:10px;font-weight:800;line-height:1.15;padding:1px 2px}
.tt-tea{font-size:8.5px;opacity:.92;margin-top:2px;line-height:1.1}
.tt-topic{font-size:7.5px;opacity:.8;margin-top:1px;line-height:1.05;max-height:20px;overflow:hidden}
.tt-cont{background-image:linear-gradient(rgba(255,255,255,.12),rgba(255,255,255,.12))}
.tt-empty-dot{color:#cbd5e1;font-size:15px}
.tt-cell.editable-topic{box-shadow:inset 0 0 0 2px var(--ok)}

/* MODAL */
.mover{position:fixed;inset:0;background:rgba(15,27,61,.55);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:200;padding:20px}
.mover.on{display:flex}
.mbox{background:#fff;border-radius:var(--r-xl);width:520px;max-width:96vw;max-height:92vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(15,27,61,.4)}
.mbox.wide{width:720px}
.mhdr{padding:15px 20px;display:flex;align-items:center;justify-content:space-between;background:var(--N);color:#fff}
.mhdr.teal{background:var(--R)}.mhdr.green{background:var(--ok)}
.mtitle{font-size:14px;font-weight:800}
.mcls{background:rgba(255,255,255,.16);border:none;width:28px;height:28px;border-radius:8px;color:#fff;cursor:pointer;font-size:14px}
.mcls:hover{background:rgba(255,255,255,.28)}
.mbody{padding:20px;overflow-y:auto}
.mfoot{padding:14px 20px;border-top:1px solid var(--bdr);display:flex;justify-content:flex-end;gap:9px;background:#fafbfe}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.fm{display:flex;flex-direction:column;gap:5px}.fm.full{grid-column:1/-1}
.fm label{font-size:10.5px;font-weight:800;color:var(--t2)}
.fm input,.fm select,.fm textarea{padding:9px 11px;border:1.5px solid var(--bdr);border-radius:8px;font-size:13px;color:var(--t1);background:#fff;outline:none}
.fm input:focus,.fm select:focus,.fm textarea:focus{border-color:var(--R);box-shadow:0 0 0 3px rgba(87,177,201,.13)}

/* TOASTS */
.toasts{position:fixed;bottom:20px;left:20px;z-index:400;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--N);color:#fff;padding:11px 18px;border-radius:10px;font-size:12.5px;font-weight:700;box-shadow:0 10px 30px rgba(15,27,61,.35);animation:tin .25s;display:flex;align-items:center;gap:8px}
.toast.s{background:var(--ok)}.toast.e{background:var(--err)}.toast.w{background:var(--warn)}
@keyframes tin{from{transform:translateY(14px);opacity:0}to{transform:translateY(0);opacity:1}}

.seg{display:inline-flex;background:#EEF1F9;border-radius:9px;padding:3px;gap:2px}
.seg button{border:none;background:transparent;padding:7px 14px;border-radius:7px;font-size:11.5px;font-weight:700;color:var(--t3);cursor:pointer;transition:.12s}
.seg button.on{background:#fff;color:var(--N);box-shadow:var(--sh)}

.info{background:var(--Rl);border:1px solid var(--Rm);border-radius:10px;padding:11px 14px;font-size:11.5px;color:var(--Rd);line-height:1.7}
.warnbox{background:var(--warnl);border:1px solid #FCD34D;border-radius:10px;padding:11px 14px;font-size:11.5px;color:#92400E;line-height:1.7}
.colordot{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:middle;margin-left:5px}
.hidden{display:none!important}

/* student day view + mobile grid polish */
.daychips{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:2px 2px 8px;margin-bottom:10px}
.daychip{flex:0 0 auto;padding:9px 16px;border-radius:22px;border:1.5px solid var(--bdr);background:#fff;font-weight:800;font-size:13px;color:var(--t2);cursor:pointer;white-space:nowrap}
.daychip.on{background:#57B1C9;color:#fff;border-color:#57B1C9;box-shadow:0 4px 12px rgba(87,177,201,.4)}
.daylist{display:flex;flex-direction:column;gap:10px}
.daycard{background:#fff;border:1px solid var(--bdr);border-radius:13px;padding:12px 14px;box-shadow:var(--sh)}
.dc-time{font-size:12px;color:#3E92A8;font-weight:800}
.dc-sub{font-size:16px;font-weight:800;color:var(--N);margin:3px 0}
.dc-meta{font-size:12.5px;color:var(--t2)}
.dc-topic{margin-top:7px;font-size:12.5px;background:#FEF9C3;border-radius:8px;padding:7px 9px;color:#713f12;font-weight:600;line-height:1.6;white-space:pre-wrap}
/* top-bar logout (mobile) */
.tb-logout{display:none;background:var(--err);color:#fff;border:none;border-radius:9px;width:40px;height:40px;font-size:18px;cursor:pointer;margin-right:6px}
@media (max-width:900px){
  .tb-logout{display:inline-flex;align-items:center;justify-content:center}
  /* keep the day column visible while scrolling the full weekly grid */
  .ttable .tt-daycol{position:sticky;right:0;z-index:5;background:#EEF1F9;box-shadow:-3px 0 5px rgba(0,0,0,.08)}
  .ttable thead .tt-daycol{z-index:6;background:#1B2B5A;color:#fff}
  .daychip{padding:10px 18px;font-size:14px}
}

/* two-box opening portal */
.cardlogos.big{display:flex;gap:20px;justify-content:center;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.cardlogos.big .logo{height:60px;width:104px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.portal-choose{display:flex;gap:16px;margin:18px 0 4px}
.portal-card{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:26px 14px;border-radius:18px;border:2px solid var(--bdr);background:#fff;cursor:pointer;transition:.18s;min-height:130px}
.portal-card:hover{border-color:#57B1C9;box-shadow:0 10px 26px rgba(87,177,201,.28);transform:translateY(-2px)}
.portal-card .pc-ic{font-size:44px}
.portal-card .pc-t{font-size:17px;font-weight:800;color:var(--N)}
.lback{background:none;border:none;color:#57B1C9;font-weight:800;cursor:pointer;font-size:13px;margin-bottom:8px}
@media (max-width:560px){
  .cardlogos.big{gap:12px}
  .cardlogos.big .logo{height:46px;width:80px}
  .portal-choose{flex-direction:row;gap:10px}
  .portal-card{padding:18px 8px;min-height:110px}
  .portal-card .pc-ic{font-size:36px}
  .portal-card .pc-t{font-size:15px}
}
/* mobile: tabs scroll horizontally, tables scroll */
@media (max-width:900px){
  .tabs{overflow-x:auto;-webkit-overflow-scrolling:touch;flex-wrap:nowrap}
  .tabs .tab{flex:0 0 auto;white-space:nowrap}
  .tbwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .segbtns{flex-wrap:wrap}
  .mets{grid-template-columns:1fr 1fr}
}

/* dark mode + font scaling */
body.dark{--bg:#0E1626;--surf:#16213B;--W:#16213B;--Nl:#1b2b5a55;--Rl:#12303a;--t1:#E8EEF9;--t2:#C7D2E5;--t3:#9FB0CE;--bdr:#ffffff22;--bdr2:#57B1C955;--warnl:#3a2f10;--okl:#12331f;}
body.dark{background:var(--bg);color:var(--t1)}
body.dark .card,body.dark .mbox,body.dark .met,body.dark .stagebox,body.dark .gradebox{background:#16213B;color:var(--t1)}
body.dark .topbar,body.dark .sidebar,body.dark .brandbar{background:#0F1B3D!important;color:#E8EEF9}
body.dark input,body.dark select,body.dark textarea{background:#1b2740;color:#E8EEF9;border-color:#ffffff33}
body.dark .pgtitle,body.dark .ctitle,body.dark .mtitle,body.dark .tbtitle{color:#E8EEF9}

/* ===== mobile layout fixes (v2): dynamic viewport + topbar scroll + bottom safe area ===== */
@media (max-width:900px){
  #app.screen{height:100vh;height:100dvh}
  .main{height:100vh;height:100dvh}
  .content{padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));min-height:0}
  .topbar{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;gap:6px;padding:0 10px;height:52px}
  .topbar::-webkit-scrollbar{display:none}
  .topbar .tb-ico{flex:0 0 auto;height:34px;min-width:34px;padding:0 7px;font-size:13px;margin-right:4px}
  .topbar #tb-install{padding:0 8px}
  .tbtitle{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34vw}
  .tbschool{display:none}
  .tb-logout{flex:0 0 auto}
  .brandbar{flex-wrap:nowrap;overflow:hidden}
  .brandbar .bcenter{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ttwrap,.tbwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
}
@supports(height:100dvh){@media (max-width:900px){#app.screen,.main{height:100dvh}}}

#login .lcard{padding:16px 18px 20px;max-width:420px}
#login .cardlogos.big{gap:12px;margin-bottom:8px}
#login .cardlogos.big .logo{height:40px;width:70px}
#login .ltag{font-size:12px;margin-bottom:4px}
#login .portal-choose{margin:12px 0 2px;gap:12px}
#login .portal-card{min-height:96px;padding:14px 8px}
#login .portal-card .pc-ic{font-size:34px}
#login .lh{margin:6px 0}
@media (max-height:720px){#login .cardlogos.big .logo{height:34px;width:58px}#login .portal-card{min-height:84px}#login .portal-card .pc-ic{font-size:28px}}

/* ===== mobile fixes v3 (critical for students) ===== */
@media (max-width:900px){
  html,body{height:auto;min-height:100%}
  #app.screen{height:100dvh;height:100vh;overflow:hidden}
  .main{height:100dvh;height:100vh;display:flex;flex-direction:column;min-height:0}
  .brandbar{flex:0 0 auto;padding:6px 8px;min-height:0}
  .brandbar .logo{height:26px!important;width:44px!important}
  .brandbar .bcenter{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42vw}
  .topbar{flex:0 0 auto}
  .content{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 12px calc(120px + env(safe-area-inset-bottom,0px)) 12px}
  .ttwrap,.tbwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
  .daycard{width:100%}
  .mets{grid-template-columns:1fr 1fr}
  .card{padding:12px}
  .filterbar{flex-wrap:wrap}
  .filterbar .fg{min-width:44%}
}
@media (max-width:480px){
  .mets{grid-template-columns:1fr 1fr}
  .brandbar .bcenter{max-width:36vw}
}

/* ===== mobile v4: hide brandbar after login, stack portal, 2x2 logos ===== */
@media (max-width:900px){
  .brandbar{display:none!important}                 /* hide the top logos bar so content fills screen */
  .main{height:100dvh;height:100vh}
  .content{padding:12px 12px calc(130px + env(safe-area-inset-bottom,0px)) 12px;overflow-y:auto;-webkit-overflow-scrolling:touch}
  /* opening screen: logos 2x2, portal cards stacked */
  #login .cardlogos.big{display:grid;grid-template-columns:1fr 1fr;gap:10px;justify-items:center;max-width:240px;margin:0 auto 12px}
  #login .cardlogos.big .logo{height:40px;width:74px}
  #login .cardlogos.big{margin:0 auto 10px}
  #login .lname{font-size:15px;margin:2px 0}
  #login .ltag{font-size:11px;margin-bottom:6px}

  #login .portal-card{width:100%;min-height:52px;flex-direction:row;justify-content:center;gap:10px;padding:10px 8px}
  #login .portal-card .pc-ic{font-size:24px}
  #login .portal-card .pc-t{font-size:15px}
  #login .lcard{max-width:100%;padding:12px}
}
@media (max-width:900px) and (max-height:640px){
  #login .cardlogos.big .logo{height:32px;width:58px}
  #login .portal-card{min-height:72px}
}

/* login logos a bit larger (mobile) to match cards */
@media (max-width:900px){
  #login .cardlogos.big .logo{height:48px;width:86px}
  #login .cardlogos.big{max-width:210px}
}

@media (max-width:900px){

  .stu-topline{padding:7px 9px;gap:6px}

/* hide the in-app top logos bar for everyone (logos remain on the login screen only) */
.brandbar{display:none!important}
/* give more room at the bottom so last rows/cards always show on mobile */

/* ===== additions v2 ===== */
.slogout-full{margin:8px 12px 12px;padding:11px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:10px;color:#fff;cursor:pointer;font-size:12.5px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px;transition:.15s;font-family:inherit}
.slogout-full:hover{background:var(--err);border-color:var(--err);box-shadow:0 6px 16px rgba(220,38,38,.4)}
.susr{border-top:1px solid rgba(255,255,255,.1);padding:12px 14px 4px;display:flex;align-items:center;gap:9px;margin-top:auto}
/* distinctive lesson topic */
.tt-topic{display:inline-block;margin-top:3px;font-size:8px;font-weight:800;line-height:1.15;background:#fff;color:#0F1B3D;border-radius:5px;padding:2px 5px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.tt-topic::before{content:"📌 "}
.tt-cell.has-topic{box-shadow:inset 0 0 0 2px #fde047}
/* break column */
.tt-brk{background:repeating-linear-gradient(45deg,#FEF3C7,#FEF3C7 6px,#FDE68A 6px,#FDE68A 12px);width:34px;min-width:34px}
.tt-brk span{writing-mode:vertical-rl;transform:rotate(180deg);font-size:10px;color:#92400E;font-weight:900;letter-spacing:1px}
thead th.tt-brk{background:#F59E0B;color:#fff}
thead th.tt-brk span{writing-mode:horizontal-tb;transform:none}
/* tabs */
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--bdr);flex-wrap:wrap}
.tab{padding:9px 15px;font-size:12px;font-weight:700;color:var(--t3);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;transition:.12s;user-select:none}
.tab:hover{color:var(--N)}
.tab.on{color:var(--N);border-bottom-color:var(--R)}
/* active filter chips */
.fchips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.fchip{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;background:var(--Rl);color:var(--Rd);border:1px solid var(--Rm)}
.fchip b{color:var(--N)}
/* period editor */
.prow{display:flex;align-items:center;gap:8px;padding:7px 9px;border:1.5px solid var(--bdr);border-radius:9px;margin-bottom:7px;background:#fff}
.prow.brk{background:#FFFBEB;border-color:#FDE68A}
.prow .pidx{font-size:10px;font-weight:800;min-width:56px;color:var(--N)}
.prow input[type=time]{padding:6px 8px;border:1.5px solid var(--bdr);border-radius:7px;font-family:inherit;font-size:12px}
.prow input.plabel{flex:1;padding:6px 8px;border:1.5px solid var(--bdr);border-radius:7px;font-family:inherit;font-size:12px}
.iconbtn{width:28px;height:28px;border-radius:7px;border:1px solid var(--bdr);background:#fff;cursor:pointer;font-size:13px;color:var(--t2)}
.iconbtn:hover{background:var(--bg)}
.iconbtn.del:hover{background:var(--errl);color:var(--err);border-color:#FCA5A5}
/* stage tree */
.stagebox{border:1px solid var(--bdr);border-radius:11px;padding:12px;margin-bottom:11px;background:#fff}
.stagehd{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.stagehd .nm{font-size:13.5px;font-weight:800;color:var(--N)}
.gradebox{border:1px dashed var(--bdr2);border-radius:9px;padding:9px 11px;margin:7px 0;background:var(--Rl)}
.gradehd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.gradehd .nm{font-size:12px;font-weight:800;color:var(--Rd)}
.clschips{display:flex;flex-wrap:wrap;gap:6px}
.clschip{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--bdr);border-radius:20px;padding:4px 10px;font-size:11px;font-weight:700;color:var(--N)}
.clschip .x{cursor:pointer;color:var(--err);font-weight:900}
/* homework / exam item */
.hwitem{border:1px solid var(--bdr);border-right:4px solid var(--R);border-radius:10px;padding:12px 14px;background:#fff;box-shadow:var(--sh)}
.hwitem.exam{border-right-color:#7C3AED}
.hwitem.quiz{border-right-color:#0891b2}
.hwitem.monthly{border-right-color:#D97706}
.hwitem.midyear,.hwitem.final{border-right-color:#DC2626}
.hwmeta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:7px}
.hwtxt{font-size:13px;color:var(--t1);line-height:1.7;font-weight:600}
.hwdate{font-size:11px;color:var(--t3);font-weight:700}

/* ===== v3 additions ===== */
.tt-off{background:#F1F5F9}
.tt-off span{color:#CBD5E1;font-size:9px}
.ttable.blocks th,.ttable.blocks td{min-width:40px;font-size:9px;padding:3px 2px}
.ttable.blocks .tt-daycol{min-width:70px;font-size:10px}
.ttable.blocks .tt-sub{font-size:9.5px}
.ttable.blocks .tt-tea{font-size:8px}
.blkspan{font-size:7.5px;opacity:.85}
.lremember{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--t2);margin:4px 2px 2px;cursor:pointer;user-select:none}
.lremember input{width:16px;height:16px;accent-color:var(--R)}
/* dashboard stats */
.schoolstat{border:1px solid var(--bdr);border-radius:14px;padding:0;overflow:hidden;background:#fff;box-shadow:var(--sh);margin-bottom:14px}
.schoolstat .sst-hd{background:linear-gradient(120deg,var(--N),#25407e);color:#fff;padding:13px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.schoolstat .sst-hd .nm{font-size:14.5px;font-weight:800}
.schoolstat .sst-hd .sub{font-size:10.5px;opacity:.8}
.sst-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--bdr)}
.sst-cell{background:#fff;padding:12px 13px}
.sst-cell .k{font-size:10.5px;color:var(--t3);font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:5px}
.sst-cell .v{font-size:20px;font-weight:900;color:var(--N);line-height:1}
.sst-cell .d{font-size:10px;color:var(--t3);margin-top:3px}
.sst-cell.good .v{color:#1D9E75}.sst-cell.warn .v{color:#D97706}.sst-cell.bad .v{color:#DC2626}
.sbar{height:7px;border-radius:20px;background:#eef1f7;overflow:hidden;margin-top:7px}
.sbar>span{display:block;height:100%}

/* clearer sidebar menu (always visible, not only on hover) */
.ni{color:rgba(255,255,255,.9)!important}
.ngrp{color:rgba(255,255,255,.5)!important}
.ni-ic{opacity:1}
/* page-level school filter */
.schoolbar{display:flex;align-items:center;gap:10px;background:linear-gradient(120deg,var(--N),#25407e);color:#fff;border-radius:12px;padding:10px 14px;margin-bottom:12px;flex-wrap:wrap}
.schoolbar .lb{font-size:11px;font-weight:800;opacity:.85}
.schoolbar select{background:#fff;color:var(--N);border:none;border-radius:8px;padding:7px 12px;font-family:inherit;font-weight:700;font-size:12.5px;min-width:220px}
.schoolbar .fixed{font-size:13px;font-weight:800}
.segbtns{display:inline-flex;gap:0;border:1.5px solid var(--bdr);border-radius:9px;overflow:hidden}
.segbtns button{border:none;background:#fff;padding:7px 14px;font-family:inherit;font-size:11.5px;font-weight:700;color:var(--t2);cursor:pointer}

/* logo chips */
.logo{display:block;height:46px;width:84px;background-size:contain;background-repeat:no-repeat;background-position:center;background-color:#fff;border-radius:9px;padding:5px;box-sizing:border-box}
.logo.moe{background-image:var(--logo-moe)}
.logo.ntss{background-image:var(--logo-ntss)}
.logo.ebda{background-image:var(--logo-ebda)}
.logo.at{background-image:var(--logo-at)}
.lgroup{display:flex;align-items:center;gap:12px}
/* login logo bar */
.loginlogos{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;width:min(760px,94vw);margin-bottom:20px;gap:12px;flex-wrap:wrap}
.loginlogos .logo{height:56px;width:104px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
/* app brand bar */
.brandbar{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff;border-bottom:1px solid var(--bdr);padding:8px 18px}
.brandbar .bcenter{font-size:13px;font-weight:800;color:var(--N);text-align:center;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brandbar .logo{height:40px;width:74px;background-color:transparent;box-shadow:none;padding:0}
@media(max-width:640px){.brandbar .bcenter{display:none}.brandbar .logo{height:32px;width:58px}}
/* FIX: dropdown option contrast (were white-on-white on the login screen) */
select.li option,select.li optgroup{color:#0F1B3D;background:#fff}
select option{color:#0F1B3D;background:#fff}
/* brighten login text so it is always readable (not only on hover) */
.lfg label{color:rgba(255,255,255,.82)!important}
.ltag{color:rgba(255,255,255,.7)!important}
.lhint{color:rgba(255,255,255,.75)!important}
.lhint b{color:#fff!important}
/* logos inside the login card header */
.cardlogos{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.cardlogos .logo{height:42px;width:72px;box-shadow:0 4px 12px rgba(0,0,0,.18)}

/* ===== primary color adoption: #57B1C9 ===== */
:root{--R:#57B1C9;--Rd:#3E92A8;--Rl:#EEF7FA;--Rm:#BFE3EE}
.lbtn,.btn.bpri,.btn.bteal{background:#57B1C9!important;border-color:#57B1C9!important;color:#fff!important}
.lbtn:hover,.btn.bpri:hover,.btn.bteal:hover{background:#3E92A8!important;border-color:#3E92A8!important}
.btn.bout{border-color:#BFE3EE!important;color:#3E92A8!important}
.btn.bout:hover{background:#EEF7FA!important}
.sidebar{background:linear-gradient(165deg,#0F2A38 0%,#12586c 55%,#57B1C9 130%)!important}
.ni.on{background:rgba(87,177,201,.22)!important;border-right:3px solid #57B1C9!important}
.smark{background:#57B1C9!important}
.brandbar .bcenter{color:#3E92A8!important}
.tbbadge.manager{background:#57B1C9!important;color:#fff!important}
.tab.on{color:#3E92A8!important;border-bottom-color:#57B1C9!important}
.pgtitle{color:#1B2B5A}
a{color:#3E92A8}

/* ============================================================
   MOBILE RESPONSIVE (login fit/scroll + off-canvas nav + touch grid)
   ============================================================ */
/* login: never hide the button — allow scroll, shrink on small screens */
#login.screen{overflow-y:auto;align-items:center}
@media (max-height:760px){#login.screen{align-items:flex-start}}
@media (max-width:640px){
  .loginlogos{display:none}
  .cardlogos .logo{height:34px;width:58px}
  .lcard{margin:10px auto;padding:20px 18px;max-width:94vw}
  .lname{font-size:16px}.lh{font-size:15px}
  .lfg{margin-bottom:10px}
  .li{padding:11px 12px;font-size:14px}
  .lbtn{padding:13px;font-size:15px}
}
/* hamburger button (hidden on desktop) */
.navtoggle{display:none;background:var(--R);color:#fff;border:none;border-radius:9px;width:40px;height:40px;font-size:20px;cursor:pointer;margin-left:8px}
.navscrim{display:none}
@media (max-width:900px){
  .navtoggle{display:inline-flex;align-items:center;justify-content:center}
  /* app becomes single column with an off-canvas drawer */
  #app.screen{display:block;height:100vh;overflow:hidden}
  .sidebar{position:fixed;top:0;right:-86vw;width:82vw;max-width:320px;height:100vh;z-index:120;transition:right .25s ease;box-shadow:-8px 0 24px rgba(0,0,0,.3);overflow-y:auto}
  #app.nav-open .sidebar{right:0}
  #app.nav-open .navscrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:110}
  .main{height:100vh;display:flex;flex-direction:column}
  .content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px}
  .brandbar{padding:6px 10px}
  .brandbar .logo{height:30px;width:52px}
  .topbar{position:sticky;top:0;z-index:60}
  /* filters & cards wrap and go full width */
  .filterbar{flex-direction:column;align-items:stretch}
  .filterbar .fg{width:100%}
  .filterbar select,.filterbar input{width:100%}
  .schoolbar{flex-direction:column;align-items:stretch}
  .schoolbar select{width:100%;min-width:0}
  .mets{grid-template-columns:1fr 1fr}
  .pghdr{flex-direction:column;align-items:flex-start;gap:8px}
  .mbox,.mbox.wide{width:94vw!important;max-width:94vw}
  .fgrid{grid-template-columns:1fr!important}
  /* timetable: smooth horizontal scroll + bigger touch targets */
  .ttwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--bdr);border-radius:10px}
  .ttable.blocks th,.ttable.blocks td{min-width:46px;font-size:10px;padding:5px 3px}
  .ttable.blocks .tt-daycol{min-width:66px}
  .tt-cell{min-height:40px}
  table{font-size:12px}
  .btn{padding:9px 12px}
}
@media (max-width:400px){ .mets{grid-template-columns:1fr} }

/* ============================================================
   LOGIN LAYOUT FIX — center the card, fit content, tidy logos
   ============================================================ */
/* center vertically & horizontally; scroll only if truly needed */
#login.screen{align-items:center!important;justify-content:center!important;padding:20px 12px;overflow-y:auto}
/* the top wide logo bar: smaller and centered above the card */
.loginlogos{justify-content:center;gap:18px;width:auto;max-width:96vw;margin:0 auto 14px}
.loginlogos .logo{height:44px;width:80px;box-shadow:0 4px 14px rgba(0,0,0,.22)}
/* login card: compact, centered, capped height with internal scroll as last resort */
.lcard{margin:0 auto;max-height:92vh;overflow-y:auto}
.cardlogos{margin-bottom:12px}
.cardlogos .logo{height:38px;width:66px}
.lh{margin:10px 0 12px}
.lfg{margin-bottom:11px}
/* on shorter/desktop screens keep it centered but allow scroll if the card is tall */
@media (min-width:641px) and (max-height:820px){
  .loginlogos{display:none} /* logos already shown inside the card */
  .lcard{margin:0 auto}
}

/* block engine (ACTIVE) */
function BLOCKS(){return S().cfg.blocks||[];}
function isBrk(b){return !!(BLOCKS()[b]&&BLOCKS()[b].brk);}
function blabel(b){const p=BLOCKS()[b]||{};return p.brk?(p.label||'بريك'):(p.t+'-'+p.e);}
function btime(b){const p=BLOCKS()[b]||{};return (p.t||'')+'–'+(p.e||'');}
function dayEnd(d){const dd=S().cfg.days[d];return dd?(dd.end||BLOCKS().length):BLOCKS().length;}
function dayName(d){const dd=S().cfg.days[d];return dd?dd.name:'';}
function nDays(){return S().cfg.days.length;}
function teachBlocks(d){const out=[];const end=dayEnd(d);for(let b=0;b<end;b++)if(!isBrk(b))out.push(b);return out;}
/* generic (any sd) */
function gCoverAt(g,d,b){const c=g[d+'-'+b];if(!c)return null;const start=(c.cont!=null)?c.cont:b;return {start,cell:g[d+'-'+start]};}
function gLoad(sd,teaId){let n=0;Object.values(sd.grid||{}).forEach(g=>Object.keys(g).forEach(k=>{const c=g[k];if(c&&c.cont==null&&c.tea===teaId)n+=(c.span||2)/2;}));return n;}
function gLessons(sd,teaId,dayIdx){const out=[];(sd.classes||[]).forEach(cl=>{const g=sd.grid[cl.id]||{};Object.keys(g).forEach(k=>{const c=g[k];if(!c||c.cont!=null)return;if(teaId&&c.tea!==teaId)return;const[d,b]=k.split('-').map(Number);if(dayIdx!=null&&d!==dayIdx)return;out.push({classId:cl.id,d,b,c});});});return out;}
/* ACTIVE wrappers */
function coverAt(classId,d,b){return gCoverAt(S().grid[classId]||{},d,b);}
function teacherLoad(teaId){return gLoad(S(),teaId);}
function teacherBusyRange(teaId,d,b,span,exceptClass){for(let k=0;k<span;k++){for(const cl of S().classes){if(cl.id===exceptClass)continue;const ci=gCoverAt(S().grid[cl.id]||{},d,b+k);if(ci&&ci.cell&&ci.cell.tea===teaId)return true;}}return false;}
function roomBusyRange(roomId,d,b,span,exceptClass){if(!roomId)return false;for(let k=0;k<span;k++){for(const cl of S().classes){if(cl.id===exceptClass)continue;const ci=gCoverAt(S().grid[cl.id]||{},d,b+k);if(ci&&ci.cell&&ci.cell.room===roomId)return true;}}return false;}
function classFreeRange(classId,d,b,span,exceptStart){const g=S().grid[classId]||{};const end=dayEnd(d);for(let k=0;k<span;k++){const bb=b+k;if(bb>=end||isBrk(bb))return false;const ci=gCoverAt(g,d,bb);if(ci&&ci.start!==exceptStart)return false;}return true;}
function validStart(d,b,span){const end=dayEnd(d);for(let k=0;k<span;k++){if(b+k>=end||isBrk(b+k))return false;}return true;}
function countConflicts(){let n=0;const s=S();for(let d=0;d<nDays();d++){const end=dayEnd(d);for(let b=0;b<end;b++){if(isBrk(b))continue;const seen={};s.classes.forEach(cl=>{const ci=gCoverAt(s.grid[cl.id]||{},d,b);if(ci&&ci.cell&&ci.cell.tea)seen[ci.cell.tea]=(seen[ci.cell.tea]||0)+1;});Object.values(seen).forEach(v=>{if(v>1)n++;});}}return n;}

0;width:0;height:0;border:0;';document.body.appendChild(ifr);const idoc=ifr.contentWindow&&ifr.contentWindow.document;if(idoc){idoc.open();idoc.write(doc);idoc.close();setTimeout(()=>{try{ifr.contentWindow.focus();ifr.contentWindow.print();}catch(e){}setTimeout(()=>ifr.remove(),1500);},400);toast('جارٍ فتح الطباعة — اختر "حفظ PDF"','s');return;}}catch(e){}try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([doc],{type:'text/html'}));a.download=(title||'تقرير')+'.html';document.body.appendChild(a);a.click();a.remove();toast('تم تنزيل التقرير كملف HTML','w');}catch(e){toast('تعذّر إنشاء التقرير','e');}}

function ttGeneric(lessonAt,click,range){const cols=BLOCKS().length;const _inR=b=>!range||(b>=range[0]&&b<=range[1]);
  let h=`<div class="ttwrap"><table class="ttable blocks"><thead><tr><th class="tt-daycol">اليوم \\ التوقيت</th>`;
  BLOCKS().forEach((p,b)=>{if(!_inR(b))return;h+= p.brk?`<th class="tt-brk"><span>${esc(p.label||'بريك')}<br>${esc(p.t)}</span></th>`:`<th>${esc(p.t)}<br>${esc(p.e)}</th>`;});
  h+='</tr></thead><tbody>';
  for(let d=0;d<nDays();d++){h+='<tr><td class="tt-daycol">'+esc(dayName(d))+'</td>';let skip=0;const end=dayEnd(d);
    for(let b=0;b<cols;b++){if(skip>0){skip--;continue;}
      if(!_inR(b))continue;
      if(b>=end){h+='<td class="tt-off"><span>—</span></td>';continue;}
      if(isBrk(b)){h+='<td class="tt-brk"><span>بريك</span></td>';continue;}
      const c=lessonAt(d,b);const onc=click?(' onclick="'+click(d,b)+'"'):'';
      if(!c){h+='<td class="tt-cell"'+onc+'><span class="tt-empty-dot">·</span></td>';continue;}
      const span=c.span||2;skip=span-1;
      h+='<td class="tt-cell filled'+(c.l3?' has-topic':'')+'" colspan="'+span+'" style="background:'+(c.color||'#64748b')+'"'+onc+'><div class="tt-sub">'+esc(c.l1||'')+'</div>'+(c.l2?'<div class="tt-tea">'+esc(c.l2)+'</div>':'')+(c.l3?'<div class="tt-topic">'+esc(c.l3)+'</div>':'')+'<div class="blkspan">'+(span===3?'حصة ونصف':'حصة')+'</div></td>';}
    h+='</tr>';}
  return h+'</tbody></table></div>';}
function topicStatus(teaId,classId,subId,topic){if(!topic)return '';const ps=(S().plans||[]).filter(p=>p.teacherId===teaId&&p.classId===classId&&p.subId===subId&&p.status==='approved');if(!ps.length)return '';const set=new Set();ps.forEach(p=>(p.items||[]).forEach(it=>{if(it.title)set.add(it.title.trim());}));return set.has((topic||'').trim())?'ok':'off';}
function topicDisp(teaId,classId,subId,topic){if(!topic)return '';const st=topicStatus(teaId,classId,subId,topic);return (st==='off'?'⚠ ':st==='ok'?'✓ ':'')+topic;}
function classLessonAt(classId){const g=S().grid[classId]||{};return(d,b)=>{const c=g[d+'-'+b];if(!c||c.cont!=null||!c.sub)return null;const sb=subj(c.sub),t=tea(c.tea),rm=c.room?room(c.room):null;return{span:c.span||2,color:sb.color,l1:sb.name,l2:(t.name||'—')+(rm?' · '+rm.name:''),l3:topicDisp(c.tea,classId,c.sub,c.topic)};};}
function teacherLessonAt(teaId){const s=S(),map={};s.classes.forEach(cl=>{const g=s.grid[cl.id]||{};Object.keys(g).forEach(k=>{const c=g[k];if(c&&c.cont==null&&c.tea===teaId)map[k]={c,cl};});});return(d,b)=>{const e=map[d+'-'+b];if(!e)return null;const sb=subj(e.c.sub),rm=e.c.room?room(e.c.room):null;return{span:e.c.span||2,color:sb.color,l1:sb.name,l2:e.cl.name+(rm?' · '+rm.name:''),l3:topicDisp(e.c.tea,e.cl.id,e.c.sub,e.c.topic)};};}
function ttPrintTable(lessonAt){const cols=BLOCKS().length;let h='<table><thead><tr><th>اليوم</th>';BLOCKS().forEach(p=>h+= p.brk?'<th style="font-size:7px;background:#F59E0B;color:#fff">بريك<br>'+esc(p.t)+'</th>':'<th style="font-size:8px">'+esc(p.t)+'<br>'+esc(p.e)+'</th>');h+='</tr></thead><tbody>';
  for(let d=0;d<nDays();d++){h+='<tr><td style="font-weight:800;background:#EEF1F9">'+esc(dayName(d))+'</td>';let skip=0;const end=dayEnd(d);
    for(let b=0;b<cols;b++){if(skip>0){skip--;continue;}if(b>=end){h+='<td style="background:#F1F5F9"></td>';continue;}if(isBrk(b)){h+='<td style="background:#FEF3C7"></td>';continue;}const c=lessonAt(d,b);if(!c){h+='<td></td>';continue;}const span=c.span||2;skip=span-1;h+='<td colspan="'+span+'" style="background:'+c.color+'22"><b style="font-size:9px">'+esc(c.l1||'')+'</b>'+(c.l2?'<br><span style="font-size:7px">'+esc(c.l2)+'</span>':'')+(c.l3?'<br><span style="font-size:7px;background:#fde047;padding:0 3px;border-radius:3px">📌 '+esc(c.l3)+'</span>':'')+'</td>';}
    h+='</tr>';}

function collectLessons(f){const s=S(),out=[];s.classes.forEach(cl=>{if(f.classId&&cl.id!==f.classId)return;if(f.gradeId&&cl.gradeId!==f.gradeId)return;const g=s.grid[cl.id]||{};Object.keys(g).forEach(k=>{const c=g[k];if(!c||c.cont!=null||!c.sub)return;const[d,b]=k.split('-').map(Number);if(f.day!==''&&f.day!=null&&+f.day!==d)return;if(f.block!==''&&f.block!=null&&+f.block!==b)return;if(f.teaId&&c.tea!==f.teaId)return;out.push({classId:cl.id,d,b,c});});});return out;}
function teacherClasses(teaId){const s=S(),set=new Set();s.classes.forEach(cl=>{const g=s.grid[cl.id]||{};if(Object.values(g).some(c=>c.cont==null&&c.tea===teaId))set.add(cl.id);});return [...set];}
function teacherSubjectsInClass(teaId,classId){const g=S().grid[classId]||{},set=new Set();Object.values(g).forEach(c=>{if(c.cont==null&&c.tea===teaId&&c.sub)set.add(c.sub);});const arr=[...set];return arr.length?arr:(tea(teaId).subjects||[]).filter(id=>cls(classId).gradeId===subj(id).gradeId);}

function sundayIndex(sd,jsDay){const nm=DAYS_ALL[jsDay];const i=sd.cfg.days.findIndex(x=>x.name===nm);return i<0?null:i;}
function gConflicts(sd){let n=0;for(let d=0;d<sd.cfg.days.length;d++){const end=sd.cfg.days[d].end||sd.cfg.blocks.length;for(let b=0;b<end;b++){if(sd.cfg.blocks[b]&&sd.cfg.blocks[b].brk)continue;const seen={};sd.classes.forEach(cl=>{const ci=gCoverAt(sd.grid[cl.id]||{},d,b);if(ci&&ci.cell&&ci.cell.tea)seen[ci.cell.tea]=(seen[ci.cell.tea]||0)+1;});Object.values(seen).forEach(v=>{if(v>1)n++;});}}return n;}
function schoolStats(sd){const quota=sd.cfg.quota;let matched=0,over=0,under=0,totLoad=0;sd.teachers.forEach(t=>{const load=gLoad(sd,t.id);totLoad+=load;const q=t.max||quota;if(Math.abs(load-q)<0.001)matched++;else if(load>q)over++;else under++;});
  const today=todayISO();const di=sundayIndex(sd,new Date(today+'T00:00').getDay());const absentToday=(sd.absence[today]||[]);const gapsToday=di!=null?absentToday.reduce((s,tid)=>s+gLessons(sd,tid,di).length,0):0;const coveredToday=Object.keys(sd.cover[today]||{}).length;
  const rng=days=>{let g=0,c=0;const now=Date.now();Object.keys(sd.absence||{}).forEach(dt=>{const t=new Date(dt+'T00:00').getTime();if(isNaN(t)||now-t>days*864e5||t>now+864e5)return;const dd=sundayIndex(sd,new Date(dt+'T00:00').getDay());if(dd==null)return;g+=(sd.absence[dt]||[]).reduce((s,tid)=>s+gLessons(sd,tid,dd).length,0);});Object.keys(sd.cover||{}).forEach(dt=>{const t=new Date(dt+'T00:00').getTime();if(isNaN(t)||now-t>days*864e5||t>now+864e5)return;c+=Object.keys(sd.cover[dt]||{}).length;});return{g,c};};
  return{teachers:sd.teachers.length,classes:sd.classes.length,subjects:sd.subjects.length,matched,over,under,totLoad,absentToday:absentToday.length,gapsToday,coveredToday,wk:rng(7),mo:rng(30),yr:rng(365),conflicts:gConflicts(sd),homework:(sd.homework||[]).length,exams:(sd.exams||[]).length};}
function pct(a,b){return b?Math.round(a/b*100):0;}
function statCard(sc){const sd=DB.data[sc.id],st=schoolStats(sd);const covPctW=pct(st.wk.c,st.wk.g);const covToday=pct(st.coveredToday,st.gapsToday);
  return `<div class="schoolstat"><div class="sst-hd"><div><div class="nm">🏫 ${esc(sc.name)}</div><div class="sub">${st.classes} فصل · ${st.teachers} معلم · ${st.subjects} مادة</div></div>${isSuper()?`<button class="btn bxsm bout" style="background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.3)" onclick="switchSchool('${sc.id}');goPage('grid')">فتح الجدول</button>`:''}</div>
    <div class="sst-grid">
      <div class="sst-cell ${st.conflicts?'bad':'good'}"><div class="k">${st.conflicts?'⚠️':'✅'} تعارضات الجدول</div><div class="v">${st.conflicts}</div><div class="d">${st.conflicts?'تحتاج مراجعة':'الجدول سليم'}</div></div>

      <div class="sst-cell ${st.absentToday?'warn':'good'}"><div class="k">🙋 غياب اليوم</div><div class="v">${st.absentToday}</div><div class="d">${st.gapsToday} حصة بحاجة تغطية</div></div>
      <div class="sst-cell ${covToday>=100?'good':covToday>=60?'warn':st.gapsToday?'bad':'good'}"><div class="k">🔄 تغطية اليوم</div><div class="v">${st.gapsToday?covToday+'%':'—'}</div><div class="d">${st.coveredToday}/${st.gapsToday} حصة</div><div class="sbar"><span style="width:${Math.min(100,covToday)}%;background:${covToday>=100?'#1D9E75':covToday>=60?'#D97706':'#DC2626'}"></span></div></div>
      <div class="sst-cell"><div class="k">📅 احتياطى الأسبوع</div><div class="v">${st.wk.g?covPctW+'%':'—'}</div><div class="d">${st.wk.c}/${st.wk.g} حصة (٧ أيام)</div></div>
      <div class="sst-cell"><div class="k">📆 الشهر / السنة</div><div class="v">${pct(st.mo.c,st.mo.g)||0}%</div><div class="d">شهر ${st.mo.c}/${st.mo.g} · سنة ${st.yr.c}/${st.yr.g}</div></div>
      <div class="sst-cell"><div class="k">📚 المتابعة</div><div class="v">${st.homework}</div><div class="d">واجب · ${st.exams} اختبار</div></div>
      <div class="sst-cell"><div class="k">🧮 إجمالى الحصص المسندة</div><div class="v">${st.totLoad}</div><div class="d">حصة أسبوعياً</div></div>
    </div></div>`;}
function conflictList(sd){const out=[];const dn=d=>(sd.cfg.days[d]||{}).name||('يوم '+(d+1));const bt=b=>(sd.cfg.blocks[b]||{}).t||'';const be=b=>(sd.cfg.blocks[b]||{}).e||'';
  for(let d=0;d<sd.cfg.days.length;d++){const end=(sd.cfg.days[d]||{}).end||sd.cfg.blocks.length;for(let b=0;b<end;b++){if(sd.cfg.blocks[b]&&sd.cfg.blocks[b].brk)continue;const tm={},rm={};sd.classes.forEach(cl=>{const ci=gCoverAt(sd.grid[cl.id]||{},d,b);if(ci&&ci.cell&&ci.cell.cont==null){if(ci.cell.tea)(tm[ci.cell.tea]=tm[ci.cell.tea]||[]).push(cl.name);if(ci.cell.room)(rm[ci.cell.room]=rm[ci.cell.room]||[]).push(cl.name);}});
    Object.keys(tm).forEach(tid=>{if(tm[tid].length>1)out.push('يوجد تعارض يوم '+dn(d)+' فى التوقيت من '+bt(b)+' إلى '+be(b)+': المعلم «'+((sd.teachers.find(t=>t.id===tid)||{}).name||'')+'» مُسنَد إلى أكثر من فصل فى نفس الوقت ('+tm[tid].join(' و ')+'). ولعلاج التعارض يُرجى نقل إحدى الحصتين إلى توقيت آخر لنفس المعلم، أو إسناد معلم بديل لأحد الفصلين.');});
    Object.keys(rm).forEach(rid=>{if(rm[rid].length>1)out.push('يوجد تعارض قاعة يوم '+dn(d)+' فى التوقيت من '+bt(b)+' إلى '+be(b)+': القاعة «'+((sd.rooms.find(r=>r.id===rid)||{}).name||'')+'» مستخدَمة فى أكثر من فصل فى نفس الوقت ('+rm[rid].join(' و ')+'). ولعلاج التعارض يُرجى تخصيص قاعة أخرى لأحد الفصلين أو تغيير توقيت إحدى الحصتين.');});
  }}return out;}
function conflictsPanel(){const list=conflictList(S());if(!list.length)return '<div class="card" style="border-right:4px solid #1D9E75;background:#F0FDF4"><div style="color:#166534;font-weight:800">✅ لا توجد تعارضات فى الجدول</div></div>';return '<div class="card" style="border-right:5px solid #DC2626"><div class="chdr"><div class="ctitle" style="color:#991B1B">⚠️ تعارضات الجدول ('+list.length+')</div><button class="btn bout bsm" onclick="printPDF(\'تعارضات الجدول\',\'<h3>تعارضات الجدول</h3><ol>\'+conflictList(S()).map(x=>\'<li>\'+esc(x)+\'</li>\').join(\'\')+\'</ol>\')">🖨️ تصدير</button></div><ol style="line-height:2;padding-right:18px;margin:8px 0;font-size:13px">'+list.slice(0,80).map(x=>'<li style="margin-bottom:6px">'+esc(x)+'</li>').join('')+'</ol></div>';}
function showConflicts(){const list=conflictList(S());openM('<div class="mbox wide"><div class="mhdr teal"><span class="mtitle">⚠️ تعارضات الجدول</span><button class="mcls" onclick="closeM()">✕</button></div><div class="mbody" style="max-height:64vh;overflow:auto">'+(list.length?('<ol style="line-height:2;padding-right:18px">'+list.map(x=>'<li style="margin-bottom:8px">'+esc(x)+'</li>').join('')+'</ol>'):'<div class="info">✅ لا توجد تعارضات.</div>')+'</div></div>');}

function publishSchedule(){const list=finalValidation();if(list.length){toast('⛔ لا يمكن النشر: يوجد '+list.length+' تعارض غير محلول. يجب الوصول إلى صفر تعارض أولاً.','e');showConflicts();return;}const s=S();s.cfg.published=true;s.cfg.publishedAt=new Date().toISOString();s.cfg.publishedBy=SESSION.name;logAct('نشر الجدول','0 تعارض');save();renderGrid(reC());toast('🚀 تم نشر الجدول (خالٍ من التعارضات) ✓','s');}

function publishBar(){if(!can('edit'))return '';const s=S();const list=conflictList(s);const n=list.length;if(n>0&&s.cfg.published){s.cfg.published=false;}const pub=s.cfg.published;
  return `<div class="card" style="padding:10px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-right:5px solid ${n?'#DC2626':(pub?'#1D9E75':'#D97706')}"><b>حالة النشر:</b><span class="badge ${n?'br':(pub?'bg':'ba')}" style="font-size:13px">${n?('🚫 النشر محظور — '+n+' تعارض'):(pub?'✅ منشور — خالٍ من التعارضات':'📝 مسودة — جاهز للنشر (0 تعارض)')}</span>${n?`<button class="btn bout bsm" onclick="showConflicts()">عرض التعارضات وحلولها</button>`:''}<div style="flex:1"></div>${pub?`<button class="btn bout bsm" onclick="unpublishSchedule()">↩ إلغاء النشر</button>`:`<button class="btn ${n?'bout':'bgreen'} bsm" ${n?'disabled style="opacity:.5;cursor:not-allowed"':''} onclick="${n?'':'publishSchedule()'}">🚀 نشر الجدول</button>`}</div>`;}
function cellConflictAt(classId,d,b){const s=S();const ci=gCoverAt(s.grid[classId]||{},d,b);if(!ci||!ci.cell)return '';const cell=ci.cell;const bt=(s.cfg.blocks[b]||{}).t||'';const be=(s.cfg.blocks[b]||{}).e||'';const dn=(s.cfg.days[d]||{}).name||'';let msg='';s.classes.forEach(cl=>{if(cl.id===classId)return;const oc=gCoverAt(s.grid[cl.id]||{},d,b);if(!oc||!oc.cell)return;if(cell.tea&&oc.cell.tea===cell.tea)msg='⚠ تعارض: المعلم «'+(tea(cell.tea).name||'')+'» لديه حصة أخرى فى فصل '+cl.name+' يوم '+dn+' ('+bt+'–'+be+'). المقترح: انقل الحصة لتوقيت آخر أو أسنِد معلماً بديلاً.';else if(cell.room&&oc.cell.room===cell.room)msg=msg||('⚠ تعارض قاعة: «'+(room(cell.room).name||'')+'» مستخدمة أيضاً فى فصل '+cl.name+' ('+bt+'–'+be+'). المقترح: خصّص قاعة أخرى أو غيّر التوقيت.');});return msg;}
function dashAlerts(){const s=S();const A=[];
  const conf=gConflicts(s);if(conf>0)A.push(['🔴 تعارضات فى الجدول',conf+' تعارض','grid','#DC2626']);
  const over=s.teachers.filter(t=>isTeacherType(t)&&teacherLoad(t.id)>(t.max||s.cfg.quota)).length;if(over>0)A.push(['⛔ معلمون تجاوزوا النصاب',over+' معلم','loads','#DC2626']);

  const pubSet={};Object.keys(s.assess.published||{}).forEach(k=>{Object.keys(s.assess.published[k]||{}).forEach(cid=>{if(s.assess.published[k][cid])pubSet[k+'|'+cid]=1;});});let rp=0;Object.keys(s.assess.marks||{}).forEach(k=>{Object.keys(s.assess.marks[k]||{}).forEach(cid=>{if(Object.keys(s.assess.marks[k][cid]||{}).length>0&&!pubSet[k+'|'+cid])rp++;});});if(rp>0)A.push(['📝 نتائج بانتظار الاعتماد',rp+' (فصل/امتحان)','assess','#D97706']);

function mStructure(){const s=S();const stages=s.cfg.stages.map(st=>{const grs=gradesOfStage(st.id);return `<div class="stagebox"><div class="stagehd"><span style="font-size:16px">🏛️</span><span class="nm">${esc(st.name)}</span><div style="margin-right:auto;display:flex;gap:6px"><button class="btn bxsm bteal" onclick="addGrade('${st.id}')">+ صف</button><button class="iconbtn" onclick="editStage('${st.id}')">✏️</button><button class="iconbtn del" onclick="delStage('${st.id}')">🗑</button></div></div>${grs.length?grs.map(g=>{const cl=classesOfGrade(g.id);return `<div class="gradebox"><div class="gradehd"><span class="nm">📗 الصف ${esc(g.name)}</span><div style="display:flex;gap:6px"><button class="btn bxsm bteal" onclick="addClass('${g.id}')">+ فصل</button><button class="iconbtn" onclick="editGrade('${g.id}')">✏️</button><button class="iconbtn del" onclick="delGrade('${g.id}')">🗑</button></div></div><div class="clschips">${cl.length?cl.map(c=>`<span class="clschip">🏫 ${esc(c.name)}${c.roomId?' · '+esc(room(c.roomId).name):''} <span class="x" onclick="delClass('${c.id}')">✕</span></span>`).join(''):'<span style="font-size:11px;color:var(--t3)">لا فصول</span>'}</div></div>`;}).join(''):'<div style="font-size:11.5px;color:var(--t3);padding:4px">لا صفوف</div>'}</div>`;}).join('');
  return `<div class="card"><div class="chdr"><div class="ctitle">🏛️ البنية التعليمية</div><button class="btn bteal bsm" onclick="addStage()">+ مرحلة دراسية</button></div><div class="info" style="margin-bottom:12px">أضف <b>المرحلة</b> ← <b>الصف الدراسى</b> ← <b>الفصول</b>.</div>${stages||'<div class="empty"><div class="empty-t">لا مراحل بعد</div></div>'}</div>`;}
function subjWeekly(sb,gid){const s=S();let actual=0,n=0;(s.classes||[]).filter(c=>c.gradeId===gid).forEach(function(cl){n++;const g=s.grid[cl.id]||{};Object.keys(g).forEach(function(k){const c=g[k];if(c&&c.cont==null&&c.sub===sb.id)actual++;});});const expected=(Math.round(sb.hours||0))*n;return {actual,expected,n,excess:actual-expected};}
function subjPerClass(sb,gid){const s=S();return (s.classes||[]).filter(c=>c.gradeId===gid).map(function(cl){let a=0;const g=s.grid[cl.id]||{};Object.keys(g).forEach(function(k){const c=g[k];if(c&&c.cont==null&&c.sub===sb.id)a++;});const h=Math.round(sb.hours||0);return {name:cl.name,actual:a,hours:h,excess:a-h};});}
function fieldConvertedSummary(){const s=S();let total=0,cult=0,spec=0;(s.cfg.grades||[]).forEach(function(g){(subjectsOfGrade(g.id)||[]).forEach(function(sb){const w=subjWeekly(sb,g.id);if(w.excess>0){total+=w.excess;if(sb.type==='ثقافية')cult+=w.excess;else if(sb.type==='تخصصية')spec+=w.excess;}});});return {total,cult,spec};}
function mSubjects(){const s=S();const rows=s.cfg.grades.map(g=>{const subs=subjectsOfGrade(g.id);return subs.map((sb,i)=>`<tr>${i===0?`<td rowspan="${subs.length}" style="background:var(--Rl);font-weight:800;color:var(--Rd);vertical-align:middle">الصف ${esc(g.name)}</td>`:''}<td><span class="colordot" style="background:${sb.color}"></span><b>${esc(sb.name)}</b><div style="font-size:9px;color:var(--t3)">${esc(sb.en||'')}</div></td><td><span class="badge ${sb.type==='ثقافية'?'bt':sb.type==='تخصصية'?'bpur':'ba'}">${esc(sb.type)}</span></td><td style="text-align:center;font-weight:800;color:var(--N)">${sb.hours}</td>${(function(){const w=subjWeekly(sb,g.id);return '<td style="text-align:center;font-weight:800;color:var(--N)" title="'+Math.round(sb.hours||0)+' × '+w.n+' فصل">'+w.expected+'<div style="font-size:9px;color:var(--t3)">'+w.n+' فصل</div></td>';})()}${(function(){const w=subjWeekly(sb,g.id);const cl=w.excess>0?'br':(w.excess===0?'bg':'ba');const lbl=w.excess>0?('زيادة '+w.excess):(w.excess===0?'مطابق':('نقص '+(-w.excess)));return '<td style="text-align:center"><span class="badge '+cl+'" title="المتوقع '+w.expected+' لعدد '+w.n+' فصل">'+w.actual+'</span><div style="font-size:9px;color:var(--t3)">'+lbl+'</div></td><td style="text-align:center">'+(w.excess>0?('<span class="badge br">'+w.excess+' حصة</span><div style="font-size:9px;color:var(--t3)">محوّلة من التدريب الميدانى ('+esc(sb.type||'')+')</div><div style="font-size:9px;color:#B91C1C;margin-top:2px;text-align:right">'+subjPerClass(sb,g.id).filter(function(x){return x.excess>0;}).map(function(x){return '• '+esc(x.name)+': +'+x.excess;}).join('<br>')+'</div>'):'<span style="color:var(--t3)">—</span>')+'</td>';})()}<td style="text-align:center">${(sb.span||2)===3?'حصة ونصف':'حصة'}<div style="font-size:9px;color:var(--t3)">${sb.span||2} مربع</div></td><td style="white-space:nowrap"><button class="btn bxsm bout" onclick="editSubject('${sb.id}')">تعديل</button><button class="btn bxsm bred" onclick="delSubject('${sb.id}')">حذف</button></td></tr>`).join('');}).join('');
  return `<div class="card"><div class="chdr"><div class="ctitle">📚 المواد وعدد الحصص</div><button class="btn bteal bsm" onclick="editSubject()">+ إضافة مادة</button></div><div class="info" style="margin-bottom:10px">«الحصة» = مربعان (٥٠ د). «حصة ونصف» = ٣ مربعات. المرصود يُحسب تلقائياً من الجدول: <b style="color:#166534">أخضر=مطابق</b> · <b style="color:#B91C1C">أحمر=زيادة</b> · <b style="color:#B45309">برتقالى=أقل</b>. الزيادة تُحتسب ساعاتٍ محوّلة من التدريب الميدانى.</div>${(function(){const f=fieldConvertedSummary();return f.total>0?('<div class="card" style="padding:10px;border-right:4px solid #DC2626;margin-bottom:10px"><b>🏭 إجمالى ساعات التدريب الميدانى المحوّلة لمواد:</b> <span class="badge br">'+f.total+' حصة/أسبوع</span> — منها <span class="badge bt">ثقافية: '+f.cult+'</span> <span class="badge bpur">تخصصية: '+f.spec+'</span></div>'):'';})()}<div class="tbwrap"><table><thead><tr><th>الصف</th><th>المادة</th><th>النوع</th><th>حصص/أسبوع (لكل فصل)</th><th>المفترض للصف (× الفصول)</th><th>المرصود من الجدول</th><th>محوّل تدريب ميدانى</th><th>طول الحصة</th><th></th></tr></thead><tbody>${rows||'<tr><td colspan=9><div class="empty"><div class="empty-t">أضف صفوفاً ومواد</div></div></td></tr>'}</tbody></table></div></div>`;}
function mTeachers(){const s=S();const rows=s.teachers.map(t=>{const load=teacherLoad(t.id),q=t.max||s.cfg.quota;const uu=userForTeacher(t.id);const _over=isTeacherType(t)&&load>q;return `<tr><td><b>${esc(t.name)}</b>${uu?` <span class="badge bn">كود ${esc(uu.username)}</span>`:''}${_over?' <span class="badge br">⛔ متجاوز النصاب</span>':''}${!isTeacherType(t)?(' <span class="badge bn">'+staffTypeLabel(t)+'</span>'):''}</td><td>${esc(t.spec||'—')}</td><td style="text-align:center">${(t.subjects||[]).length}</td><td style="text-align:center;font-weight:800;color:var(--N)">${q}</td><td style="text-align:center"><span class="badge ${load>=q?'br':load>=q*0.9?'ba':'bg'}">${load}/${q}</span></td><td style="white-space:nowrap"><button class="btn bxsm bout" onclick="editTeacher('${t.id}')">تعديل</button><button class="btn bxsm bout" onclick="assignSubjects('${t.id}')">المواد</button><button class="btn bxsm bred" onclick="delTeacher('${t.id}')">حذف</button></td></tr>`;}).join('');

function mRooms(){const s=S();const rows=s.rooms.map(r=>`<tr><td>${ROOM_ICON[r.kind]} <b>${esc(r.name)}</b></td><td><span class="badge ${r.kind==='lab'?'bt':r.kind==='workshop'?'ba':'bn'}">${ROOM_KINDS[r.kind]}</span></td><td style="white-space:nowrap"><button class="btn bxsm bout" onclick="editRoom('${r.id}')">تعديل</button><button class="btn bxsm bred" onclick="delRoom('${r.id}')">حذف</button></td></tr>`).join('');
  return `<div class="card"><div class="chdr"><div class="ctitle">🏢 القاعات والمعامل والورش</div><button class="btn bteal bsm" onclick="editRoom()">+ إضافة</button></div><div class="tbwrap"><table><thead><tr><th>الاسم</th><th>النوع</th><th></th></tr></thead><tbody>${rows||'<tr><td colspan=3><div class="empty"><div class="empty-t">لا قاعات</div></div></td></tr>'}</tbody></table></div></div>`;}

    <div>
      <div class="card"><div class="ctitle">📆 أيام الدراسة ونهاية اليوم</div><div class="info" style="margin:8px 0">حدّد لكل يوم عدد المربعات (مثال: الخميس ينتهى ٢:٤٠ = ١٦ مربعاً).</div>${drows}${remain.length?`<div style="margin-top:8px"><select id="addday" class="btn bout bsm">${remain.map(dn=>`<option>${dn}</option>`).join('')}</select> <button class="btn bxsm bteal" onclick="addDay()">+ يوم</button></div>`:''}</div>

function saveSchool(){const name=document.getElementById('sc-name').value.trim();if(!name)return toast('الاسم مطلوب','e');const id=uid('sc'),sd=newSchoolData();if(document.getElementById('sc-seed').checked)seedSchool(sd);DB.schools.push({id,name,address:document.getElementById('sc-addr').value.trim()});DB.data[id]=sd;ACTIVE=id;logAct('إنشاء مدرسة',name);save();closeM();buildSchoolPick();reManage();toast('تم الإنشاء','s');}
function delSchool(id){if(DB.schools.length<=1)return toast('لا يمكن حذف المدرسة الوحيدة','e');confirmM('حذف «'+schoolName(id)+'»؟',()=>{DB.schools=DB.schools.filter(s=>s.id!==id);delete DB.data[id];if(ACTIVE===id)ACTIVE=DB.schools[0].id;logAct('حذف مدرسة',schoolName(id));save();buildSchoolPick();reManage();toast('تم الحذف','e');});}
function addStage(){const n=prompt('اسم المرحلة:','المرحلة الثانوية');if(!n)return;S().cfg.stages.push({id:uid('st'),name:n.trim()});logAct('إضافة مرحلة',n);save();reManage();}
function editStage(id){const st=stage(id);const n=prompt('تعديل المرحلة:',st.name);if(!n)return;st.name=n.trim();save();reManage();}
function delStage(id){const grs=gradesOfStage(id);confirmM('حذف المرحلة وكل ما بداخلها؟',()=>{const s=S(),gids=grs.map(g=>g.id);s.cfg.grades=s.cfg.grades.filter(g=>g.stageId!==id);const cids=s.classes.filter(c=>gids.includes(c.gradeId)).map(c=>c.id);s.classes=s.classes.filter(c=>!gids.includes(c.gradeId));cids.forEach(cid=>delete s.grid[cid]);s.subjects=s.subjects.filter(sb=>!gids.includes(sb.gradeId));s.cfg.stages=s.cfg.stages.filter(x=>x.id!==id);logAct('حذف مرحلة',stage(id).name);save();reManage();toast('تم الحذف','e');});}
function addGrade(stageId){const n=prompt('اسم الصف (مثال: الأول):','');if(!n)return;S().cfg.grades.push({id:uid('g'),name:n.trim(),stageId});save();reManage();}
function editGrade(id){const g=grade(id);const n=prompt('تعديل الصف:',g.name);if(!n)return;g.name=n.trim();save();reManage();}
function delGrade(id){const cl=classesOfGrade(id);confirmM('حذف الصف وفصوله ومواده؟',()=>{const s=S(),cids=cl.map(c=>c.id);s.classes=s.classes.filter(c=>c.gradeId!==id);cids.forEach(cid=>delete s.grid[cid]);s.subjects=s.subjects.filter(sb=>sb.gradeId!==id);s.cfg.grades=s.cfg.grades.filter(x=>x.id!==id);logAct('حذف صف',grade(id).name);save();reManage();toast('تم الحذف','e');});}

ass="mfoot"><button class="btn bout bsm" onclick="closeM()">إلغاء</button><button class="btn bteal bsm" onclick="saveSubject('${id||''}')">حفظ</button></div></div>`);}
function saveSubject(id){const s=S();const name=document.getElementById('f-name').value.trim();if(!name)return toast('الاسم مطلوب','e');const o={name,en:document.getElementById('f-en').value.trim(),gradeId:document.getElementById('f-grade').value,type:document.getElementById('f-type').value,track:((document.getElementById('f-track')||{}).value)||'',roomKind:((document.getElementById('f-roomkind')||{}).value)||'',hours:parseFloat(document.getElementById('f-hours').value)||0,span:parseInt(document.getElementById('f-span').value)||2,color:document.getElementById('f-color').value};if(id){Object.assign(subj(id),o);}else{o.id=uid('sb');s.subjects.push(o);}logAct('مادة',name);save();closeM();reManage();toast('تم الحفظ','s');}
function delSubject(id){const nm=subj(id).name;confirmM('حذف «'+nm+'»؟',()=>{const s=S();s.subjects=s.subjects.filter(x=>x.id!==id);s.teachers.forEach(t=>t.subjects=(t.subjects||[]).filter(x=>x!==id));s.classes.forEach(cl=>{const g=s.grid[cl.id]||{};Object.keys(g).forEach(k=>{const ci=gCoverAt(g,...k.split('-').map(Number));if(ci&&ci.cell.sub===id){const st=ci.start,[d]=k.split('-').map(Number),sp=ci.cell.span||2;for(let z=0;z<sp;z++)delete g[d+'-'+(st+z)];}});});logAct('حذف مادة',nm);save();reManage();toast('تم الحذف','e');});}
function editTeacher(id){const s=S();const t=id?tea(id):{max:s.cfg.quota};openM(`<div class="mbox"><div class="mhdr teal"><span class="mtitle">${id?'تعديل معلم':'إضافة معلم'}</span><button class="mcls" onclick="closeM()">✕</button></div><div class="mbody"><div class="fgrid"><div class="fm"><label>اسم المعلم *</label><input id="t-name" value="${esc(t.name||'')}"/></div><div class="fm"><label>نوع الموظف</label><select id="t-stafftype" onchange="var q=document.getElementById('t-maxwrap');if(q)q.style.display=this.value==='teacher'?'block':'none';"><option value="teacher" ${((t.staffType||'teacher')==='teacher')?'selected':''}>معلم</option><option value="admin" ${((t.staffType||'teacher')==='admin')?'selected':''}>إدارى</option><option value="social" ${((t.staffType||'teacher')==='social')?'selected':''}>أخصائى اجتماعى</option><option value="psych" ${((t.staffType||'teacher')==='psych')?'selected':''}>أخصائى نفسى</option><option value="tech" ${((t.staffType||'teacher')==='tech')?'selected':''}>أخصائى تطوير تكنولوجى</option><option value="quality" ${((t.staffType||'teacher')==='quality')?'selected':''}>مسؤول جودة</option><option value="exam" ${((t.staffType||'teacher')==='exam')?'selected':''}>مسؤول تقييم وامتحانات</option><option value="other" ${((t.staffType||'teacher')==='other')?'selected':''}>موظف آخر</option></select></div><div class="fm"><label>التخصص</label><input id="t-spec" value="${esc(t.spec||'')}"/></div><div class="fm" id="t-maxwrap" style="display:${(t.staffType&&t.staffType!=='teacher')?'none':'block'}"><label>النصاب التدريسى</label><input id="t-max" type="number" min="0" max="45" value="${t.max||s.cfg.quota}"/><div style="font-size:9px;color:var(--t3)">الإداريون/الأخصائيون بلا نصاب — يُستخدمون كموارد دعم عند الحاجة</div></div><div class="fm"><label>نوع التعاقد</label><select id="t-contract"><option value="full" ${(t.contract||'full')==='full'?'selected':''}>دوام كلى</option><option value="part" ${t.contract==='part'?'selected':''}>دوام جزئى</option></select></div></div></div><div class="mfoot"><button class="btn bout bsm" onclick="closeM()">إلغاء</button><button class="btn bteal bsm" onclick="saveTeacher('${id||''}')">حفظ</button></div></div>`);}
function nextTeacherCode(schoolId){const used=new Set(DB.users.filter(u=>u.schoolId===schoolId&&/^[0-9]{3}$/.test(u.username||'')).map(u=>+u.username));let c=101;while(used.has(c))c++;return String(c);}
function userForTeacher(teaId){return DB.users.find(u=>u.role==='teacher'&&u.teacherId===teaId&&u.schoolId===ACTIVE);}
const STAFF_TYPES=[['teacher','معلم'],['admin','إدارى'],['social','أخصائى اجتماعى'],['psych','أخصائى نفسى'],['tech','أخصائى تطوير تكنولوجى'],['quality','مسؤول جودة'],['exam','مسؤول تقييم وامتحانات'],['other','موظف آخر']];
function staffTypeLabel(t){const k=(t&&t.staffType)||'teacher';const f=STAFF_TYPES.find(x=>x[0]===k);return f?f[1]:'معلم';}
function isTeacherType(t){return !t.staffType||t.staffType==='teacher';}
function saveTeacher(id){const s=S();const name=document.getElementById('t-name').value.trim();if(!name)return toast('الاسم مطلوب','e');const o={name,spec:document.getElementById('t-spec').value.trim(),max:parseInt(document.getElementById('t-max').value)||s.cfg.quota,contract:((document.getElementById('t-contract')||{}).value)||'full',staffType:((document.getElementById('t-stafftype')||{}).value)||'teacher'};if(id){Object.assign(tea(id),o);const uu=userForTeacher(id);if(uu)uu.name=name;}else{o.id=uid('tc');o.subjects=[];s.teachers.push(o);const code=nextTeacherCode(ACTIVE);DB.users.push({id:uid('u'),username:code,pass:'',name:name,role:'teacher',schoolId:ACTIVE,teacherId:o.id,mustChange:true});toast('كود دخول المعلم: '+code+' (بدون كلمة مرور أول مرة)','s');}logAct('معلم',name);save();closeM();reManage();}
function delTeacher(id){const nm=tea(id).name;confirmM('حذف «'+nm+'»؟',()=>{const s=S();s.teachers=s.teachers.filter(x=>x.id!==id);Object.values(s.grid).forEach(g=>Object.keys(g).forEach(k=>{if(g[k].cont==null&&g[k].tea===id)g[k].tea='';}));logAct('حذف معلم',nm);save();reManage();toast('تم الحذف','e');});}
function assignSubjects(id){const s=S(),t=tea(id);const byGrade=s.cfg.grades.map(g=>{const subs=subjectsOfGrade(g.id);if(!subs.length)return'';return `<div style="margin-bottom:10px"><div style="font-size:11px;font-weight:800;color:var(--N);margin-bottom:6px">الصف ${esc(g.name)}</div><div style="display:flex;flex-wrap:wrap;gap:7px">${subs.map(sb=>`<label style="display:flex;gap:5px;align-items:center;font-size:11.5px;font-weight:600;cursor:pointer;padding:5px 9px;border:1.5px solid var(--bdr);border-radius:7px"><input type="checkbox" class="asub" value="${sb.id}" ${(t.subjects||[]).includes(sb.id)?'checked':''}/><span class="colordot" style="background:${sb.color}"></span>${esc(sb.name)}</label>`).join('')}</div></div>`;}).join('');openM(`<div class="mbox wide"><div class="mhdr teal"><span class="mtitle">مواد المعلم — ${esc(t.name)}</span><button class="mcls" onclick="closeM()">✕</button></div><div class="mbody">${byGrade||'<div class="empty"><div class="empty-t">أضف مواد أولاً</div></div>'}</div><div class="mfoot"><button class="btn bout bsm" onclick="closeM()">إلغاء</button><button class="btn bteal bsm" onclick="saveAssign('${id}')">حفظ</button></div></div>`);}
function saveAssign(id){const t=tea(id);t.subjects=[...document.querySelectorAll('.asub:checked')].map(x=>x.value);logAct('مواد معلم',t.name);save();closeM();reManage();toast('تم الحفظ','s');}
function editRoom(id){const r=id?room(id):{kind:'class'};openM(`<div class="mbox"><div class="mhdr teal"><span class="mtitle">${id?'تعديل':'إضافة'} قاعة</span><button class="mcls" onclick="closeM()">✕</button></div><div class="mbody"><div class="fgrid"><div class="fm"><label>الاسم *</label><input id="r-name" value="${esc(r.name||'')}"/></div><div class="fm"><label>النوع</label><select id="r-kind">${Object.keys(ROOM_KINDS).map(k=>`<option value="${k}" ${r.kind===k?'selected':''}>${ROOM_ICON[k]} ${ROOM_KINDS[k]}</option>`).join('')}</select></div></div></div><div class="mfoot"><button class="btn bout bsm" onclick="closeM()">إلغاء</button><button class="btn bteal bsm" onclick="saveRoom('${id||''}')">حفظ</button></div></div>`);}
function saveRoom(id){const s=S();const name=document.getElementById('r-name').value.trim();if(!name)return toast('الاسم مطلوب','e');const o={name,kind:document.getElementById('r-kind').value};if(id){Object.assign(room(id),o);}else{o.id=uid('rm');s.rooms.push(o);}logAct('قاعة',name);save();closeM();reManage();toast('تم الحفظ','s');}
function delRoom(id){const nm=room(id).name;confirmM('حذف «'+nm+'»؟',()=>{const s=S();s.rooms=s.rooms.filter(x=>x.id!==id);s.classes.forEach(c=>{if(c.roomId===id)c.roomId='';});Object.values(s.grid).forEach(g=>Object.keys(g).forEach(k=>{if(g[k].room===id)g[k].room='';}));logAct('حذف قاعة',nm);save();reManage();toast('تم الحذف','e');});}
/* blocks/days config */
function repairGrid(){const s=S();s.classes.forEach(cl=>{const g=s.grid[cl.id]||{};const starts=[];Object.keys(g).forEach(k=>{const c=g[k];if(c&&c.cont==null&&c.sub){const[d,b]=k.split('-').map(Number);starts.push({d,b,c});}});const ng={};starts.forEach(L=>{const span=L.c.span||2,end=(s.cfg.days[L.d]?s.cfg.days[L.d].end:s.cfg.blocks.length)||s.cfg.blocks.length;let ok=L.b+span<=end;for(let k=0;k<span&&ok;k++){if(s.cfg.blocks[L.b+k]&&s.cfg.blocks[L.b+k].brk)ok=false;if(ng[L.d+'-'+(L.b+k)])ok=false;}if(!ok)return;ng[L.d+'-'+L.b]={sub:L.c.sub,tea:L.c.tea,topic:L.c.topic||'',room:L.c.room||'',span};for(let k=1;k<span;k++)ng[L.d+'-'+(L.b+k)]={cont:L.b};});s.grid[cl.id]=ng;});}
function updBlock(i,f,v){S().cfg.blocks[i][f]=v;save();}
function toggleBreak(i){const p=S().cfg.blocks[i];if(p.brk){delete p.brk;delete p.label;}else{p.brk=true;p.label='بريك';}repairGrid();save();reManage();}
function addBlock(brk){S().cfg.blocks.push(brk?{brk:true,label:'بريك',t:'0:00',e:'0:00'}:{t:'0:00',e:'0:00'});save();reManage();}
function delBlock(i){confirmM('حذف هذا المربع؟ ستتأثر الحصص المبنية عليه.',()=>{const s=S();s.classes.forEach(cl=>{const g=s.grid[cl.id]||{},ng={};Object.keys(g).forEach(k=>{const[d,b]=k.split('-').map(Number);if(b===i)return;const nb=b>i?b-1:b;const c=Object.assign({},g[k]);if(c.cont!=null){if(c.cont===i)return;if(c.cont>i)c.cont--;}ng[d+'-'+nb]=c;});s.grid[cl.id]=ng;});s.cfg.blocks.splice(i,1);repairGrid();save();reManage();});}
function updDay(i,f,v){const s=S();if(f==='end'){v=Math.max(1,Math.min(s.cfg.blocks.length,parseInt(v)||s.cfg.blocks.length));s.cfg.days[i].end=v;repairGrid();}else s.cfg.days[i][f]=v.trim();save();reManage();}
function addDay(){const dn=document.getElementById('addday').value;S().cfg.days.push({name:dn,end:S().cfg.blocks.length});save();reManage();}
function delDay(i){if(S().cfg.days.length<=1)return toast('لا يمكن حذف اليوم الوحيد','e');confirmM('حذف يوم «'+S().cfg.days[i].name+'» وحصصه؟',()=>{const s=S();s.classes.forEach(cl=>{const g=s.grid[cl.id]||{},ng={};Object.keys(g).forEach(k=>{const[d,b]=k.split('-').map(Number);if(d===i)return;ng[(d>i?d-1:d)+'-'+b]=g[k];});s.grid[cl.id]=ng;});s.cfg.days.splice(i,1);save();reManage();});}
function saveCfg(){S().cfg.quota=parseInt(document.getElementById('cfg-quota').value)||QUOTA;logAct('تعديل النصاب','='+S().cfg.quota);save();reManage();toast('تم الحفظ','s');}
function applyQuota(){const s=S();const q=parseInt(document.getElementById('cfg-quota').value)||s.cfg.quota;s.cfg.quota=q;s.teachers.forEach(t=>t.max=q);logAct('تطبيق النصاب','='+q);save();reManage();toast('تم التطبيق','s');}
function doAutoGen(){confirmM('توليد الجدول تلقائياً؟ سيُستبدل الحالى.',()=>{autoGenerate(S(),false);logAct('توليد تلقائى','');save();reManage();});}
function clearGrid(){confirmM('تفريغ الجدول بالكامل؟',()=>{const s=S();s.classes.forEach(c=>s.grid[c.id]={});logAct('تفريغ الجدول','');save();reManage();toast('تم','e');});}

var gf={gradeId:'',classId:'',teaId:'',day:'',block:'',fromB:'',toB:''};
function gfRange(){return (gf.fromB!==''&&gf.fromB!=null&&gf.toB!==''&&gf.toB!=null)?[Math.min(+gf.fromB,+gf.toB),Math.max(+gf.fromB,+gf.toB)]:null;}
function setGF(k,v){gf[k]=v;if(k==='gradeId')gf.classId='';renderGrid(reC());}
function clearGF(){gf={gradeId:'',classId:'',teaId:'',day:'',block:'',fromB:'',toB:''};renderGrid(reC());}
function renderGrid(c){const r=SESSION.role;if(r==='teacher')return gridTeacher(c);if(r==='student')return gridStudent(c);return gridStaff(c);}
function gfMatch(d,b,c){return (gf.day===''||+gf.day===d)&&(gf.block===''||+gf.block===b)&&(!gf.teaId||c.tea===gf.teaId);}
function filteredClassAt(classId){const g=S().grid[classId]||{};return (d,b)=>{const c=g[d+'-'+b];if(!c||c.cont!=null||!c.sub)return null;if(!gfMatch(d,b,c))return null;const sb=subj(c.sub),t=tea(c.tea),rm=c.room?room(c.room):null;return{span:c.span||2,color:sb.color,l1:sb.name,l2:(t.name||'—')+(rm?' · '+rm.name:''),l3:topicDisp(c.tea,classId,c.sub,c.topic)};};}
function filteredTeacherAt(teaId){const s=S(),map={};s.classes.forEach(cl=>{if(gf.classId&&cl.id!==gf.classId)return;const g=s.grid[cl.id]||{};Object.keys(g).forEach(k=>{const c=g[k];if(c&&c.cont==null&&c.tea===teaId){const p=k.split('-').map(Number);if(gf.day!==''&&+gf.day!==p[0])return;if(gf.block!==''&&+gf.block!==p[1])return;map[k]={c,cl};}});});return (d,b)=>{const e=map[d+'-'+b];if(!e)return null;const sb=subj(e.c.sub),rm=e.c.room?room(e.c.room):null;return{span:e.c.span||2,color:sb.color,l1:sb.name,l2:e.cl.name+(rm?' · '+rm.name:''),l3:topicDisp(e.c.tea,e.cl.id,e.c.sub,e.c.topic)};};}

function hashStr(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return h;}
function tLessonStarts(d){const tb=teachBlocks(d);const st=[];for(let i=0;i+1<tb.length;i+=2)st.push(tb[i]);return st;}
function tDayIdx(name){name=(name||'').trim();const s=S();for(let i=0;i<s.cfg.days.length;i++)if(s.cfg.days[i].name===name)return i;const en={'sunday':'الأحد','monday':'الاثنين','tuesday':'الثلاثاء','wednesday':'الأربعاء','thursday':'الخميس','friday':'الجمعة','saturday':'السبت'};const ar=en[name.toLowerCase()];if(ar)for(let i=0;i<s.cfg.days.length;i++)if(s.cfg.days[i].name===ar)return i;return -1;}
function tGetClass(nm){const s=S();let c=s.classes.find(x=>x.name===nm);if(c)return {id:c.id,created:false};const dg=(nm.match(/[0-9]/)||['1'])[0];const gi=Math.max(0,Math.min((s.cfg.grades.length||1)-1,parseInt(dg)-1));const gradeId=(s.cfg.grades[gi]||s.cfg.grades[0]||{}).id;const room=(s.rooms.find(r=>r.kind==='class')||s.rooms[0]||{}).id||'';const o={id:uid('cl'),name:nm,gradeId,roomId:room,kind:'class'};s.classes.push(o);s.grid[o.id]={};return {id:o.id,created:true};}
function tGetSubject(nm,gradeId){const s=S();let sb=s.subjects.find(x=>x.name===nm&&x.gradeId===gradeId);if(sb)return {id:sb.id,created:false};const type=/عملى|الذكاء|تخصص/.test(nm)?'تخصصية':(/تدريب/.test(nm)?'تدريب ميدانى':'ثقافية');const colors=['#0891b2','#dc2626','#7c3aed','#059669','#d97706','#4f46e5','#57B1C9','#ea580c','#0e7490','#b91c1c','#16a34a','#a16207'];const color=colors[Math.abs(hashStr(nm))%colors.length];const o={id:uid('sb'),name:nm,en:'',gradeId,hours:0,type,color,span:2};s.subjects.push(o);return {id:o.id,created:true};}
function tNorm(x){return String(x||'').trim().replace(/\s+/g,' ').toLowerCase();}
function tGetTeacher(nm,subId){const s=S();const key=tNorm(nm);let t=s.teachers.find(x=>tNorm(x.name)===key);let created=false;if(!t){t={id:uid('tc'),name:nm,spec:'',subjects:[],max:s.cfg.quota};s.teachers.push(t);created=true;try{const code=nextTeacherCode(ACTIVE);DB.users.push({id:uid('u'),username:code,pass:'',name:nm,role:'teacher',schoolId:ACTIVE,teacherId:t.id,mustChange:true});}catch(e){}}if(subId&&t.subjects.indexOf(subId)<0)t.subjects.push(subId);return {id:t.id,created};}
