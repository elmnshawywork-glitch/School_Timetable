function tImport(){if(!can('edit'))return toast('غير متاح','w');pickFile((txt)=>{const rows=parseCSV(txt);if(rows.length<2)return toast('الملف فارغ','e');
  const H=rows[0].map(x=>String(x).trim());const find=(keys)=>{for(let i=0;i<H.length;i++)if(keys.some(k=>H[i].indexOf(k)>=0))return i;return -1;};
  let ci=find(['فصل','صف','class']),di=find(['يوم','day']),pi=find(['حصة','period','رقم']),si=find(['مادة','subject']),ti=find(['معلم','teacher']);
  if(ci<0||di<0||pi<0||si<0){ci=0;di=1;pi=2;si=3;ti=4;}
  const data=rows.slice(1).filter(r=>r[ci]&&String(r[ci]).trim());
  const classNames=[...new Set(data.map(r=>String(r[ci]).trim()))];
  confirmM('استيراد '+data.length+' حصة إلى «'+schoolName(ACTIVE)+'» وإنشاء الناقص من الفصول/المواد/المعلمين. سيُستبدل جدول '+classNames.length+' فصلاً. متابعة؟',()=>{
    const s=S();let placed=0,skipped=0,newC=0,newS=0,newT=0;const clsMap={};
    classNames.forEach(nm=>{const r=tGetClass(nm);if(r.created)newC++;clsMap[nm]=r.id;s.grid[r.id]={};});
    data.forEach(r=>{const cnm=String(r[ci]).trim();const cid=clsMap[cnm];const d=tDayIdx(String(r[di]||''));const per=parseInt(r[pi]);if(cid==null||d<0||!per){skipped++;return;}
      const starts=tLessonStarts(d);const start=starts[per-1];if(start==null||isBrk(start)||start+1>=dayEnd(d)){skipped++;return;}
      const subN=String(r[si]||'').trim();if(!subN){skipped++;return;}const sb=tGetSubject(subN,cls(cid).gradeId);if(sb.created)newS++;
      const tN=(ti>=0?String(r[ti]||'').trim():'');let teaId='';if(tN){const tt=tGetTeacher(tN,sb.id);if(tt.created)newT++;teaId=tt.id;}
      const g=s.grid[cid];if(g[d+'-'+start]){skipped++;return;}g[d+'-'+start]={sub:sb.id,tea:teaId,topic:'',room:'',span:2};g[d+'-'+(start+1)]={cont:start};placed++;});
    logAct('استيراد جدول',placed+' حصة · '+classNames.length+' فصل');save();

    renderGrid(reC());});});}

function curWeekDates(){const now=new Date();const sun=new Date(now);sun.setDate(now.getDate()-now.getDay());sun.setHours(0,0,0,0);const arr=[];for(let i=0;i<7;i++){const x=new Date(sun);x.setDate(sun.getDate()+i);arr.push(x.toISOString().slice(0,10));}return arr;}
function inCurWeek(dt){if(!dt)return false;const wk=curWeekDates();const d=new Date(dt+'T00:00'),ws=new Date(wk[0]+'T00:00'),we=new Date(wk[6]+'T00:00');return d>=ws&&d<=we;}

function renderLoads(c){const rows=loadsRows();const canAdd=rows.filter(r=>r.load<r.q*0.9).length,full=rows.filter(r=>r.load>=r.q).length;const seg=`<div class="filterbar"><div class="fg"><label>تصنيف المواد</label><div class="segbtns"><button class="${loadsType===''?'on':''}" onclick="setLoadsType('')">الكل</button><button class="${loadsType==='ثقافية'?'on':''}" onclick="setLoadsType('ثقافية')">مواد ثقافية</button><button class="${loadsType==='تخصص'?'on':''}" onclick="setLoadsType('تخصص')">مواد التخصص</button></div></div></div>`;c.innerHTML=`<div class="pghdr"><div><div class="pgtitle">⚖️ أنصبة المعلمين</div><div class="pgsub">الحصة = مربعان · حصة ونصف تُحتسب ١.٥</div></div><div style="display:flex;gap:8px"><button class="btn bout bsm" onclick="exportLoadsCSV()">↓ CSV</button><button class="btn bout bsm" onclick="printLoads()">🖨️ PDF</button></div></div>${schoolBar('loads')}${seg}<div class="mets"><div class="met green"><div class="mlbl">يمكن الإضافة لهم</div><div class="mval">${canAdd}</div></div><div class="met red"><div class="mlbl">مكتملو النصاب</div><div class="mval">${full}</div></div><div class="met teal"><div class="mlbl">المعلمون</div><div class="mval">${rows.length}</div></div></div><div class="card"><div class="tbwrap"><table><thead><tr><th>المعلم</th><th>النصاب</th><th>الحصص</th><th>المتبقى</th><th>النسبة</th><th>الحالة</th></tr></thead><tbody>${rows.map(r=>`<tr><td><b>${esc(r.t.name)}</b><div style="font-size:9px;color:var(--t3)">${esc(r.t.spec||'')}</div></td><td style="text-align:center">${r.q}</td><td style="text-align:center;font-weight:800;color:var(--N)">${r.load}</td><td style="text-align:center">${r.rem>0?r.rem:0}</td><td style="min-width:130px"><div style="background:#eef1f7;border-radius:20px;height:8px;overflow:hidden"><div style="height:100%;width:${Math.min(100,r.pct)}%;background:${r.load>=r.q?'#DC2626':r.load>=r.q*0.9?'#D97706':'#1D9E75'}"></div></div><div style="font-size:9px;color:var(--t3);margin-top:3px">${r.pct}%</div></td><td><span class="badge ${r.cl}">${r.status}</span></td></tr>`).join('')||'<tr><td colspan=6><div class="empty"><div class="empty-t">لا معلمون</div></div></td></tr>'}</tbody></table></div></div>`;}
function exportLoadsCSV(){const rows=[['المعلم','التخصص','النصاب','الحصص','المتبقى','النسبة%','الحالة']];loadsRows().forEach(r=>rows.push([r.t.name,r.t.spec||'',r.q,r.load,r.rem>0?r.rem:0,r.pct,r.status]));csvDownload(rows,'الأنصبة.csv');}
function printLoads(){let h='<table><thead><tr><th>المعلم</th><th>التخصص</th><th>النصاب</th><th>الحصص</th><th>المتبقى</th><th>الحالة</th></tr></thead><tbody>'+loadsRows().map(r=>`<tr><td>${esc(r.t.name)}</td><td>${esc(r.t.spec||'')}</td><td>${r.q}</td><td><b>${r.load}</b></td><td>${r.rem>0?r.rem:0}</td><td>${esc(r.status)}</td></tr>`).join('')+'</tbody></table>';printPDF('أنصبة المعلمين',h);}

function tDayLessons(teaId,di){const s=S();let n=0;s.classes.forEach(cl=>{const g=s.grid[cl.id]||{};for(let b=0;b<dayEnd(di);b++){const c=g[di+'-'+b];if(c&&c.cont==null&&c.tea===teaId)n++;}});return n;}
function reserveDayCount(teaId,dt){const c=S().cover[dt]||{};let n=0;Object.values(c).forEach(v=>{if(v===teaId)n++;});return n;}
function dailyReq(teaId){const s=S();const t=tea(teaId);if(t&&!isTeacherType(t))return 0;return Math.max(1,Math.round(((t&&t.max)||s.cfg.quota)/Math.max(1,nDays())));}
function dailyRows(dt){const s=S();const di=sundayIndex(s,new Date(dt+'T00:00').getDay());if(di==null)return [];return s.teachers.map(t=>{const les=tDayLessons(t.id,di),res=reserveDayCount(t.id,dt),sup=(typeof supCountDay==='function'?supCountDay(dt,t.id):0);const tot=les+res+sup;return {t,les,res,sup,tot,req:dailyReq(t.id)};}).filter(r=>r.tot>0).sort((a,b)=>b.tot-a.tot);}
function dailyLoadHTML(dt){const rows=dailyRows(dt);if(!rows.length)return '';
  const _dnotes=(S().staffNotes[dt]||{});const _canN=(SESSION.role==='manager'||SESSION.role==='principal'||SESSION.role==='affairs'||SESSION.role==='assessment');const _abs=(S().absence[dt]||[]);return `<table><thead><tr><th>المعلم</th><th>غياب</th><th>حصص اليوم</th><th>احتياطى</th><th>إشراف</th><th>الإجمالى الحالى</th><th>النصاب المطلوب</th><th>ملاحظات</th></tr></thead><tbody>${rows.map(r=>`<tr><td><b>${esc(r.t.name)}</b></td><td style="text-align:center">${_canN?`<input type="checkbox" ${_abs.indexOf(r.t.id)>=0?'checked':''} onchange="absMark('${dt}','${r.t.id}',this.checked)"/>`:(_abs.indexOf(r.t.id)>=0?'<span class="badge br">غائب</span>':'')}</td><td style="text-align:center">${r.les}</td><td style="text-align:center">${r.res}</td><td style="text-align:center">${r.sup}</td><td style="text-align:center"><span class="badge ${r.tot>r.req?'br':(r.tot===r.req?'ba':'bg')}">${r.tot}</span></td><td style="text-align:center">${r.req}</td><td>${_canN?`<input value="${esc(_dnotes[r.t.id]||'')}" onchange="staffNoteSet('${dt}','${r.t.id}',this.value)" style="width:140px;padding:5px;border:1px solid var(--bdr);border-radius:6px"/>`:esc(_dnotes[r.t.id]||'')}</td></tr>`).join('')}</tbody></table>`;}
function dailyLoadTable(dt){const rows=dailyRows(dt);if(!rows.length)return '';const chart=svgBars(rows.slice(0,14).map(r=>[r.t.name,r.tot]),{fn:'dlDetail',click:dt});return `<div class="card"><div class="chdr"><div class="ctitle">📊 النصاب اليومى للمعلمين — ${esc(dt)}</div><div style="display:flex;gap:6px"><button class="btn bout bsm" onclick="exportDaily('${dt}','pdf')">🖨️ PDF</button><button class="btn bout bsm" onclick="exportDaily('${dt}','xls')">📊 Excel</button></div></div><div class="info" style="margin-bottom:8px">انقر معلماً فى الرسم لعرض تفاصيل نصابه اليوم. الأحمر = تجاوز النصاب.</div><div style="margin-bottom:8px">${chart}</div><div class="ttwrap">${dailyLoadHTML(dt)}</div></div>`;}
function dlDetail(dt,name){const s=S();const t=s.teachers.find(x=>x.name===name);if(!t)return;const di=sundayIndex(s,new Date(dt+'T00:00').getDay());const les=[];for(let d2=di,dd=0;dd<1;dd++){}s.classes.forEach(cl=>{const g=s.grid[cl.id]||{};for(let b=0;b<dayEnd(di);b++){const c=g[di+'-'+b];if(c&&c.cont==null&&c.tea===t.id)les.push('فصل '+cls(cl.id).name+' · '+((s.cfg.blocks[b]||{}).t||'')+' · '+subj(c.sub).name);}});const res=[];const cov=s.cover[dt]||{};Object.keys(cov).forEach(k=>{if(cov[k]===t.id){const p=k.split('|');res.push('فصل '+cls(p[0]).name+' · '+((s.cfg.blocks[+p[1]]||{}).t||''));}});const sup=[];const sm=s.supervision[dt]||{};Object.keys(sm).forEach(k=>{if(sm[k]===t.id){const p=k.split('|');sup.push(((s.cfg.supPlaces.find(x=>x.id===p[0])||{}).name||'')+' · '+((s.cfg.blocks[+p[1]]||{}).t||''));}});const req=dailyReq(t.id);const tot=les.length+res.length+sup.length;const li=arr=>arr.length?('<ul style="margin:4px 0;padding-right:18px">'+arr.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>'):'<div class="info">لا شىء</div>';openM(`<div class="mbox"><div class="mhdr teal"><span class="mtitle">نصاب ${esc(name)} — ${esc(dt)}</span><button class="mcls" onclick="closeM()">✕</button></div><div class="mbody"><div class="mets"><div class="met teal"><div class="mlbl">الإجمالى اليوم</div><div class="mval">${tot}</div></div><div class="met"><div class="mlbl">النصاب المطلوب</div><div class="mval">${req}</div></div></div><b>حصصه (${les.length}):</b>${li(les)}<b>احتياطى (${res.length}):</b>${li(res)}<b>إشراف (${sup.length}):</b>${li(sup)}</div><div class="mfoot"><button class="btn bout bsm" onclick="closeM()">إغلاق</button></div></div>`);}
function exportDaily(dt,kind){const html=dailyLoadHTML(dt);if(!html)return toast('لا بيانات','w');const title='النصاب اليومى - '+dt;if(kind==='pdf')printPDF(title,html);else downloadDoc(title+'.xls','application/vnd.ms-excel',wrapExport(title,html));}
function reserveGridHTML(dateISO,forExport){const s=S();const di=sundayIndex(s,new Date(dateISO+'T00:00').getDay());if(di==null)return '<div class="info">التاريخ ليس يوم دراسة.</div>';const cov=s.cover[dateISO]||{};const absent=(s.absence[dateISO]||[]);const cols=teachBlocks(di);
  let h='<div class="ttwrap"><table class="ttable blocks"><thead><tr><th class="tt-daycol">الفصل \\ التوقيت</th>'+cols.map(b=>'<th>'+esc((s.cfg.blocks[b]||{}).t)+'<br>'+esc((s.cfg.blocks[b]||{}).e)+'</th>').join('')+'</tr></thead><tbody>';
  s.classes.forEach(cl=>{const g=s.grid[cl.id]||{};let has=false;cols.forEach(b=>{const ci=gCoverAt(g,di,b);if(ci&&ci.cell&&ci.cell.sub)has=true;});if(!has)return;h+='<tr><td class="tt-daycol">'+esc(cl.name)+'</td>';let skip=0;cols.forEach((b,idx)=>{if(skip>0){skip--;return;}const c=g[di+'-'+b];if(!c||c.cont!=null||!c.sub){h+='<td class="tt-cell"></td>';return;}const span=c.span||2;skip=span-1;const sb=subj(c.sub);const _perm=(s.perm[dateISO]||{});const permFrom=_perm[c.tea];const isGap=absent.includes(c.tea)||(permFrom!=null&&b>=permFrom);const sub=cov[cl.id+'|'+b];if(isGap){h+='<td class="tt-cell" colspan="'+span+'" style="background:'+(sub?'#DCFCE7':'#FEE2E2')+';color:#111"><div class="tt-sub">'+esc(sb.name)+'</div><div class="tt-tea">'+(absent.includes(c.tea)?'غائب: ':'مأذون: ')+esc(tea(c.tea).name||'')+'</div><div class="blkspan" style="font-weight:800;color:'+(sub?'#166534':'#991B1B')+'">'+(sub?('بديل: '+esc(tea(sub).name||'')):'بدون بديل')+'</div></td>';}else{h+='<td class="tt-cell" colspan="'+span+'" style="background:'+sb.color+'"><div class="tt-sub">'+esc(sb.name)+'</div><div class="tt-tea">'+esc(tea(c.tea).name||'')+'</div></td>';}});h+='</tr>';});
  return h+'</tbody></table></div>';}
function exportReserve(kind){const title='الجدول الاحتياطى — '+resDate;const html=reserveGridHTML(resDate,true);if(kind==='pdf')printPDF(title,html.replace(/class=\"[^\"]*\"/g,''));else if(kind==='xls')downloadDoc(title+'.xls','application/vnd.ms-excel',wrapExport(title,html));else downloadDoc(title+'.doc','application/msword',wrapExport(title,html));}
function reserveData(dateISO){const s=S();const di=sundayIndex(s,new Date(dateISO+'T00:00').getDay());const absent=(s.absence[dateISO]||[]);const gaps=[];if(di!=null)s.classes.forEach(cl=>{const g=s.grid[cl.id]||{};Object.keys(g).forEach(k=>{const cc=g[k];if(!cc||cc.cont!=null||!cc.tea)return;const[d,b]=k.split('-').map(Number);if(d!==di)return;if(absent.includes(cc.tea))gaps.push({classId:cl.id,b,span:cc.span||2,sub:cc.sub,absentTea:cc.tea});});});return{di,absent,gaps};}
function coverLoadOf(dateISO,teaId){const cov=S().cover[dateISO]||{};return Object.values(cov).filter(v=>v===teaId).length;}
function weekDates(dateISO){const d=new Date(dateISO+'T00:00');const wd=d.getDay();const sun=new Date(d);sun.setDate(d.getDate()-wd);const arr=[];for(let i=0;i<7;i++){const x=new Date(sun);x.setDate(sun.getDate()+i);arr.push(x.toISOString().slice(0,10));}return arr;}
function weekExtra(teaId,dateISO){const s=S();let n=0;weekDates(dateISO).forEach(dt=>{const c=s.cover[dt]||{};Object.values(c).forEach(v=>{if(v===teaId)n++;});const sp=s.supervision[dt]||{};Object.values(sp).forEach(v=>{if(v===teaId)n++;});});return n;}
function subCandidates(di,b,span,sub,absent,dateISO,busy){const s=S(),out=[],cap=s.cfg.superCap||25;const _pm=(s.perm[dateISO]||{});s.teachers.forEach(t=>{if(t.contract==='part')return;if(absent.includes(t.id))return;if(_pm[t.id]!=null&&b>=_pm[t.id])return;if(busy&&busy.has(t.id))return;if(teacherBusyRange(t.id,di,b,span))return;if((teacherLoad(t.id)+reserveCountAll(t.id))>=cap)return;const load=teacherLoad(t.id)+(dateISO?weekExtra(t.id,dateISO):0);const nonTea=!isTeacherType(t);const q=nonTea?9999:(t.max||s.cfg.quota);const nearFull=nonTea?false:(load>=q||load>=q*0.9);const match=(t.subjects||[]).includes(sub)||t.spec===subj(sub).name;out.push({t,load,q,nearFull,match,nonTea});});out.sort((a,b)=>(a.nonTea?1:0)-(b.nonTea?1:0)||(a.nearFull!==b.nearFull?a.nearFull-b.nearFull:a.load!==b.load?a.load-b.load:(b.match?1:0)-(a.match?1:0)));return out;}
/* ===== SUPERVISION (الإشراف) ===== */
function reserveCountAll(teaId){let n=0;const cov=S().cover||{};Object.keys(cov).forEach(dt=>{const c=cov[dt]||{};Object.values(c).forEach(v=>{if(v===teaId)n++;});});return n;}
function supCountDay(dt,teaId){const sp=(S().supervision||{})[dt]||{};let n=0;Object.values(sp).forEach(v=>{if(v===teaId)n++;});return n;}
function supCountAll(teaId){let n=0;const S1=S().supervision||{};Object.keys(S1).forEach(dt=>Object.values(S1[dt]||{}).forEach(v=>{if(v===teaId)n++;}));return n;}
function occupiedAt(dateISO,di,start,teaId){if(teacherBusyRange(teaId,di,start,2))return true;const cov=S().cover[dateISO]||{};for(const k in cov){if(k.endsWith('|'+start)&&cov[k]===teaId)return true;}const sp=S().supervision[dateISO]||{};for(const k in sp){if(k.endsWith('|'+start)&&sp[k]===teaId)return true;}return false;}
function supCandidates(di,start,dateISO,busy){const s=S(),cap=s.cfg.superCap||25,absent=s.absence[dateISO]||[];const out=[];s.teachers.forEach(t=>{if(t.contract==='part')return;if(absent.includes(t.id))return;if(busy&&busy.has(t.id))return;if(occupiedAt(dateISO,di,start,t.id))return;const bl=teacherLoad(t.id)+weekExtra(t.id,dateISO);if(isTeacherType(t)&&bl>=cap)return;if(s.cfg.noConsecutiveSup){const sts=tLessonStarts(di);const ix=sts.indexOf(start);const sup=s.supervision[dateISO]||{};const adj=[sts[ix-1],sts[ix+1]].filter(x=>x!=null);if(adj.some(as=>Object.keys(sup).some(k=>k.endsWith('|'+as)&&sup[k]===t.id)))return;}out.push({t,bl,sup:supCountDay(dateISO,t.id)});});out.sort((a,b)=>a.bl-b.bl||a.sup-b.sup);return out;}
var supDate=todayISO();
function supStaff(){return DB.users.filter(u=>u.schoolId===ACTIVE&&['principal','affairs','assessment','quality','staff'].indexOf(u.role)>=0).map(u=>({id:u.id,name:u.name+' ('+ROLES[u.role].label+')'}));}
function supName(id){const t=tea(id);if(t&&t.id)return t.name;const u=DB.users.find(x=>x.id===id);return u?u.name:(id||'—');}
function reSup(){renderSupervision(reC());}
function setSuperCap(v){const n=parseInt(v);if(!n||n<1)return;S().cfg.superCap=n;save();reSup();}
function setNoConsec(v){S().cfg.noConsecutiveSup=!!v;logAct('منع إشراف متتالى',v?'مفعّل':'معطّل');save();reSup();toast(v?'تم تفعيل منع الإشراف المتتالى':'تم الإلغاء','s');}
function supAddPlace(){const nm=prompt('اسم موقع الإشراف (مثال: الملعب):','');if(!nm)return;S().cfg.supPlaces.push({id:uid('sp'),name:nm.trim()});save();reSup();}
function supDelPlace(id){confirmM('حذف هذا الموقع؟ ستُزال تعييناته.',()=>{const s=S();s.cfg.supPlaces=s.cfg.supPlaces.filter(p=>p.id!==id);Object.keys(s.supervision).forEach(dt=>{Object.keys(s.supervision[dt]).forEach(k=>{if(k.split('|')[0]===id)delete s.supervision[dt][k];});});save();reSup();});}
function supAssign(placeId,start,teaId){const s=S();const m=s.supervision[supDate]=s.supervision[supDate]||{};if(teaId){m[placeId+'|'+start]=teaId;if(tea(teaId)&&tea(teaId).id)notify({tea:teaId,text:'🧭 أُسند إليك إشراف — '+((s.cfg.supPlaces.find(p=>p.id===placeId)||{}).name||'')+' ('+((s.cfg.blocks[start]||{}).t||'')+') — '+supDate});}else delete m[placeId+'|'+start];logAct('تعيين إشراف',(teaId?tea(teaId).name:'إزالة')+' — '+((s.cfg.supPlaces.find(p=>p.id===placeId)||{}).name||'')+' — '+supDate);save();reSup();}
function supAuto(){const s=S();const di=sundayIndex(s,new Date(supDate+'T00:00').getDay());if(di==null)return toast('التاريخ ليس يوم دراسة','w');const starts=tLessonStarts(di);const m=s.supervision[supDate]={};const busyBy={};starts.forEach(start=>{const busy=busyBy[start]=busyBy[start]||new Set();s.cfg.supPlaces.forEach(p=>{const cand=supCandidates(di,start,supDate,busy);if(cand.length){m[p.id+'|'+start]=cand[0].t.id;busy.add(cand[0].t.id);}});});logAct('توليد إشراف تلقائى',supDate);save();reSup();toast('تم ترشيح المشرفين','s');}
function renderSupervision(c){if(!can('reserve')){c.innerHTML='<div class="empty"><div class="empty-ic">🔒</div><div class="empty-t">لإدارة الجدول ومدير المدرسة</div></div>';return;}
  const s=S();const di=sundayIndex(s,new Date(supDate+'T00:00').getDay());const schoolDay=di!=null;const cap=s.cfg.superCap||25;const starts=schoolDay?tLessonStarts(di):[];
  const placeMgr=s.cfg.supPlaces.map(p=>`<span class="clschip">📍 ${esc(p.name)} <span class="x" onclick="supDelPlace('${p.id}')">✕</span></span>`).join('');
  let matrix='';
  if(!schoolDay)matrix='<div class="warnbox">📅 التاريخ المحدد ليس يوم دراسة.</div>';
  else{const m=s.supervision[supDate]||{};

var repTab='status',repF={gradeId:'',classId:'',teaId:'',type:'',from:'',to:'',month:''};
function repScope(){ // teacher sees only own classes/teacher
  if(SESSION.role==='teacher'){const ids=teacherClasses(SESSION.teacherId);return {teacher:true,classIds:ids,teaId:SESSION.teacherId};}
  return {teacher:false,classIds:S().classes.map(c=>c.id),teaId:''};}
function repClassesForGrade(sc,gid){return (gid?classesOfGrade(gid):S().classes).filter(c=>sc.classIds.includes(c.id));}
function scheduleStatus(sc){const s=S();const rows=[];let capB=0,useB=0,lessons=0;
  s.classes.forEach(cl=>{if(!sc.classIds.includes(cl.id))return;if(repF.gradeId&&cl.gradeId!==repF.gradeId)return;if(repF.classId&&cl.id!==repF.classId)return;
    const g=s.grid[cl.id]||{};let cap=0,use=0,les=0;for(let d=0;d<nDays();d++){cap+=teachBlocks(d).length;}
    Object.keys(g).forEach(k=>{const c=g[k];if(c&&c.cont==null&&c.sub){les++;use+=(c.span||2);}});
    capB+=cap;useB+=use;lessons+=les;
    rows.push({cl,cap,use,les,pct:cap?Math.round(use/cap*100):0,empty:cap-use});});
  return {rows,capB,useB,lessons,pct:capB?Math.round(useB/capB*100):0};}

function empStats(t,mon){const s=S();const from=mon+'-01';const d0=new Date(mon+'-01');d0.setMonth(d0.getMonth()+1);d0.setDate(0);const to=d0.toISOString().slice(0,10);const days=[];let cur=new Date(from);const end=new Date(to);while(cur<=end){if(sundayIndex(s,cur.getDay())!=null)days.push(cur.toISOString().slice(0,10));cur.setDate(cur.getDate()+1);}
  const D=days.length;let abs=0,resM=0,supM=0;days.forEach(dt=>{if((s.absence[dt]||[]).indexOf(t.id)>=0)abs++;resM+=reserveDayCount(t.id,dt);const sp=s.supervision[dt]||{};supM+=Object.values(sp).filter(v=>v===t.id).length;});
  const present=D-abs;const attPct=D?Math.round(present/D*100):0;const comp=compliance(s,{teaId:t.id});const execPct=comp.commit;
  const evM=(s.quality.evals||[]).filter(e=>e.teacherName===t.name&&(e.date||'').slice(0,7)===mon);const qVisitsAuto=evM.length;const qPctAuto=evM.length?Math.round(evM.reduce((a,e)=>a+e.total/qTpl(e.type).scaleMax*100,0)/evM.length):0;
  const ed=((s.empMonthly[mon]||{})[t.id])||{};const qVisits=(ed.qVisits!==undefined&&ed.qVisits!=='')?+ed.qVisits:qVisitsAuto;const qPct=(ed.qManualPct!==undefined&&ed.qManualPct!=='')?+ed.qManualPct:qPctAuto;
  const w=s.cfg.empWeights;const wsum=(w.att+w.exec+w.qual)||1;const overall=Math.round((attPct*w.att+execPct*w.exec+qPct*w.qual)/wsum);
  const _ap=[];if(resM)_ap.push('مُسند احتياطى: '+resM+' مرة');if(supM)_ap.push('مُسند إشراف: '+supM+' مرة');const autoNote=_ap.join(' · ');
  return {D,present,abs,attPct,absPct:D?100-attPct:0,req:(t.max||s.cfg.quota),execPct,resM,supM,qVisits,qPct,overall,autoNote,inv:ed.investigation||'لا',invReason:ed.invReason||'',note:ed.note||''};}

function editUser(id){const u=id?DB.users.find(x=>x.id===id):{role:isSuper()?'principal':'teacher',schoolId:isSuper()?DB.schools[0].id:(SESSION.schoolId||ACTIVE)};const roleOpts=isSuper()?['principal','teacher','affairs','assessment','quality','staff','follower']:['teacher','affairs','assessment','quality','staff','follower','student'];const schoolLocked=!isSuper();const schoolId=schoolLocked?(SESSION.schoolId||ACTIVE):(u.schoolId||DB.schools[0].id);

function holDays(h){try{const a=new Date(h.from+'T00:00'),b=new Date((h.to||h.from)+'T00:00');return Math.max(1,Math.round((b-a)/864e5)+1);}catch(e){return 1;}}
function curWeek(s){try{const y=new Date(s.cfg.yearStart+'T00:00'),n=new Date();const w=Math.floor((n-y)/(7*864e5))+1;return w;}catch(e){return 0;}}
function opSaveWeekend(){S().cfg.weekend=[...document.querySelectorAll('.wk-day:checked')].map(x=>x.value);logAct('تعديل عطلة أسبوعية',S().cfg.weekend.join('،'));save();reOp();toast('تم الحفظ','s');}
function opSaveYear(){S().cfg.yearStart=document.getElementById('op-ystart').value;logAct('بداية العام',S().cfg.yearStart);save();reOp();toast('تم الحفظ','s');}
function opTerm(i,f,v){S().cfg.terms[i][f]=v;save();}
function opHoliday(id){const h=id?(S().cfg.holidays.find(x=>x.id===id)):{name:'',from:todayISO(),to:todayISO()};openM(`<div class="mbox"><div class="mhdr teal"><span class="mtitle">${id?'تعديل إجازة':'إضافة إجازة'}</span><button class="mcls" onclick="closeM()">✕</button></div><div class="mbody"><div class="fgrid"><div class="fm full"><label>اسم الإجازة *</label><input id="h-name" value="${esc(h.name||'')}" placeholder="مثال: إجازة نصف العام"/></div><div class="fm"><label>من</label><input type="date" id="h-from" value="${h.from}"/></div><div class="fm"><label>إلى</label><input type="date" id="h-to" value="${h.to||h.from}"/></div></div></div><div class="mfoot"><button class="btn bout bsm" onclick="closeM()">إلغاء</button><button class="btn bteal bsm" onclick="opSaveHoliday('${id||''}')">حفظ</button></div></div>`);}

function opDelHoliday(id){confirmM('حذف هذه الإجازة؟',()=>{S().cfg.holidays=S().cfg.holidays.filter(x=>x.id!==id);save();reOp();toast('تم الحذف','e');});}

const PSTATUS={draft:{l:'مسودة',c:'bn'},submitted:{l:'بانتظار الاعتماد',c:'ba'},approved:{l:'معتمدة',c:'bg'}};
function planProgress(p){const t=(p.items||[]).length,dn=(p.items||[]).filter(i=>i.done).length;return{t,dn,pct:t?Math.round(dn/t*100):0};}
function opActEdit(id){const s=S();const a=id?((s.opActions||[]).find(x=>x.id===id)||{}):{};openM(`<div class="mbox wide"><div class="mhdr teal"><span class="mtitle">${id?'تعديل بند':'إضافة بند للخطة'}</span><button class="mcls" onclick="closeM()">✕</button></div><div class="mbody"><div class="fgrid"><div class="fm full"><label>البند / النشاط</label><input id="oa-title" value="${esc(a.title||'')}"/></div><div class="fm"><label>المسؤول</label><input id="oa-resp" value="${esc(a.resp||'')}"/></div><div class="fm"><label>الحالة</label><select id="oa-status">${OP_STATUS.map(x=>`<option ${a.status===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="fm"><label>تاريخ البدء</label><input id="oa-start" type="date" value="${esc(a.start||'')}"/></div><div class="fm"><label>تاريخ الانتهاء</label><input id="oa-due" type="date" value="${esc(a.due||'')}"/></div><div class="fm"><label>نسبة الإنجاز%</label><input id="oa-prog" type="number" min="0" max="100" value="${a.prog!=null?a.prog:0}"/></div><div class="fm full"><label>مؤشر الإنجاز/المتابعة</label><input id="oa-kpi" value="${esc(a.kpi||'')}"/></div><div class="fm full"><label>ملاحظات</label><input id="oa-note" value="${esc(a.note||'')}"/></div></div></div><div class="mfoot"><button class="btn bout bsm" onclick="closeM()">إلغاء</button><button class="btn bteal bsm" onclick="opActSave('${id||''}')">حفظ</button></div></div>`);}
function opActSave(id){const s=S();const rec={title:(document.getElementById('oa-title')||{}).value.trim(),resp:(document.getElementById('oa-resp')||{}).value.trim(),status:(document.getElementById('oa-status')||{}).value,start:normDate((document.getElementById('oa-start')||{}).value)||'',due:normDate((document.getElementById('oa-due')||{}).value)||'',prog:Math.max(0,Math.min(100,parseInt((document.getElementById('oa-prog')||{}).value)||0)),kpi:(document.getElementById('oa-kpi')||{}).value.trim(),note:(document.getElementById('oa-note')||{}).value.trim()};if(!rec.title)return toast('عنوان البند مطلوب','e');if(rec.status==='منجز')rec.prog=100;if(rec.prog>=100)rec.status='منجز';s.opActions=s.opActions||[];if(id){const a=s.opActions.find(x=>x.id===id);if(a)Object.assign(a,rec);}else{rec.id=uid('oa');rec.by=SESSION.name;rec.ts=Date.now();s.opActions.push(rec);}logAct('بند خطة تشغيلية',rec.title);save();pushNow&&pushNow();closeM();reOp();toast('تم الحفظ','s');}
function opActToggle(id){const s=S();const a=(s.opActions||[]).find(x=>x.id===id);if(!a)return;const done=a.status==='منجز';a.status=done?'جارٍ':'منجز';a.prog=done?a.prog:100;logAct('متابعة بند',a.title+' — '+a.status);save();reOp();}
function opActDel(id){confirmM('حذف هذا البند؟',()=>{const s=S();tombAdd('opActions',id);s.opActions=(s.opActions||[]).filter(x=>x.id!==id);save();pushNow&&pushNow();reOp();});}
function opActFiltered(){let a=(S().opActions||[]).slice();if(opAF.status)a=a.filter(x=>x.status===opAF.status);if(opAF.resp)a=a.filter(x=>(x.resp||'')===opAF.resp);if(opAF.from)a=a.filter(x=>(x.due||x.start||'')>=opAF.from);if(opAF.to)a=a.filter(x=>(x.due||x.start||'')<=opAF.to);if(opAF.q){const q=opAF.q.trim();a=a.filter(x=>((x.title||'')+' '+(x.resp||'')+' '+(x.kpi||'')).indexOf(q)>=0);}return a;}
function opOverdue(a){return a.due&&a.status!=='منجز'&&a.due<todayISO();}
function opActionsView(){const ro=!can('opEdit');const rows=opActFiltered();const resps=[...new Set((S().opActions||[]).map(x=>x.resp).filter(Boolean))];
  const filt=`<div class="filterbar"><div class="fg"><label>الحالة</label><select onchange="opAF.status=this.value;reOp()"><option value="">الكل</option>${OP_STATUS.map(x=>`<option ${opAF.status===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="fg"><label>المسؤول</label><select onchange="opAF.resp=this.value;reOp()"><option value="">الكل</option>${resps.map(x=>`<option ${opAF.resp===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div class="fg"><label>من</label><input type="date" value="${opAF.from}" onchange="opAF.from=this.value;reOp()"/></div><div class="fg"><label>إلى</label><input type="date" value="${opAF.to}" onchange="opAF.to=this.value;reOp()"/></div><div class="fg grow"><label>🔎 بحث</label><input value="${esc(opAF.q)}" oninput="opAF.q=this.value;reOp()" placeholder="بند/مسؤول/مؤشر"/></div></div>`;
  const trs=rows.map(a=>{const cl={['منجز']:'bg',['جارٍ']:'ba',['متعثّر']:'br',['لم يبدأ']:'bn'}[a.status]||'bn';const over=opOverdue(a);return `<tr${over?' style="background:#FEF2F2"':''}><td style="text-align:center">${!ro?`<input type="checkbox" ${a.status==='منجز'?'checked':''} onchange="opActToggle('${a.id}')"/>`:(a.status==='منجز'?'✅':'')}</td><td><b>${esc(a.title)}</b>${a.kpi?`<div style="font-size:10px;color:var(--t3)">${esc(a.kpi)}</div>`:''}</td><td>${esc(a.resp||'')}</td><td><span class="badge ${cl}">${esc(a.status)}</span>${over?' <span class="badge br">متأخر</span>':''}</td><td style="text-align:center">${a.start||''}</td><td style="text-align:center">${a.due||''}</td><td style="min-width:90px"><div style="background:#eef1f7;border-radius:20px;height:8px;overflow:hidden"><div style="height:8px;width:${a.prog||0}%;background:${(a.prog||0)>=100?'#1D9E75':'#57B1C9'}"></div></div><div style="font-size:10px;text-align:center">${a.prog||0}%</div></td><td>${esc(a.note||'')}</td>${!ro?`<td style="white-space:nowrap"><button class="btn bxsm bout" onclick="opActEdit('${a.id}')">تعديل</button><button class="iconbtn del" onclick="opActDel('${a.id}')">🗑</button></td>`:'<td></td>'}</tr>`;}).join('');
  return filt+`<div class="card"><div class="chdr"><div class="ctitle">🎯 بنود الخطة التشغيلية (${rows.length})</div><div style="display:flex;gap:6px;flex-wrap:wrap">${!ro?'<button class="btn bteal bsm" onclick="opActEdit(\'\')">+ بند</button>':''}<button class="btn bout bsm" onclick="opActExport(\'xls\')">Excel</button><button class="btn bout bsm" onclick="opActExport(\'doc\')">Word</button><button class="btn bout bsm" onclick="opActExport(\'pdf\')">PDF</button></div></div>${ro?'<div class="info" style="margin-bottom:8px">عرض فقط — الإضافة والمتابعة لمدير المدرسة.</div>':''}<div class="tbwrap"><table><thead><tr><th style="width:34px">✓</th><th>البند</th><th>المسؤول</th><th>الحالة</th><th>البدء</th><th>الانتهاء</th><th>الإنجاز</th><th>ملاحظات</th><th></th></tr></thead><tbody>${trs||'<tr><td colspan=9><div class="empty"><div class="empty-t">لا بنود — أضِف بنود الخطة</div></div></td></tr>'}</tbody></table></div></div>`;}
function opActDash(){const all=(S().opActions||[]);const byStatus={};OP_STATUS.forEach(x=>byStatus[x]=0);all.forEach(a=>byStatus[a.status]=(byStatus[a.status]||0)+1);const done=byStatus['منجز']||0;const over=all.filter(opOverdue).length;const avg=all.length?Math.round(all.reduce((s,a)=>s+(+a.prog||0),0)/all.length):0;const byResp={};all.forEach(a=>{if(a.resp)byResp[a.resp]=(byResp[a.resp]||0)+1;});

  return `<div class="card"><div class="chdr"><div class="ctitle">📊 داش بورد الخطة التشغيلية</div><button class="btn bout bsm" onclick="opActExport('pdf')">🖨️ PDF</button></div>${mets}<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px">${card('حسب الحالة',svgPie(Object.entries(byStatus)))}${card('البنود حسب المسؤول',svgBars(Object.entries(byResp)))}</div></div>`;}
function opActExport(kind){const rows=opActFiltered();const html='<table><thead><tr><th>البند</th><th>المسؤول</th><th>الحالة</th><th>البدء</th><th>الانتهاء</th><th>الإنجاز%</th><th>المؤشر</th><th>ملاحظات</th></tr></thead><tbody>'+rows.map(a=>'<tr><td>'+esc(a.title)+'</td><td>'+esc(a.resp||'')+'</td><td>'+esc(a.status||'')+'</td><td>'+esc(a.start||'')+'</td><td>'+esc(a.due||'')+'</td><td>'+(a.prog||0)+'</td><td>'+esc(a.kpi||'')+'</td><td>'+esc(a.note||'')+'</td></tr>').join('')+'</tbody></table>';const wrapped=aLogoBar()+'<h2 style="text-align:center">الخطة التشغيلية — '+esc(schoolName(ACTIVE))+'</h2>'+html+officialFooter();if(kind==='xls')downloadDoc('الخطة_التشغيلية.xls','application/vnd.ms-excel',wrapExport('الخطة التشغيلية',html));else if(kind==='doc')downloadDoc('الخطة_التشغيلية.doc','application/msword',wrapExport('الخطة التشغيلية',wrapped));else printPDF('الخطة التشغيلية',wrapped);}

function renderPlans(c){if(!can('plansView')){c.innerHTML='<div class="empty"><div class="empty-ic">🔒</div><div class="empty-t">غير متاح</div></div>';return;}
  const s=S(),r=SESSION.role;let list=(s.plans||[]).slice();
  if(r==='teacher')list=list.filter(p=>p.teacherId===SESSION.teacherId);
  list.sort((a,b)=>(a.term-b.term)||b.ts-a.ts);
  const pend=list.filter(p=>p.status==='submitted'||p.status==='draft').length,req=list.filter(p=>p.editReq).length;
  const notice=(r==='principal'&&(pend||req))?`<div class="warnbox" style="margin-bottom:12px">لديك <b>${pend}</b> خطة بانتظار الاعتماد${req?` و<b>${req}</b> طلب تعديل`:''}.</div>`:'';
  const cards=list.map(p=>{const pr=planProgress(p),st=PSTATUS[p.status]||PSTATUS.draft;const isOwn=p.teacherId===SESSION.teacherId;const canApprove=can('plansApprove');
    let btns='';
    if(r==='teacher'&&isOwn){if(p.status==='draft')btns=`<button class="btn bxsm bteal" onclick="planEditor('${p.id}')">تحرير البنود</button><button class="btn bxsm bout" onclick="importCurrToPlan('${p.id}')">📥 استيراد Excel/CSV</button><button class="btn bxsm bpri" onclick="planSubmit('${p.id}')">إرسال للاعتماد</button><button class="btn bxsm bred" onclick="planDel('${p.id}')">حذف</button>`;
      else if(p.status==='submitted')btns=`<button class="btn bxsm bout" onclick="planEditor('${p.id}',true)">عرض</button><span class="badge ba">بانتظار مدير المدرسة</span>`;
      else btns=`<button class="btn bxsm bout" onclick="planEditor('${p.id}',true)">عرض ومتابعة التنفيذ</button>${p.editReq?'<span class="badge ba">طلب تعديل قيد المراجعة</span>':'<button class="btn bxsm bwarn" onclick="planRequestEdit(\''+p.id+'\')">طلب إذن تعديل</button>'}`;}
    else if(canApprove){btns=`<button class="btn bxsm bout" onclick="planEditor('${p.id}',true)">مراجعة</button>`;if(p.status==='draft')btns+=`<button class="btn bxsm bgreen" onclick="planApprove('${p.id}')">✓ اعتماد</button><button class="btn bxsm bred" onclick="planDel('${p.id}')">حذف</button>`;if(p.status==='submitted')btns+=`<button class="btn bxsm bgreen" onclick="planApprove('${p.id}')">✓ اعتماد</button><button class="btn bxsm bred" onclick="planReturn('${p.id}')">إعادة للتعديل</button>`;if(p.editReq)btns+=`<button class="btn bxsm bwarn" onclick="planGrantEdit('${p.id}')">السماح بالتعديل</button>`;if(p.status==='approved')btns+=`<button class="btn bxsm bred" onclick="planRevoke('${p.id}')">↩ إلغاء الاعتماد</button>`;}
    else btns=`<button class="btn bxsm bout" onclick="planEditor('${p.id}',true)">عرض</button>`;
    return `<div class="hwitem"><div class="hwmeta"><span class="badge ${st.c}">${st.l}</span><span class="badge bn">الصف ${esc(grade(cls(p.classId).gradeId).name)} · فصل ${esc(cls(p.classId).name)}</span><span class="badge bt"><span class="colordot" style="background:${subj(p.subId).color}"></span>${esc(subj(p.subId).name)}</span><span class="badge bpur">👨‍🏫 ${esc(tea(p.teacherId).name||'')}</span><span class="badge bn">الفصل الدراسى ${p.term}</span><span class="hwdate">التنفيذ ${pr.dn}/${pr.t} (${pr.pct}%)</span></div>
      <div class="sbar" style="max-width:280px"><span style="width:${pr.pct}%;background:${pr.pct>=80?'#1D9E75':pr.pct>=40?'#D97706':'#57B1C9'}"></span></div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px">${btns}</div></div>`;}).join('');
  c.innerHTML=`<div class="pghdr"><div><div class="pgtitle">🗂️ خطط المناهج</div><div class="pgsub">${r==='teacher'?'خطتك المتكاملة لكل مادة وفصل وترم':'اعتماد ومتابعة خطط المعلمين'}</div></div>${can('plansOwn')?`<button class="btn bteal bsm" onclick="planNew()">+ خطة جديدة</button>`:''}${can('plansApprove')?`<button class="btn bgreen bsm" onclick="planApproveAll()">✓ اعتماد كل المعلّقة</button>`:''}</div>${schoolBar('plans')}<div class="filterbar"><div class="fg" style="flex:1"><label>النماذج والاستيراد</label><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn bout bsm" onclick="dlCurrTemplate()">⬇️ نموذج Excel</button><button class="btn bout bsm" onclick="dlCurrTemplateCSV()">CSV</button>${can('plansOwn')?'<button class="btn bout bsm" onclick="importCurrNew()">📥 استيراد (Excel/CSV)</button>':''}${can('plansApprove')?'<button class="btn bteal bsm" onclick="importCurrForTeacher()">📤 رفع خطة لمعلم</button>':''}</div></div></div>${notice}<div style="display:flex;flex-direction:column;gap:10px">${cards||'<div class="empty"><div class="empty-ic">📭</div><div class="empty-t">لا خطط بعد</div></div>'}</div>`;
}
function planNew(){const s=S();const clsPool=teacherClasses(SESSION.teacherId).map(cls);if(!clsPool.length)return toast('لا فصول مسندة إليك','w');const cid=clsPool[0].id;const subPool=teacherSubjectsInClass(SESSION.teacherId,cid).map(subj);
  openM(`<div class="mbox"><div class="mhdr teal"><span class="mtitle">خطة منهج جديدة</span><button class="mcls" onclick="closeM()">✕</button></div><div class="mbody"><div class="fgrid"><div class="fm"><label>الفصل</label><select id="pl-cls" onchange="planNewCls()">${clsPool.map(x=>`<option value="${x.id}">فصل ${esc(x.name)}</option>`).join('')}</select></div><div class="fm"><label>المادة</label><select id="pl-sub">${subPool.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></div><div class="fm"><label>الفصل الدراسى</label><select id="pl-term"><option value="1">الأول</option><option value="2">الثانى</option></select></div><div class="fm"><label>عدد الأسابيع</label><input type="number" id="pl-weeks" value="15" min="1" max="40"/></div></div><div class="info" style="margin-top:8px">ستُنشأ بنود أسبوعية فارغة تكتب فيها عناوين الدروس، ثم ترسلها لاعتماد مدير المدرسة.</div></div><div class="mfoot"><button class="btn bout bsm" onclick="closeM()">إلغاء</button><button class="btn bteal bsm" onclick="planCreate()">إنشاء</button></div></div>`);}
function planNewCls(){const cid=document.getElementById('pl-cls').value;const subPool=teacherSubjectsInClass(SESSION.teacherId,cid).map(subj);document.getElementById('pl-sub').innerHTML=subPool.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');}
function planCreate(){const s=S();const classId=document.getElementById('pl-cls').value,subId=document.getElementById('pl-sub').value,term=+document.getElementById('pl-term').value,weeks=Math.max(1,Math.min(40,+document.getElementById('pl-weeks').value||15));
  if((s.plans||[]).some(p=>p.teacherId===SESSION.teacherId&&p.classId===classId&&p.subId===subId&&p.term===term))return toast('توجد خطة لنفس المادة والفصل والترم','e');
  const items=[];for(let w=1;w<=weeks;w++)items.push({week:w,title:'',note:'',done:false,doneDate:''});
  const p={_v:Date.now(),id:uid('pl'),teacherId:SESSION.teacherId,classId,subId,term,status:'submitted',editReq:false,items,ts:Date.now()};p._v=Date.now();s.plans.push(p);logAct('إنشاء خطة منهج',subj(subId).name+' — فصل '+cls(classId).name);save();closeM();planEditor(p.id);}
function planEditor(id,view){const p=(S().plans||[]).find(x=>x.id===id);if(!p)return;const locked=view||(p.status==='approved'&&SESSION.role==='teacher')||(SESSION.role==='teacher'&&p.teacherId!==SESSION.teacherId);const isTeacherOwner=SESSION.role==='teacher'&&p.teacherId===SESSION.teacherId;const canMarkDone=isTeacherOwner;
  const rows=(p.items||[]).map((it,i)=>`<tr><td style="font-weight:800;color:var(--N);text-align:center">${it.week}</td><td><input type="date" value="${esc(it.date||'')}" onchange="planItem('${id}',${i},'date',this.value)" ${p.status==='approved'?'disabled':''} style="padding:5px;border:1.5px solid var(--bdr);border-radius:6px;font-family:inherit;font-size:11px"/></td><td><input value="${esc(it.title)}" onchange="planItem('${id}',${i},'title',this.value)" ${locked&&!isTeacherOwner?'disabled':(p.status==='approved'?'disabled':'')} placeholder="عنوان الدرس" style="width:100%;padding:6px 8px;border:1.5px solid var(--bdr);border-radius:6px;font-family:inherit;font-size:12px"/></td><td><input value="${esc(it.note||'')}" onchange="planItem('${id}',${i},'note',this.value)" ${p.status==='approved'?'disabled':''} placeholder="ملاحظات" style="width:100%;padding:6px 8px;border:1.5px solid var(--bdr);border-radius:6px;font-family:inherit;font-size:11px"/></td><td style="text-align:center"><input type="number" min="1" max="8" value="${+it.weeks||1}" onchange="planItem('${id}',${i},'weeks',this.value)" ${p.status==='approved'?'disabled':''} style="width:48px;text-align:center;padding:4px;border:1px solid var(--bdr);border-radius:6px"/></td><td style="text-align:center">${(+it.weeks||1)>1?`<div style="font-size:9px;color:var(--t3)">${it.prog||0}/${+it.weeks||1}</div>`:''}${canMarkDone?`<input type="checkbox" ${it.done?'checked':''} onchange="planDone('${id}',${i},this.checked)"/>`:(it.done?'✅':'—')}${it.done&&it.doneDate?`<div style="font-size:8px;color:var(--t3)">${esc(it.doneDate)}</div>`:''}</td></tr>`).join('');
  const pr=planProgress(p),st=PSTATUS[p.status];
  openM(`<div class="mbox wide"><div class="mhdr"><span class="mtitle">خطة المنهج — ${esc(subj(p.subId).name)} · فصل ${esc(cls(p.classId).name)} · ت${p.term}</span><button class="mcls" onclick="closeM()">✕</button></div><div class="mbody"><div style="display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap"><span class="badge ${st.c}">${st.l}</span><span class="badge bn">التنفيذ ${pr.dn}/${pr.t} (${pr.pct}%)</span>${p.approvedBy?`<span class="badge bg">اعتمدها: ${esc(p.approvedBy)}</span>`:''}${isTeacherOwner&&p.status!=='approved'?'<button class="btn bxsm bteal" style="margin-right:auto" onclick="planAddWeek(\''+id+'\')">+ أسبوع</button>':''}</div><div class="tbwrap" style="max-height:52vh;overflow:auto"><table><thead><tr><th style="width:50px">الأسبوع</th><th style="width:130px">التاريخ</th><th>عنوان الدرس</th><th style="width:60px">أسابيع</th><th>ملاحظات</th><th style="width:80px">نُفِّذ</th></tr></thead><tbody>${rows}</tbody></table></div>${p.status==='approved'&&isTeacherOwner?'<div class="info" style="margin-top:10px">الخطة معتمدة — لا يمكن تعديل العناوين إلا بعد طلب إذن من مدير المدرسة. يمكنك تحديد ما تم تنفيذه.</div>':''}</div><div class="mfoot"><button class="btn bout bsm" onclick="closeM()">إغلاق</button>${isTeacherOwner&&p.status==='draft'?`<button class="btn bpri bsm" onclick="planSubmit('${id}')">إرسال للاعتماد</button>`:''}${can('plansApprove')&&p.status==='submitted'?`<button class="btn bgreen bsm" onclick="planApprove('${id}')">✓ اعتماد الخطة</button>`:''}</div></div>`);}
function planItem(id,i,f,v){if(f==='weeks')v=Math.max(1,parseInt(v)||1);if(f==='date')v=normDate(v)||'';const p=S().plans.find(x=>x.id===id);if(!p)return;if(p.status==='approved'&&f==='title')return;p.items[i][f]=v;save();}
function planDone(id,i,v){const p=S().plans.find(x=>x.id===id);if(!p)return;p.items[i].done=v;p.items[i].doneDate=v?todayISO():'';save();planEditor(id);}
function planAddWeek(id){const p=S().plans.find(x=>x.id===id);p.items.push({week:(p.items.length?p.items[p.items.length-1].week+1:1),title:'',note:'',done:false,doneDate:''});save();planEditor(id);}
function planDel(id){confirmM('حذف هذه الخطة؟',()=>{S().plans=S().plans.filter(x=>x.id!==id);save();rePlans();toast('تم الحذف','e');});}
function planSubmit(id){const p=S().plans.find(x=>x.id===id);if(p)p._v=Date.now();if(!(p.items||[]).some(i=>i.title))return toast('اكتب عناوين الدروس أولاً','e');const _bad=(p.items||[]).filter(i=>i.title&&!i.date);if(_bad.length)return toast('⛔ لا يمكن الإرسال: '+_bad.length+' بند بدون تاريخ. أضِف تاريخاً لكل درس ليُوضَع تلقائياً فى الجدول.','e');p.status='submitted';notify({role:'admin',text:'📗 أرسل المعلم '+(tea(p.teacherId).name||'')+' خطة '+subj(p.subId).name+' للاعتماد'});logAct('إرسال خطة للاعتماد',subj(p.subId).name+' — فصل '+cls(p.classId).name);save();closeM();rePlans();toast('أُرسلت لاعتماد مدير المدرسة','s');}
function planRevoke(id){const p=S().plans.find(x=>x.id===id);if(!p)return;confirmM('إلغاء اعتماد هذه الخطة وإعادتها للمعلم للتعديل؟',()=>{p.status='draft';p.editReq=false;delete p.approvedBy;delete p.approvedAt;logAct('إلغاء اعتماد خطة',subj(p.subId).name+' — '+tea(p.teacherId).name);save();rePlans();toast('أُلغى الاعتماد','w');});}
function planApproveAll(){const s=S();const pend=(s.plans||[]).filter(p=>p.status==='draft'||p.status==='submitted');if(!pend.length)return toast('لا خطط معلّقة','w');confirmM('اعتماد كل الخطط المعلّقة ('+pend.length+')؟',()=>{pend.forEach(p=>{p.status='approved';p.editReq=false;p.approvedBy=SESSION.name;p.approvedAt=todayISO();notify({tea:p.teacherId,text:'✅ تم اعتماد خطتك: '+subj(p.subId).name});});logAct('اعتماد كل الخطط',pend.length+'');save();rePlans();toast('تم اعتماد '+pend.length+' خطة ✓','s');});}
function planApprove(id){const p=S().plans.find(x=>x.id===id);p.status='approved';p.editReq=false;p.approvedBy=SESSION.name;p.approvedAt=todayISO();notify({tea:p.teacherId,text:'✅ تم اعتماد خطتك: '+subj(p.subId).name+' — فصل '+cls(p.classId).name});logAct('اعتماد خطة منهج',subj(p.subId).name+' — '+tea(p.teacherId).name);save();closeM();rePlans();toast('تم اعتماد الخطة','s');}
function planReturn(id){const p=S().plans.find(x=>x.id===id);p.status='draft';logAct('إعادة خطة للتعديل',subj(p.subId).name);save();rePlans();toast('أُعيدت للمعلم للتعديل','w');}
function planRequestEdit(id){const p=S().plans.find(x=>x.id===id);p.editReq=true;logAct('طلب إذن تعديل خطة',subj(p.subId).name);save();rePlans();toast('أُرسل طلب التعديل لمدير المدرسة','s');}
function planGrantEdit(id){const p=S().plans.find(x=>x.id===id);p.status='draft';p.editReq=false;logAct('السماح بتعديل خطة',subj(p.subId).name+' — '+tea(p.teacherId).name);save();rePlans();toast('سُمح للمعلم بالتعديل','s');}

/* ============================================================
   PHASE 2 — QUALITY / COMPLIANCE
   ============================================================ */
var qF={teaId:'',classId:'',term:''};
function weekEndDate(s,w){const y=new Date(s.cfg.yearStart+'T00:00');return new Date(y.getTime()+((w-1)*7+6)*864e5);}
function compliance(s,f){let planned=0,done=0,due=0,doneDue=0,onTime=0,thisW=0,thisWDone=0,monW=0,monWDone=0;const cw=curWeek(s);const now=new Date();
  const rows=[];
  (s.plans||[]).filter(p=>p.status==='approved').forEach(p=>{if(f.teaId&&p.teacherId!==f.teaId)return;if(f.classId&&p.classId!==f.classId)return;if(f.term&&+p.term!==+f.term)return;
    let pt=0,pd=0,pdue=0,pdd=0;
    (p.items||[]).forEach(it=>{if(!it.title)return;planned++;pt++;const we=it.date?new Date(it.date+'T23:59'):weekEndDate(s,it.week);const isDue=we<=now;if(isDue){due++;pdue++;}const frac=it.done?1:((+it.weeks||1)>1?Math.min(1,(+it.prog||0)/(+it.weeks||1)):0);if(frac>0){done+=frac;pd+=frac;if(isDue){doneDue+=frac;pdd+=frac;}if(it.done&&it.doneDate&&new Date(it.doneDate+'T00:00')<=we)onTime++;}
      if(it.week===cw){thisW++;if(it.done)thisWDone++;}if(it.week>cw-4&&it.week<=cw){monW++;if(it.done)monWDone++;}});
    rows.push({p,pt,pd,pdue,pdd,pct:pt?Math.round(pd/pt*100):0,commit:pdue?Math.round(pdd/pdue*100):0});});
  return{planned,done,due,doneDue,onTime,commit:due?Math.round(doneDue/due*100):0,ontimePct:done?Math.round(onTime/done*100):0,cw,thisW,thisWDone,monW,monWDone,rows};}
function setQF(k,v){qF[k]=v;renderQuality(reC());}
function renderQuality(c){if(!can('quality')){c.innerHTML='<div class="empty"><div class="empty-ic">🔒</div><div class="empty-t">لمسؤول الجودة ومدير المدرسة ومدير إدارة الجدول</div></div>';return;}
  const s=S();const cm=compliance(s,qF);
  const teaOpts=`<option value="">كل المعلمين</option>`+s.teachers.map(t=>`<option value="${t.id}" ${qF.teaId===t.id?'selected':''}>${esc(t.name)}</option>`).join('');
  const clsOpts=`<option value="">كل الفصول</option>`+s.classes.map(x=>`<option value="${x.id}" ${qF.classId===x.id?'selected':''}>فصل ${esc(x.name)}</option>`).join('');
  const rows=cm.rows.map(R=>`<tr><td>${esc(tea(R.p.teacherId).name||'')}</td><td>${esc(grade(cls(R.p.classId).gradeId).name)}/${esc(cls(R.p.classId).name)}</td><td><span class="colordot" style="background:${subj(R.p.subId).color}"></span>${esc(subj(R.p.subId).name)}</td><td style="text-align:center">ت${R.p.term}</td><td style="text-align:center">${R.pt}</td><td style="text-align:center">${R.pd}</td><td style="text-align:center">${R.pdue}</td><td style="min-width:120px"><div class="sbar"><span style="width:${R.commit}%;background:${R.commit>=80?'#1D9E75':R.commit>=50?'#D97706':'#DC2626'}"></span></div><div style="font-size:9px;color:var(--t3);margin-top:2px">${R.commit}% التزام</div></td></tr>`).join('');
  c.innerHTML=`<div class="pghdr"><div><div class="pgtitle">🧭 الالتزام بالخطط الدراسية</div><div class="pgsub">مطابقة ما نُفِّذ فعلياً فى الجدول مع خطة المعلم المعتمدة — ${esc(schoolName(ACTIVE))}</div></div><button class="btn bout bsm" onclick="printQuality()">🖨️ PDF</button></div>${schoolBar('quality')}
    <div class="mets"><div class="met ${cm.commit>=80?'green':cm.commit>=50?'amber':'red'}"><div class="mic">🎯</div><div class="mlbl">الالتزام العام (حتى الآن)</div><div class="mval">${cm.due?cm.commit+'%':'—'}</div><div class="msub">${cm.doneDue}/${cm.due} بند مستحق</div></div>
      <div class="met teal"><div class="mic">📅</div><div class="mlbl">الأسبوع ${cm.cw>0?cm.cw:'—'}</div><div class="mval">${cm.thisW?Math.round(cm.thisWDone/cm.thisW*100):0}%</div><div class="msub">${cm.thisWDone}/${cm.thisW} هذا الأسبوع</div></div>
      <div class="met purple"><div class="mic">📆</div><div class="mlbl">آخر ٤ أسابيع</div><div class="mval">${cm.monW?Math.round(cm.monWDone/cm.monW*100):0}%</div><div class="msub">${cm.monWDone}/${cm.monW}</div></div>
      <div class="met"><div class="mic">⏱️</div><div class="mlbl">الالتزام بالتوقيت</div><div class="mval">${cm.ontimePct}%</div><div class="msub">${cm.done} بند مُنفّذ</div></div></div>
    <div class="filterbar"><div class="fg"><label>المعلم</label><select onchange="setQF('teaId',this.value)">${teaOpts}</select></div><div class="fg"><label>الفصل</label><select onchange="setQF('classId',this.value)">${clsOpts}</select></div><div class="fg"><label>الترم</label><select onchange="setQF('term',this.value)"><option value="">الكل</option><option value="1" ${qF.term==='1'?'selected':''}>الأول</option><option value="2" ${qF.term==='2'?'selected':''}>الثانى</option></select></div></div>

function pickFile(cb){const inp=document.createElement('input');inp.type='file';inp.accept='.csv,.xlsx,text/csv';inp.onchange=()=>{const f=inp.files&&inp.files[0];if(!f)return;const name=(f.name||'').toLowerCase();
  if(name.endsWith('.xlsx')){loadSheetJS().then(()=>{const rd=new FileReader();rd.onload=()=>{try{const wb=XLSX.read(new Uint8Array(rd.result),{type:'array'});const ws=wb.Sheets[wb.SheetNames[0]];cb(XLSX.utils.sheet_to_csv(ws),f.name);}catch(e){toast('تعذّر قراءة ملف Excel — احفظه بصيغة CSV وأعد المحاولة','e');}};rd.readAsArrayBuffer(f);}).catch(()=>toast('تعذّر تحميل قارئ Excel (تحقق من الإنترنت) — استخدم CSV','e'));}
  else{const rd=new FileReader();rd.onload=()=>cb(rd.result,f.name);rd.readAsText(f,'utf-8');}};inp.click();}
function loadSheetJS(){return new Promise((res,rej)=>{if(typeof XLSX!=='undefined')return res();const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';sc.onload=()=>res();sc.onerror=()=>rej();document.head.appendChild(sc);});}
function dlData(uri,filename){const a=document.createElement('a');a.href=uri;a.download=filename;document.body.appendChild(a);a.click();a.remove();}
function parseCSV(text){text=String(text).replace(/^\uFEFF/,'');const rows=[];let i=0,field='',row=[],inQ=false;while(i<text.length){const ch=text[i];if(inQ){if(ch==='"'){if(text[i+1]==='"'){field+='"';i+=2;continue;}inQ=false;i++;continue;}field+=ch;i++;continue;}if(ch==='"'){inQ=true;i++;continue;}if(ch===','){row.push(field);field='';i++;continue;}if(ch==='\n'){row.push(field);rows.push(row);row=[];field='';i++;continue;}if(ch==='\r'){i++;continue;}field+=ch;i++;}if(field.length||row.length){row.push(field);rows.push(row);}return rows.filter(r=>r.some(c=>String(c).trim()!==''));}

function importOpPlan(){pickFile((txt)=>{const rows=parseCSV(txt);if(rows.length<2)return toast('الملف فارغ','e');const s=S();
  let weekend=[],holidays=[],terms=[],exams=[];

function normDate(v){if(v==null)return '';v=String(v).trim();if(!v)return '';if(/^\d{4}-\d{2}-\d{2}$/.test(v))return v;if(/^\d{4,6}$/.test(v)){const n=+v;if(n>20000&&n<80000){const d=new Date(Date.UTC(1899,11,30)+n*86400000);return d.toISOString().slice(0,10);}}let m=v.match(/^(\d{1,4})[\/\-.](\d{1,2})[\/\-.](\d{1,4})$/);if(m){let y,mo,da;if(m[1].length===4){y=+m[1];mo=+m[2];da=+m[3];}else if(m[3].length===4){da=+m[1];mo=+m[2];y=+m[3];}else{da=+m[1];mo=+m[2];y=(+m[3])<100?2000+(+m[3]):+m[3];}if(mo>12&&da<=12){const t=mo;mo=da;da=t;}if(y&&mo>=1&&mo<=12&&da>=1&&da<=31)return y+'-'+String(mo).padStart(2,'0')+'-'+String(da).padStart(2,'0');}const dt=new Date(v);if(!isNaN(dt.getTime()))return dt.toISOString().slice(0,10);return '';}

function qEvalHTML(ev){const tpl=qTpl(ev.type);const _dt=ev.ts?new Date(ev.ts):(ev.date?new Date(ev.date):new Date());

async function qAutoDrive(id){try{const ev=S().quality.evals.find(e=>e.id===id);if(!ev)return;const cf=cloudCfg();const g=cf.gs||{};if(!g.url){if(typeof logProblem==='function')logProblem('جودة','رابط Apps Script غير مضبوط — لم تُرفع نسخة Drive');return;}const filename=((qTpl(ev.type).name)+' - '+(ev.teacherName||ev.placeName||'')+' - '+(ev.date||'')).replace(/[\\/:*?"<>|]/g,'-');const r=await fetch(g.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'quality_report',filename:filename,subfolder:(qTpl(ev.type).name||'تقارير الجودة'),html:qEvalHTML(ev)})});const t=await r.text();if(/^https?:/.test((t||'').trim())){ev.driveUrl=t.trim();try{save();}catch(e){}}toast('☁️ حُفظ التقرير فى Drive','s');}catch(e){if(typeof logProblem==='function')logProblem('جودة','فشل رفع Drive: '+e.message);}}

function qSaveRecips(t){const el=document.getElementById('q-def-recips');if(!el)return;S().quality.recipients[t]=[...el.selectedOptions].map(o=>o.value);save();toast('تم حفظ المعنيين','s');}
function qToggleEvaluator(t,r,on){const ev=S().quality.evaluators;ev[t]=ev[t]||[];const i=ev[t].indexOf(r);if(on&&i<0)ev[t].push(r);if(!on&&i>=0)ev[t].splice(i,1);save();}
function qSetScale(t,v){S().quality.templates[t].scaleMax=Math.max(3,Math.min(10,parseInt(v)||5));save();reQ();}
function qEditAxis(ai,f,v){const ax=qT().axes[ai];ax[f]=(f==='weight')?(parseFloat(v)||0):v;save();}
function qDelAxis(ai){confirmM('حذف المحور وكل معاييره؟',()=>{qT().axes.splice(ai,1);save();reQ();});}
function qAddAxis(){qT().axes.push({id:uid('ax'),name:'محور جديد',weight:0,criteria:[]});save();reQ();}
function qEditCrit(ai,ci,v){qT().axes[ai].criteria[ci].name=v;save();}
function qDelCrit(ai,ci){confirmM('حذف المعيار؟',()=>{qT().axes[ai].criteria.splice(ci,1);save();reQ();});}
function qAddCrit(ai){qT().axes[ai].criteria.push({id:uid('c'),name:'معيار جديد',inds:[]});save();reQ();}
function qEditInd(ai,ci,ii,f,v){qT().axes[ai].criteria[ci].inds[ii][f]=v;save();}
function qDelInd(ai,ci,ii){qT().axes[ai].criteria[ci].inds.splice(ii,1);save();reQ();}
var QSUGG=['يوظّف استراتيجيات تدريس متنوّعة تناسب الأهداف','يراعى الفروق الفردية بين المتعلمين','يستخدم التقنية والوسائط الرقمية بفاعلية','يطرح أسئلة تحفّز التفكير العليا','يدير وقت الحصة بكفاءة','يوفّر تغذية راجعة فورية وبنّاءة','يربط المحتوى بالحياة العملية وسوق العمل','يهيّئ بيئة صفية آمنة ومحفّزة','يستخدم أساليب تقويم متنوّعة (تكوينى/ختامى)','يشجّع التعلّم التعاونى والعمل الجماعى','يلتزم بخطة المنهج والتوزيع الزمنى','يحقّق نواتج التعلّم المستهدفة','ينمّى مهارات القرن الحادى والعشرين','يوثّق أعمال الطلاب وتقدّمهم','يطبّق معايير السلامة والصحة المهنية','يعزّز القيم والانضباط السلوكى'];
function qSuggPick(ai,ci){const items=QSUGG.map((t,i)=>`<label style="display:flex;gap:8px;align-items:center;padding:6px;border-bottom:1px solid var(--bdr);font-size:13px"><input type="checkbox" class="qsug" value="${i}"/> ${esc(t)}</label>`).join('');openM(`<div class="mbox"><div class="mhdr teal"><span class="mtitle">➕ مؤشرات مقترحة</span><button class="mcls" onclick="closeM()">✕</button></div><div class="mbody"><div class="info" style="margin-bottom:8px">اختر المؤشرات لإضافتها للمعيار:</div>${items}</div><div class="mfoot"><button class="btn bout bsm" onclick="closeM()">إلغاء</button><button class="btn bteal bsm" onclick="qSuggAdd(${ai},${ci})">إضافة المحدد</button></div></div>`);}
function qSuggAdd(ai,ci){const sel=[...document.querySelectorAll('.qsug:checked')].map(x=>+x.value);if(!sel.length)return toast('لم تحدد','w');const cr=qT().axes[ai].criteria[ci];sel.forEach(i=>cr.inds.push({code:'',text:QSUGG[i]}));save();closeM();reQ();toast('تم إضافة '+sel.length+' مؤشر','s');}
function qAddInd(ai,ci){qT().axes[ai].criteria[ci].inds.push({code:'',text:'مؤشر جديد'});save();reQ();}

/* ============================================================
   PHASE 6 — ASSESSMENT & EXAMS (التقييم والامتحانات)
   ============================================================ */
const ATERMS=[['t1','الفصل الدراسى الأول'],['t2','الفصل الدراسى الثانى']];
const ATYPES=[['monthly','شهرى (تكوينى)'],['mid','نصف العام'],['final','آخر العام']];
var aTab='dashboard',aClass='',aTerm='t1',aType='mid',aMode='grade';
function aCanUse(){return ['manager','principal','assessment'].indexOf(SESSION.role)>=0;}
function aSubCfg(id){const c=S().assess.subjects;if(!c[id])c[id]={hasExam:true,max:100,practical:false,practicalMax:0};return c[id];}
function aRatingFor(pct){const rs=(S().assess.ratings||[]).slice().sort((a,b)=>b.min-a.min);for(const r of rs)if(pct>=r.min)return r;return {code:'-',label:'—'};}
function aStudents(classId){const s=S();return (s.students&&s.students[classId]&&s.students[classId].length)?s.students[classId]:(s.assess.students[classId]||[]);}
function aMarks(){const k=aTerm+'|'+aType;const m=S().assess.marks;m[k]=m[k]||{};return m[k];}
function aCell(classId,stuId,subId){const m=aMarks();m[classId]=m[classId]||{};m[classId][stuId]=m[classId][stuId]||{};m[classId][stuId][subId]=m[classId][stuId][subId]||{};return m[classId][stuId][subId];}
function aExamSubjects(gradeId){return subjectsOfGrade(gradeId).filter(sb=>aSubCfg(sb.id).hasExam);}
function aStudentTotal(classId,stuId,gradeId){let tot=0,max=0;aExamSubjects(gradeId).forEach(sb=>{const cf=aSubCfg(sb.id);const c=aCell(classId,stuId,sb.id);const d=(+c.d||0)+(cf.practical?(+c.dp||0):0);tot+=d;max+=(+cf.max||0)+(cf.practical?(+cf.practicalMax||0):0);});const pct=max?Math.round(tot/max*1000)/10:0;return {tot:Math.round(tot*10)/10,max,pct};}
function reA(){renderAssess(reC());}
function renderAssess(c){if(!aCanUse()){c.innerHTML='<div class="empty"><div class="empty-ic">🔒</div><div class="empty-t">لمسؤول التقييم والامتحانات ومدير المدرسة وإدارة الجدول</div></div>';return;}
  const s=S();if(!aClass&&s.classes[0])aClass=s.classes[0].id;
  const tabs=[['entry','✍️ إدخال الدرجات'],['formative','📅 أعمال السنة الشهرى'],['roster','👥 الطلاب'],['subjects','⚙️ إعدادات المواد'],['dashboard','📊 داش بورد'],['reports','🗂️ التقارير'],['import','📥 استيراد كشف']];
  const tabsHtml=`<div class="tabs">${tabs.map(t=>`<div class="tab ${aTab===t[0]?'on':''}" onclick="aTab='${t[0]}';reA()">${t[1]}</div>`).join('')}</div>`;
  const body={entry:aEntry,formative:aFormView,roster:aRoster,subjects:aSubjects,dashboard:aDash,reports:aReports,import:aImportView}[aTab]();
  c.innerHTML=`<div class="pghdr"><div><div class="pgtitle">📝 التقييم والامتحانات</div><div class="pgsub">${esc(schoolName(ACTIVE))}</div></div></div>${schoolBar('assess')}${tabsHtml}${body}`;
}
function aPickers(){const s=S();return `<div class="filterbar"><div class="fg"><label>الفصل</label><select onchange="aClass=this.value;reA()">${s.classes.map(cl=>`<option value="${cl.id}" ${aClass===cl.id?'selected':''}>الصف ${esc(grade(cl.gradeId).name)} · فصل ${esc(cl.name)}</option>`).join('')}</select></div><div class="fg"><label>الفصل الدراسى</label><select onchange="aTerm=this.value;reA()">${ATERMS.map(t=>`<option value="${t[0]}" ${aTerm===t[0]?'selected':''}>${t[1]}</option>`).join('')}</select></div><div class="fg"><label>نوع الامتحان</label><select onchange="aType=this.value;reA()">${ATYPES.map(t=>`<option value="${t[0]}" ${aType===t[0]?'selected':''}>${t[1]}</option>`).join('')}</select></div></div>`;}
function aEntry(){const s=S();const cl=cls(aClass);if(!cl.id)return aPickers()+'<div class="empty"><div class="empty-t">أضف فصولاً أولاً</div></div>';const subs=aExamSubjects(cl.gradeId);const studs=aStudents(aClass);
  const modeBtns=`<div class="segbtns"><button class="${aMode==='grade'?'on':''}" onclick="aMode='grade';reA()">إدخال بالدرجة</button><button class="${aMode==='rating'?'on':''}" onclick="aMode='rating';reA()">إدخال بالتقدير</button></div>`;
  if(!studs.length)return aPickers()+'<div class="card"><div class="info">لا طلاب فى هذا الفصل — أضِفهم من تبويب «الطلاب» أو «استيراد كشف».</div></div>';
  if(!subs.length)return aPickers()+'<div class="card"><div class="info">لا مواد امتحانية لهذا الصف — فعّلها من «إعدادات المواد».</div></div>';
  const head='<tr><th class="tt-daycol" style="min-width:150px">الطالب</th>'+subs.map(sb=>{const cf=aSubCfg(sb.id);return `<th>${esc(sb.name)}<br><span style="font-size:8px">${aMode==='grade'?('/'+cf.max+(cf.practical?(' +ع'+cf.practicalMax):'')):'تقدير'}</span></th>`;}).join('')+'<th>المجموع</th><th>%</th><th>التقدير</th></tr>';
  const rows=studs.map(st=>{const tds=subs.map(sb=>{const cf=aSubCfg(sb.id);const c=aCell(aClass,st.id,sb.id);if(aMode==='grade'){return `<td style="text-align:center"><input type="number" min="0" max="${cf.max}" value="${c.d!=null?c.d:''}" onchange="aSet('${st.id}','${sb.id}','d',this.value)" style="width:52px;text-align:center;padding:4px;border:1px solid var(--bdr);border-radius:6px"/>${cf.practical?`<br><input type="number" min="0" max="${cf.practicalMax}" placeholder="ع" value="${c.dp!=null?c.dp:''}" onchange="aSet('${st.id}','${sb.id}','dp',this.value)" style="width:52px;text-align:center;padding:4px;border:1px solid var(--bdr);border-radius:6px;margin-top:3px"/>`:''}</td>`;}else{return `<td style="text-align:center"><select onchange="aSet('${st.id}','${sb.id}','r',this.value)" class="btn bout bxsm"><option value="">—</option>${(s.assess.ratings||[]).map(r=>`<option value="${r.code}" ${c.r===r.code?'selected':''}>${r.code} - ${esc(r.label)}</option>`).join('')}</select></td>`;}}).join('');const tt=aStudentTotal(aClass,st.id,cl.gradeId);const rt=aRatingFor(tt.pct);return `<tr><td class="tt-daycol">${esc(st.seat?('['+st.seat+'] '):'')}${esc(st.name)}</td>${tds}<td style="text-align:center;font-weight:800">${aMode==='grade'?tt.tot:'—'}</td><td style="text-align:center">${aMode==='grade'?tt.pct+'%':'—'}</td><td style="text-align:center">${aMode==='grade'?`<span class="badge ${tt.pct>=80?'bg':tt.pct>=50?'ba':'br'}">${rt.code}</span>`:'—'}</td></tr>`;}).join('');
  return aPickers()+aPublishBar()+aApprovalLogCard()+`<div class="card"><div class="chdr"><div class="ctitle">✍️ إدخال درجات ${esc(cl.name)} — ${ATYPES.find(t=>t[0]===aType)[1]}</div>${modeBtns}</div><div class="info" style="margin:8px 0">تُحفظ الدرجات تلقائياً. المجموع والنسبة والتقدير يُحسبان فورياً (وضع الدرجة). «ع» = درجة الجزء العملى.</div><div class="ttwrap"><table>${head}${rows}</table></div></div>`;
}
function aSet(stuId,subId,field,val){const c=aCell(aClass,stuId,subId);if(field==='r')c.r=val;else c[field]=(val===''?null:(parseFloat(val)||0));logAct('إدخال درجة','');save();if(aMode==='grade'&&field!=='r')reA();}
function aRoster(){const s=S();const cl=cls(aClass);const studs=aStudents(aClass);
  studs.forEach(ensureStudentCode);const rows=studs.map((st,i)=>`<tr><td style="text-align:center">${st.seat||(i+1)}</td><td><b>${esc(st.name)}</b></td><td style="text-align:center"><span class="badge bn">${esc(st.code||'')}</span></td><td style="white-space:nowrap"><button class="btn bxsm bteal" onclick="aCertificate('${aClass}','${st.id}')">🖨️ شهادة</button><button class="btn bxsm bout" onclick="aEditStu('${st.id}')">تعديل</button><button class="btn bxsm bred" onclick="aDelStu('${st.id}')">حذف</button></td></tr>`).join('');
  return `<div class="filterbar"><div class="fg grow"><label>الفصل</label><select onchange="aClass=this.value;reA()">${s.classes.map(c=>`<option value="${c.id}" ${aClass===c.id?'selected':''}>الصف ${esc(grade(c.gradeId).name)} · فصل ${esc(c.name)}</option>`).join('')}</select></div></div>
    <div class="card"><div class="chdr"><div class="ctitle">👥 طلاب فصل ${esc(cl.name)} (${studs.length})</div><div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn bout bsm" onclick="aCertAll()">🖨️ شهادات الفصل</button><button class="btn bout bsm" onclick="aCertGrade()">📚 شهادات الصف</button><button class="btn bpri bsm" onclick="aCertSchool()">🏫 شهادات كل المدرسة</button><button class="btn bout bsm" onclick="aCodesExport()">⬇️ أكواد الطلاب (Excel)</button><button class="btn bteal bsm" onclick="aEditStu()">+ إضافة طالب</button></div></div><div class="tbwrap"><table><thead><tr><th style="width:80px">رقم الجلوس</th><th>الاسم</th><th style="width:90px">كود الدخول</th><th></th></tr></thead><tbody>${rows||'<tr><td colspan=4><div class="empty"><div class="empty-t">لا طلاب — أضِف أو استورد كشفاً</div></div></td></tr>'}</tbody></table></div></div>`;
}
function aEditStu(id){const s=S();const st=id?aStudents(aClass).find(x=>x.id===id):{seat:'',name:''};openM(`<div class="mbox"><div class="mhdr teal"><span class="mtitle">${id?'تعديل طالب':'إضافة طالب'}</span><button class="mcls" onclick="closeM()">✕</button></div><div class="mbody"><div class="fgrid"><div class="fm"><label>رقم الجلوس</label><input id="st-seat" value="${esc(st.seat||'')}"/></div><div class="fm"><label>اسم الطالب *</label><input id="st-name" value="${esc(st.name||'')}"/></div></div></div><div class="mfoot"><button class="btn bout bsm" onclick="closeM()">إلغاء</button><button class="btn bteal bsm" onclick="aSaveStu('${id||''}')">حفظ</button></div></div>`);}
function aSaveStu(id){const s=S();const seat=document.getElementById('st-seat').value.trim(),name=document.getElementById('st-name').value.trim();if(!name)return toast('الاسم مطلوب','e');s.assess.students[aClass]=s.assess.students[aClass]||[];if(id){const st=s.assess.students[aClass].find(x=>x.id===id);Object.assign(st,{seat,name});}else{s.assess.students[aClass].push({id:uid('st'),seat,name,code:nextStudentCode()});}save();closeM();reA();toast('تم الحفظ','s');}
function aDelStu(id){confirmM('حذف الطالب وكل درجاته؟',()=>{const s=S();s.assess.students[aClass]=aStudents(aClass).filter(x=>x.id!==id);Object.keys(s.assess.marks).forEach(k=>{if(s.assess.marks[k][aClass])delete s.assess.marks[k][aClass][id];});save();reA();toast('تم الحذف','e');});}
function aSubjects(){const s=S();const rows=s.cfg.grades.map(g=>subjectsOfGrade(g.id).map((sb,i)=>{const cf=aSubCfg(sb.id);return `<tr>${i===0?`<td rowspan="${subjectsOfGrade(g.id).length}" style="background:var(--Rl);font-weight:800;color:var(--Rd);vertical-align:middle">الصف ${esc(g.name)}</td>`:''}<td><span class="colordot" style="background:${sb.color}"></span>${esc(sb.name)}</td><td style="text-align:center"><input type="checkbox" ${cf.hasExam?'checked':''} onchange="aSubSet('${sb.id}','hasExam',this.checked)"/></td><td style="text-align:center"><input type="number" min="0" value="${cf.max}" onchange="aSubSet('${sb.id}','max',this.value)" style="width:64px;text-align:center;padding:4px;border:1px solid var(--bdr);border-radius:6px"/></td><td style="text-align:center"><input type="checkbox" ${cf.practical?'checked':''} onchange="aSubSet('${sb.id}','practical',this.checked)"/></td><td style="text-align:center"><input type="number" min="0" value="${cf.practicalMax}" onchange="aSubSet('${sb.id}','practicalMax',this.value)" style="width:64px;text-align:center;padding:4px;border:1px solid var(--bdr);border-radius:6px" ${cf.practical?'':'disabled'}/></td></tr>`;}).join('')).join('');
  const rr=(s.assess.ratings||[]).map((r,i)=>`<div class="prow"><input value="${esc(r.code)}" onchange="aRateSet(${i},'code',this.value)" style="width:60px"/><input value="${esc(r.label)}" onchange="aRateSet(${i},'label',this.value)" style="flex:1"/><span style="font-size:11px">≥</span><input type="number" value="${r.min}" onchange="aRateSet(${i},'min',this.value)" style="width:70px"/><span style="font-size:11px">%</span><button class="iconbtn del" onclick="aRateDel(${i})">🗑</button></div>`).join('');
  return `<div class="card"><div class="chdr"><div class="ctitle">⚙️ إعدادات المواد (هل لها امتحان؟ النهاية العظمى؟ نظرى/عملى؟)</div></div><div class="info" style="margin-bottom:8px">فعّل «امتحان» للمواد التى لها درجات. فعّل «عملى» للمواد ذات جزء عملى وحدد نهايته.</div><div class="tbwrap"><table><thead><tr><th>الصف</th><th>المادة</th><th>امتحان؟</th><th>النهاية العظمى</th><th>عملى؟</th><th>نهاية العملى</th></tr></thead><tbody>${rows}</tbody></table></div></div>
    <div class="card"><div class="chdr"><div class="ctitle">🏷️ سلّم التقديرات (حسب النسبة %)</div><button class="btn bteal bsm" onclick="aRateAdd()">+ تقدير</button></div><div class="fm" style="max-width:240px;margin-bottom:10px"><label>درجة النجاح (%)</label><input type="number" value="${s.assess.passPct}" onchange="aSetPass(this.value)"/></div>${rr}</div>`;
}
function aSubSet(id,f,v){const cf=aSubCfg(id);if(f==='hasExam'||f==='practical')cf[f]=!!v;else cf[f]=parseFloat(v)||0;save();reA();}
function aRateSet(i,f,v){const r=S().assess.ratings[i];r[f]=(f==='min')?(parseFloat(v)||0):v;save();}
function aRateDel(i){S().assess.ratings.splice(i,1);save();reA();}
function aRateAdd(){S().assess.ratings.push({code:'N',label:'تقدير',min:0});save();reA();}
function aSetPass(v){S().assess.passPct=parseFloat(v)||50;save();}
var arF={scope:'class'},arMode='summary',arStu='',arSub='';
function aLogosSetting(){const keys=[['moe','وزارة التربية والتعليم'],['at','التكنولوجيا التطبيقية'],['ntss','NTSS'],['ebda','EBDA EDU']];return `<div class="card"><div class="chdr"><div class="ctitle">🖼️ شعارات الشهادة (يمين: الوزارة + التكنولوجيا التطبيقية · يسار: NTSS + EBDA)</div></div><div style="display:flex;gap:14px;flex-wrap:wrap">${keys.map(k=>`<div style="text-align:center"><div style="height:52px;display:flex;align-items:center;justify-content:center">${logoData(k[0])?`<img src="${logoData(k[0])}" style="height:46px">`:'<span class="badge bn">افتراضى</span>'}</div><div style="font-size:10px;color:var(--t3);margin:3px 0">${esc(k[1])}</div><button class="btn bxsm bteal" onclick="aSetLogo('${k[0]}')">تغيير</button> <button class="btn bxsm bout" onclick="aResetLogo('${k[0]}')">افتراضى</button></div>`).join('')}</div><div class="info" style="margin-top:8px">الشعارات تُثبّت وتظهر أعلى الشهادة والتقارير، وتُزامَن لكل الأجهزة.</div></div>`;}
function aReports(){const s=S();const cl=cls(aClass);const subs=aExamSubjects(cl.gradeId);const studs=aStudents(aClass);
  const modeBtns=`<div class="filterbar"><div class="fg"><label>نوع التقرير</label><div class="segbtns"><button class="${arMode==='summary'?'on':''}" onclick="arMode='summary';reA()">ملخّص الفصل</button><button class="${arMode==='student'?'on':''}" onclick="arMode='student';reA()">بالطالب</button><button class="${arMode==='subject'?'on':''}" onclick="arMode='subject';reA()">بمادة</button></div></div>${arMode==='student'?`<div class="fg grow"><label>الطالب</label><select onchange="arStu=this.value;reA()"><option value="">— اختر —</option>${studs.map(st=>`<option value="${st.id}" ${arStu===st.id?'selected':''}>${esc(st.seat?('['+st.seat+'] '):'')}${esc(st.name)}</option>`).join('')}</select></div>`:''}${arMode==='subject'?`<div class="fg grow"><label>المادة</label><select onchange="arSub=this.value;reA()"><option value="">— اختر —</option>${subs.map(sb=>`<option value="${sb.id}" ${arSub===sb.id?'selected':''}>${esc(sb.name)}</option>`).join('')}</select></div>`:''}</div>`;

function aImport(){const cl=cls(aClass);if(!cl.id)return toast('اختر فصلاً','e');pickFile((txt)=>{const rows=parseCSV(txt);if(rows.length<2)return toast('الملف فارغ','e');const H=rows[0].map(x=>x.trim());const F=k=>{for(let i=0;i<H.length;i++)if(k.some(x=>H[i].indexOf(x)>=0))return i;return -1;};let ci=F(['جلوس','seat']),ni=F(['اسم','name']),mi=F(['مادة','subject']),gi=F(['درجة','grade','mark']),ri=F(['تقدير','rating']);if(ni<0||mi<0){ci=0;ni=1;mi=2;gi=3;ri=4;}
  const s=S();s.assess.students[aClass]=s.assess.students[aClass]||[];let nStu=0,nMark=0,skip=0;

function nextStudentCode(){const used=new Set();Object.keys(DB.data||{}).forEach(sc=>{const sd=DB.data[sc];Object.values((sd.students||{})).forEach(arr=>arr.forEach(st=>{if(st.code)used.add(String(st.code));}));Object.values((sd.assess&&sd.assess.students)||{}).forEach(arr=>arr.forEach(st=>{if(st.code)used.add(String(st.code));}));});DB.users.forEach(u=>{if(u.username)used.add(String(u.username));});let n=1001;while(used.has(String(n)))n++;return String(n);}
function ensureStudentCode(st){if(!st.code)st.code=nextStudentCode();return st.code;}
function findStudentByCode(code){code=String(code||'').trim();if(!code)return null;
  // 1) main Student DB across ALL schools — code is the universal login
  for(const scid of Object.keys(DB.data||{})){const sd=DB.data[scid];const ss=sd.students||{};for(const cid of Object.keys(ss)){for(const st of (ss[cid]||[])){if(String(st.code||'')===code||String(st.seat||'')===code)return{schoolId:scid,classId:cid,st};}}}
  // 2) fallback: assessment rosters
  for(const scid of Object.keys(DB.data||{})){const sd=DB.data[scid];const ss=(sd.assess&&sd.assess.students)||{};for(const cid of Object.keys(ss)){for(const st of (ss[cid]||[])){if(String(st.code||'')===code||String(st.seat||'')===code)return{schoolId:scid,classId:cid,st};}}}
  return null;}
function aImportWide(){const cl=cls(aClass);if(!cl.id)return toast('اختر فصلاً','e');pickFile((txt)=>{const rows=parseCSV(txt);if(rows.length<3)return toast('الملف قصير','e');const s=S();
  let hr=-1;for(let i=0;i<Math.min(rows.length,6);i++){if(rows[i].some(x=>String(x).indexOf('اسم')>=0)){hr=i;break;}}if(hr<0)hr=0;
  const H=rows[hr].map(x=>String(x||'').trim());let seatC=H.findIndex(x=>x.indexOf('جلوس')>=0);let nameC=H.findIndex(x=>x.indexOf('اسم')>=0);if(nameC<0)nameC=1;if(seatC<0)seatC=0;
  const subjMap=[];for(let c=Math.max(seatC,nameC)+1;c<H.length;c++){const h=H[c];if(!h)continue;if(/مجموع|نسبة|الدرجة الكلية|ترتيب|^تقدير$/.test(h))continue;let sb=subjectsOfGrade(cl.gradeId).find(x=>x.name===h)||s.subjects.find(x=>x.name===h&&x.gradeId===cl.gradeId);if(!sb){const r=tGetSubject(h,cl.gradeId);sb=subj(r.id);}if(sb&&!subjMap.some(m=>m.sb.id===sb.id))subjMap.push({c,sb,rc:c+1});}
  if(!subjMap.length)return toast('لم يتم التعرّف على أعمدة المواد','e');
  let maxRow=null;for(let k=hr+1;k<=hr+3&&k<rows.length;k++){if(!isNaN(parseFloat(rows[k][subjMap[0].c]))&&String(rows[k][nameC]||'').trim()===''){maxRow=rows[k];break;}}
  if(maxRow)subjMap.forEach(m=>{const mv=parseFloat(maxRow[m.c]);if(!isNaN(mv)&&mv>0)aSubCfg(m.sb.id).max=mv;});subjMap.forEach(m=>aSubCfg(m.sb.id).hasExam=true);
  s.assess.students[aClass]=s.assess.students[aClass]||[];let nStu=0,nMark=0;
  for(let i=hr+1;i<rows.length;i++){const r=rows[i];const name=String(r[nameC]||'').trim();if(!name||name==='تقدير'||/^\d+(\.\d+)?$/.test(name))continue;const seat=String(r[seatC]||'').trim();let st=s.assess.students[aClass].find(x=>x.name===name||(seat&&x.seat===seat));if(!st){st={id:uid('st'),seat,name};s.assess.students[aClass].push(st);nStu++;}ensureStudentCode(st);
    subjMap.forEach(m=>{const g=String(r[m.c]||'').trim();const rr=String(r[m.rc]||'').trim();const c=aCell(aClass,st.id,m.sb.id);if(g!==''&&!isNaN(parseFloat(g))){c.d=parseFloat(g);nMark++;}if(rr&&rr!=='تقدير')c.r=rr;});}
  logAct('استيراد كشف عريض',cl.name+' — '+nStu+' طالب');save();toast('تم الاستيراد العريض ✓ '+nStu+' طالب · '+nMark+' درجة · '+subjMap.length+' مادة','s');aTab='entry';reA();});}
function aCertHTML(classId,stuId,term,type){const s=S();const cl=cls(classId);const st=(s.assess.students[classId]||[]).find(x=>x.id===stuId)||{};const key=term+'|'+type;const mm=((s.assess.marks[key]||{})[classId]||{})[stuId]||{};const subs=aExamSubjects(cl.gradeId);let tot=0,max=0;

function chColor(i){return ['#57B1C9','#7c3aed','#dc2626','#059669','#d97706','#0891b2','#ea580c','#16a34a','#4f46e5','#b91c1c','#0e7490','#a16207'][i%12];}
function svgBars(data,opts){opts=opts||{};const w=opts.w||440,bh=24,gap=9;const h=data.length*(bh+gap)+16;const max=Math.max(1,...data.map(d=>+d[1]||0));const clk=opts.fn?function(l){return ' onclick="'+opts.fn+'(&#39;'+opts.click+'&#39;,&#39;'+String(l).replace(/'/g,'')+'&#39;)" style="cursor:pointer"';}:function(){return '';};let out='';data.forEach((d,i)=>{const bw=Math.max(2,(w-150)*((+d[1]||0)/max));const y=8+i*(bh+gap);out+='<g'+clk(d[0])+'><title>'+esc(d[0])+'</title><text x="'+(w-6)+'" y="'+(y+bh/2+4)+'" text-anchor="end" font-size="11" fill="#334">'+esc(String(d[0]).length>20?String(d[0]).slice(0,19)+'…':d[0])+'</text><rect x="6" y="'+y+'" width="'+bw+'" height="'+bh+'" rx="5" fill="'+chColor(i)+'"/><text x="'+(bw+12)+'" y="'+(y+bh/2+4)+'" font-size="11" font-weight="700" fill="#111">'+(d[1])+'</text></g>';});return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" style="max-width:'+w+'px">'+out+'</svg>';}
function svgPie(data,opts){opts=opts||{};const clk=opts.fn?function(l){return ' onclick="'+opts.fn+'(&#39;'+opts.click+'&#39;,&#39;'+String(l).replace(/'/g,'')+'&#39;)" style="cursor:pointer"';}:function(){return '';};const tot=data.reduce((a,d)=>a+(+d[1]||0),0)||1;let ang=-90,cx=70,cy=70,r=60,paths='',legend='';data.forEach((d,i)=>{const a0=ang,a1=ang+(+d[1]||0)/tot*360;ang=a1;const large=(a1-a0)>180?1:0;const x0=cx+r*Math.cos(a0*Math.PI/180),y0=cy+r*Math.sin(a0*Math.PI/180),x1=cx+r*Math.cos(a1*Math.PI/180),y1=cy+r*Math.sin(a1*Math.PI/180);if((+d[1]||0)>0)paths+='<path'+clk(d[0])+' d="M'+cx+','+cy+' L'+x0.toFixed(1)+','+y0.toFixed(1)+' A'+r+','+r+' 0 '+large+' 1 '+x1.toFixed(1)+','+y1.toFixed(1)+' Z" fill="'+chColor(i)+'"/>';legend+='<div'+clk(d[0])+' style="display:flex;align-items:center;gap:6px;font-size:11px;cursor:'+(opts.fn?'pointer':'default')+'"><span style="width:12px;height:12px;background:'+chColor(i)+';border-radius:3px;display:inline-block"></span>'+esc(d[0])+' — '+(d[1])+' ('+Math.round((+d[1]||0)/tot*100)+'%)</div>';});return '<div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:center"><svg viewBox="0 0 140 140" width="140" height="140" style="flex:0 0 auto">'+paths+'</svg><div style="display:flex;flex-direction:column;gap:5px;flex:1 1 150px;min-width:0">'+legend+'</div></div>';}
function tableFromCounts(title,counts){const rows=Object.keys(counts).map(k=>'<tr><td>'+esc(k)+'</td><td style="text-align:center">'+counts[k]+'</td></tr>').join('');return '<h3>'+esc(title)+'</h3><table><thead><tr><th>البند</th><th>العدد</th></tr></thead><tbody>'+rows+'</tbody></table>';}
