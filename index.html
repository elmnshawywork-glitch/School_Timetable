   PHASE 2 — OPERATIONAL PLAN
   ============================================================ */
let opTab='calendar';
function reOp(){renderOperational(reC());}
function renderOperational(c){if(!can('operational')){c.innerHTML='<div class="empty"><div class="empty-ic">🔒</div><div class="empty-t">لمدير المدرسة ومدير إدارة الجدول</div></div>';return;}
  const s=S(),ro=!can('opEdit');
  const tabs=`<div class="tabs">${[['calendar','📅 الإجازات والعطلات'],['exams','📝 مواعيد الامتحانات'],['terms','📚 الفصلان الدراسيان'],['overview','🧭 نظرة عامة']].map(t=>`<div class="tab ${opTab===t[0]?'on':''}" onclick="opTab='${t[0]}';reOp()">${t[1]}</div>`).join('')}</div>`;
  let body='';
  if(opTab==='calendar'){
    const wk=DAYS_ALL.map(dn=>`<label style="display:flex;gap:5px;align-items:center;font-size:12px;font-weight:600;cursor:pointer;padding:6px 11px;border:1.5px solid ${s.cfg.weekend.includes(dn)?'#FCA5A5':'var(--bdr)'};border-radius:8px;background:${s.cfg.weekend.includes(dn)?'#FEF2F2':'#fff'}"><input type="checkbox" class="wk-day" value="${dn}" ${s.cfg.weekend.includes(dn)?'checked':''} ${ro?'disabled':''}/> ${dn}</label>`).join('');
    const hols=(s.cfg.holidays||[]).slice().sort((a,b)=>(a.from||'').localeCompare(b.from||'')).map(h=>`<tr><td><b>${esc(h.name)}</b></td><td>${esc(h.from)}</td><td>${esc(h.to||h.from)}</td><td>${holDays(h)} يوم</td>${ro?'':`<td style="white-space:nowrap"><button class="btn bxsm bout" onclick="opHoliday('${h.id}')">تعديل</button><button class="btn bxsm bred" onclick="opDelHoliday('${h.id}')">حذف</button></td>`}</tr>`).join('');
    body=`<div class="card"><div class="ctitle">🗓️ أيام العطلة الأسبوعية</div><div class="info" style="margin:8px 0">الجمعة والسبت عطلة افتراضياً. أيام العطلة لا تدخل ضمن الجدول الدراسى.</div><div style="display:flex;gap:8px;flex-wrap:wrap">${wk}</div>${ro?'':'<div style="margin-top:12px"><button class="btn bpri bsm" onclick="opSaveWeekend()">💾 حفظ أيام العطلة</button></div>'}</div>
      <div class="card"><div class="chdr"><div class="ctitle">🏖️ الإجازات السنوية</div>${ro?'':'<button class="btn bteal bsm" onclick="opHoliday()">+ إضافة إجازة</button>'}</div><div class="tbwrap"><table><thead><tr><th>الإجازة</th><th>من</th><th>إلى</th><th>المدة</th>${ro?'':'<th></th>'}</tr></thead><tbody>${hols||`<tr><td colspan="${ro?4:5}"><div class="empty"><div class="empty-t">لا إجازات مسجّلة</div></div></td></tr>`}</tbody></table></div></div>`;
  } else if(opTab==='terms'){
    const yr=`<div class="card"><div class="ctitle">📆 بداية العام الدراسى</div><div class="info" style="margin:8px 0">تُستخدم لحساب أرقام الأسابيع فى خطط المناهج وتقارير الالتزام.</div><div class="fm"><label>تاريخ بداية الأسبوع الأول</label><input type="date" id="op-ystart" value="${s.cfg.yearStart}" ${ro?'disabled':''}/></div>${ro?'':'<div style="margin-top:10px"><button class="btn bpri bsm" onclick="opSaveYear()">💾 حفظ</button></div>'}</div>`;
    const terms=s.cfg.terms.map((t,i)=>`<div class="prow"><input class="plabel" value="${esc(t.name)}" onchange="opTerm(${i},'name',this.value)" ${ro?'disabled':''}/><span style="font-size:11px">من</span><input type="date" value="${t.from}" onchange="opTerm(${i},'from',this.value)" ${ro?'disabled':''}/><span style="font-size:11px">إلى</span><input type="date" value="${t.to}" onchange="opTerm(${i},'to',this.value)" ${ro?'disabled':''}/></div>`).join('');
    body=yr+`<div class="card"><div class="ctitle">📚 الفصلان الدراسيان</div><div style="margin-top:10px">${terms}</div></div>`;
  } else if(opTab==='exams'){
    const ew=(s.cfg.examWindows||[]).slice().sort((a,b)=>(a.from||'').localeCompare(b.from||''));
    const rowsE=ew.map(x=>`<tr><td><span class="badge ${x.kind==='formative'?'ba':x.kind==='midyear'||x.kind==='final'?'br':'bn'}">${EW_LABEL[x.kind]||x.kind}</span></td><td><b>${esc(x.name)}</b></td><td>${esc(x.from)}</td><td>${esc(x.to||x.from)}</td><td style="font-size:11px;color:var(--t2)">${esc(x.note||'')}</td>${ro?'':`<td style="white-space:nowrap"><button class="btn bxsm bout" onclick="opExam('${x.id}')">تعديل</button><button class="btn bxsm bred" onclick="opDelExam('${x.id}')">حذف</button></td>`}</tr>`).join('');
    const au=afterUnitExams();
    const auRows=au.map(o=>`<tr><td>${esc(tea(o.p.teacherId).name||'')}</td><td>${esc(cls(o.p.classId).name)}</td><td>${esc(subj(o.p.subId).name)}</td><td>أسبوع ${o.it.week}</td><td>${esc(o.it.unit||o.it.title)}</td></tr>`).join('');
    body=`<div class="card"><div class="chdr"><div class="ctitle">📝 مواعيد الامتحانات</div>${ro?'':`<div style="display:flex;gap:6px"><button class="btn bxsm bwarn" onclick="opExam('','formative')">+ تكوينى شهرى</button><button class="btn bxsm bred" onclick="opExam('','midyear')">+ تجميعى</button></div>`}</div>
      <div class="info" style="margin:8px 0">التكوينية (الشهرية) — وفى بعض مواد التخصص تكون بعد انتهاء الوحدة (تُحدَّد من خطة المعلم). والتجميعية: نصف العام وآخر العام.</div>
      <div class="tbwrap"><table><thead><tr><th>النوع</th><th>المسمى</th><th>من</th><th>إلى</th><th>ملاحظة</th>${ro?'':'<th></th>'}</tr></thead><tbody>${rowsE||`<tr><td colspan="${ro?5:6}"><div class="empty"><div class="empty-t">لا مواعيد — أضِف أو استورد خطة التشغيل</div></div></td></tr>`}</tbody></table></div></div>
      <div class="card"><div class="ctitle">📌 امتحانات التخصص بعد الوحدة (من خطط المعلمين)</div><div class="tbwrap"><table><thead><tr><th>المعلم</th><th>الفصل</th><th>المادة</th><th>التوقيت</th><th>الوحدة/الدرس</th></tr></thead><tbody>${auRows||'<tr><td colspan=5><div class="empty"><div class="empty-t">لا بنود مُعلّمة «امتحان بعد الوحدة» بعد</div></div></td></tr>'}</tbody></table></div></div>`;
  } else {
    const cw=curWeek(s);const totalHol=(s.cfg.holidays||[]).reduce((a,h)=>a+holDays(h),0);
    body=`<div class="mets"><div class="met teal"><div class="mic">📅</div><div class="mlbl">الأسبوع الحالى</div><div class="mval">${cw>0?cw:'—'}</div><div class="msub">منذ بداية العام</div></div><div class="met purple"><div class="mic">🏖️</div><div class="mlbl">أيام الإجازات</div><div class="mval">${totalHol}</div></div><div class="met"><div class="mic">🚫</div><div class="mlbl">عطلة أسبوعية</div><div class="mval">${s.cfg.weekend.length}</div><div class="msub">${esc(s.cfg.weekend.join(' · '))}</div></div><div class="met amber"><div class="mic">🗂️</div><div class="mlbl">خطط المناهج</div><div class="mval">${(s.plans||[]).length}</div></div></div>
      <div class="card"><div class="ctitle">الفصلان الدراسيان</div><div class="tbwrap"><table><thead><tr><th>الفصل</th><th>من</th><th>إلى</th></tr></thead><tbody>${s.cfg.terms.map(t=>`<tr><td><b>${esc(t.name)}</b></td><td>${esc(t.from)}</td><td>${esc(t.to)}</td></tr>`).join('')}</tbody></table></div></div>`;
  }
  c.innerHTML=`<div class="pghdr"><div><div class="pgtitle">🗓️ الخطة التشغيلية السنوية</div><div class="pgsub">${esc(schoolName(ACTIVE))}${ro?' — عرض فقط':''}</div></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn bout bsm" onclick="dlOpTemplate()">⬇️ نموذج Excel</button><button class="btn bout bsm" onclick="dlOpTemplateCSV()">CSV</button>${ro?'':'<button class="btn bteal bsm" onclick="importOpPlan()">📥 استيراد خطة التشغيل</button>'}</div></div>${schoolBar('operational')}${tabs}${body}`;
}
function holDays(h){try{const a=new Date(h.from+'T00:00'),b=new Date((h.to||h.from)+'T00:00');return Math.max(1,Math.round((b-a)/864e5)+1);}catch(e){return 1;}}
function curWeek(s){try{const y=new Date(s.cfg.yearStart+'T00:00'),n=new Date();const w=Math.floor((n-y)/(7*864e5))+1;return w;}catch(e){return 0;}}
function opSaveWeekend(){S().cfg.weekend=[...document.querySelectorAll('.wk-day:checked')].map(x=>x.value);logAct('تعديل عطلة أسبوعية',S().cfg.weekend.join('،'));save();reOp();toast('تم الحفظ','s');}
function opSaveYear(){S().cfg.yearStart=document.getElementById('op-ystart').value;logAct('بداية العام',S().cfg.yearStart);save();reOp();toast('تم الحفظ','s');}
function opTerm(i,f,v){S().cfg.terms[i][f]=v;save();}
function opHoliday(id){const h=id?(S().cfg.holidays.find(x=>x.id===id)):{name:'',from:todayISO(),to:todayISO()};openM(`<div class="mbox"><div class="mhdr teal"><span class="mtitle">${id?'تعديل إجازة':'إضافة إجازة'}</span><button class="mcls" onclick="closeM()">✕</button></div><div class="mbody"><div class="fgrid"><div class="fm full"><label>اسم الإجازة *</label><input id="h-name" value="${esc(h.name||'')}" placeholder="مثال: إجازة نصف العام"/></div><div class="fm"><label>من</label><input type="date" id="h-from" value="${h.from}"/></div><div class="fm"><label>إلى</label><input type="date" id="h-to" value="${h.to||h.from}"/></div></div></div><div class="mfoot"><button class="btn bout bsm" onclick="closeM()">إلغاء</button><button class="btn bteal bsm" onclick="opSaveHoliday('${id||''}')">حفظ</button></div></div>`);}
function opSaveHoliday(id){const name=document.getElementById('h-name').value.trim();if(!name)return toast('الاسم مطلوب','e');const o={name,from:document.getElementById('h-from').value,to:document.getElementById('h-to').value};if(id){Object.assign(S().cfg.holidays.find(x=>x.id===id),o);}else{o.id=uid('hol');S().cfg.holidays.push(o);}logAct('إجازة',name);save();closeM();reOp();toast('تم الحفظ','s');}
function opDelHoliday(id){confirmM('حذف هذه الإجازة؟',()=>{S().cfg.holidays=S().cfg.holidays.filter(x=>x.id!==id);save();reOp();toast('تم الحذف','e');});}

/* ============================================================
   PHASE 2 — CURRICULUM PLANS + APPROVAL
   ============================================================ */
const PSTATUS={draft:{l:'مسودة',c:'bn'},submitted:{l:'بانتظار الاعتماد',c:'ba'},approved:{l:'معتمدة',c:'bg'}};
function planProgress(p){const t=(p.items||[]).length,dn=(p.items||[]).filter(i=>i.done).length;return{t,dn,pct:t?Math.round(dn/t*100):0};}
function rePlans(){renderPlans(reC());}
function renderPlans(c){if(!can('plansView')){c.innerHTML='<div class="empty"><div class="empty-ic">🔒</div><div class="empty-t">غير متاح</div></div>';return;}
  const s=S(),r=SESSION.role;let list=(s.plans||[]).slice();
  if(r==='teacher')list=list.filter(p=>p.teacherId===SESSION.teacherId);
  list.sort((a,b)=>(a.term-b.term)||b.ts-a.ts);
  const pend=list.filter(p=>p.status==='submitted').length,req=list.filter(p=>p.editReq).length;
  const notice=(r==='principal'&&(pend||req))?`<div class="warnbox" style="margin-bottom:12px">لديك <b>${pend}</b> خطة بانتظار الاعتماد${req?` و<b>${req}</b> طلب تعديل`:''}.</div>`:'';
  const cards=list.map(p=>{const pr=planProgress(p),st=PSTATUS[p.status]||PSTATUS.draft;const isOwn=p.teacherId===SESSION.teacherId;const canApprove=can('plansApprove');
    let btns='';
    if(r==='teacher'&&isOwn){if(p.status==='draft')btns=`<button class="btn bxsm bteal" onclick="planEditor('${p.id}')">تحرير البنود</button><button class="btn bxsm bout" onclick="importCurrToPlan('${p.id}')">📥 استيراد Excel/CSV</button><button class="btn bxsm bpri" onclick="planSubmit('${p.id}')">إرسال للاعتماد</button><button class="btn bxsm bred" onclick="planDel('${p.id}')">حذف</button>`;
      else if(p.status==='submitted')btns=`<button class="btn bxsm bout" onclick="planEditor('${p.id}',true)">عرض</button><span class="badge ba">بانتظار مدير المدرسة</span>`;
      else btns=`<button class="btn bxsm bout" onclick="planEditor('${p.id}',true)">عرض ومتابعة التنفيذ</button>${p.editReq?'<span class="badge ba">طلب تعديل قيد المراجعة</span>':'<button class="btn bxsm bwarn" onclick="planRequestEdit(\''+p.id+'\')">طلب إذن تعديل</button>'}`;}
    else if(canApprove){btns=`<button class="btn bxsm bout" onclick="planEditor('${p.id}',true)">مراجعة</button>`;if(p.status==='submitted')btns+=`<button class="btn bxsm bgreen" onclick="planApprove('${p.id}')">✓ اعتماد</button><button class="btn bxsm bred" onclick="planReturn('${p.id}')">إعادة للتعديل</button>`;if(p.editReq)btns+=`<button class="btn bxsm bwarn" onclick="planGrantEdit('${p.id}')">السماح بالتعديل</button>`;}
    else btns=`<button class="btn bxsm bout" onclick="planEditor('${p.id}',true)">عرض</button>`;
    return `<div class="hwitem"><div class="hwmeta"><span class="badge ${st.c}">${st.l}</span><span class="badge bn">الصف ${esc(grade(cls(p.classId).gradeId).name)} · فصل ${esc(cls(p.classId).name)}</span><span class="badge bt"><span class="colordot" style="background:${subj(p.subId).color}"></span>${esc(subj(p.subId).name)}</span><span class="badge bpur">👨‍🏫 ${esc(tea(p.teacherId).name||'')}</span><span class="badge bn">الفصل الدراسى ${p.term}</span><span class="hwdate">التنفيذ ${pr.dn}/${pr.t} (${pr.pct}%)</span></div>
      <div class="sbar" style="max-width:280px"><span style="width:${pr.pct}%;background:${pr.pct>=80?'#1D9E75':pr.pct>=40?'#D97706':'#57B1C9'}"></span></div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px">${btns}</div></div>`;}).join('');
  c.innerHTML=`<div class="pghdr"><div><div class="pgtitle">🗂️ خطط المناهج</div><div class="pgsub">${r==='teacher'?'خطتك المتكاملة لكل مادة وفصل وترم':'اعتماد ومتابعة خطط المعلمين'}</div></div>${can('plansOwn')?`<button class="btn bteal bsm" onclick="planNew()">+ خطة جديدة</button>`:''}</div>${schoolBar('plans')}<div class="filterbar"><div class="fg" style="flex:1"><label>النماذج والاستيراد</label><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn bout bsm" onclick="dlCurrTemplate()">⬇️ نموذج Excel</button><button class="btn bout bsm" onclick="dlCurrTemplateCSV()">CSV</button>${can('plansOwn')?'<button class="btn bout bsm" onclick="importCurrNew()">📥 استيراد (Excel/CSV)</button>':''}${can('plansApprove')?'<button class="btn bteal bsm" onclick="importCurrForTeacher()">📤 رفع خطة لمعلم</button>':''}</div></div></div>${notice}<div style="display:flex;flex-direction:column;gap:10px">${cards||'<div class="empty"><div class="empty-ic">📭</div><div class="empty-t">لا خطط بعد</div></div>'}</div>`;
}
function planNew(){const s=S();const clsPool=teacherClasses(SESSION.teacherId).map(cls);if(!clsPool.length)return toast('لا فصول مسندة إليك','w');const cid=clsPool[0].id;const subPool=teacherSubjectsInClass(SESSION.teacherId,cid).map(subj);
  openM(`<div class="mbox"><div class="mhdr teal"><span class="mtitle">خطة منهج جديدة</span><button class="mcls" onclick="closeM()">✕</button></div><div class="mbody"><div class="fgrid"><div class="fm"><label>الفصل</label><select id="pl-cls" onchange="planNewCls()">${clsPool.map(x=>`<option value="${x.id}">فصل ${esc(x.name)}</option>`).join('')}</select></div><div class="fm"><label>المادة</label><select id="pl-sub">${subPool.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></div><div class="fm"><label>الفصل الدراسى</label><select id="pl-term"><option value="1">الأول</option><option value="2">الثانى</option></select></div><div class="fm"><label>عدد الأسابيع</label><input type="number" id="pl-weeks" value="15" min="1" max="40"/></div></div><div class="info" style="margin-top:8px">ستُنشأ بنود أسبوعية فارغة تكتب فيها عناوين الدروس، ثم ترسلها لاعتماد مدير المدرسة.</div></div><div class="mfoot"><button class="btn bout bsm" onclick="closeM()">إلغاء</button><button class="btn bteal bsm" onclick="planCreate()">إنشاء</button></div></div>`);}
function planNewCls(){const cid=document.getElementById('pl-cls').value;const subPool=teacherSubjectsInClass(SESSION.teacherId,cid).map(subj);document.getElementById('pl-sub').innerHTML=subPool.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');}
function planCreate(){const s=S();const classId=document.getElementById('pl-cls').value,subId=document.getElementById('pl-sub').value,term=+document.getElementById('pl-term').value,weeks=Math.max(1,Math.min(40,+document.getElementById('pl-weeks').value||15));
  if((s.plans||[]).some(p=>p.teacherId===SESSION.teacherId&&p.classId===classId&&p.subId===subId&&p.term===term))return toast('توجد خطة لنفس المادة والفصل والترم','e');
  const items=[];for(let w=1;w<=weeks;w++)items.push({week:w,title:'',note:'',done:false,doneDate:''});
  const p={id:uid('pl'),teacherId:SESSION.teacherId,classId,subId,term,status:'draft',editReq:false,items,ts:Date.now()};s.plans.push(p);logAct('إنشاء خطة منهج',subj(subId).name+' — فصل '+cls(classId).name);save();closeM();planEditor(p.id);}
function planEditor(id,view){const p=(S().plans||[]).find(x=>x.id===id);if(!p)return;const locked=view||(p.status==='approved'&&SESSION.role==='teacher')||(SESSION.role==='teacher'&&p.teacherId!==SESSION.teacherId);const isTeacherOwner=SESSION.role==='teacher'&&p.teacherId===SESSION.teacherId;const canMarkDone=isTeacherOwner;
  const rows=(p.items||[]).map((it,i)=>`<tr><td style="font-weight:800;color:var(--N);text-align:center">${it.week}</td><td><input type="date" value="${esc(it.date||'')}" onchange="planItem('${id}',${i},'date',this.value)" ${p.status==='approved'?'disabled':''} style="padding:5px;border:1.5px solid var(--bdr);border-radius:6px;font-family:inherit;font-size:11px"/></td><td><input value="${esc(it.title)}" onchange="planItem('${id}',${i},'title',this.value)" ${locked&&!isTeacherOwner?'disabled':(p.status==='approved'?'disabled':'')} placeholder="عنوان الدرس" style="width:100%;padding:6px 8px;border:1.5px solid var(--bdr);border-radius:6px;font-family:inherit;font-size:12px"/></td><td><input value="${esc(it.note||'')}" onchange="planItem('${id}',${i},'note',this.value)" ${p.status==='approved'?'disabled':''} placeholder="ملاحظات" style="width:100%;padding:6px 8px;border:1.5px solid var(--bdr);border-radius:6px;font-family:inherit;font-size:11px"/></td><td style="text-align:center">${canMarkDone?`<input type="checkbox" ${it.done?'checked':''} onchange="planDone('${id}',${i},this.checked)"/>`:(it.done?'✅':'—')}${it.done&&it.doneDate?`<div style="font-size:8px;color:var(--t3)">${esc(it.doneDate)}</div>`:''}</td></tr>`).join('');
  const pr=planProgress(p),st=PSTATUS[p.status];
  openM(`<div class="mbox wide"><div class="mhdr"><span class="mtitle">خطة المنهج — ${esc(subj(p.subId).name)} · فصل ${esc(cls(p.classId).name)} · ت${p.term}</span><button class="mcls" onclick="closeM()">✕</button></div><div class="mbody"><div style="display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap"><span class="badge ${st.c}">${st.l}</span><span class="badge bn">التنفيذ ${pr.dn}/${pr.t} (${pr.pct}%)</span>${p.approvedBy?`<span class="badge bg">اعتمدها: ${esc(p.approvedBy)}</span>`:''}${isTeacherOwner&&p.status!=='approved'?'<button class="btn bxsm bteal" style="margin-right:auto" onclick="planAddWeek(\''+id+'\')">+ أسبوع</button>':''}</div><div class="tbwrap" style="max-height:52vh;overflow:auto"><table><thead><tr><th style="width:50px">الأسبوع</th><th style="width:130px">التاريخ</th><th>عنوان الدرس</th><th>ملاحظات</th><th style="width:70px">نُفِّذ</th></tr></thead><tbody>${rows}</tbody></table></div>${p.status==='approved'&&isTeacherOwner?'<div class="info" style="margin-top:10px">الخطة معتمدة — لا يمكن تعديل العناوين إلا بعد طلب إذن من مدير المدرسة. يمكنك تحديد ما تم تنفيذه.</div>':''}</div><div class="mfoot"><button class="btn bout bsm" onclick="closeM()">إغلاق</button>${isTeacherOwner&&p.status==='draft'?`<button class="btn bpri bsm" onclick="planSubmit('${id}')">إرسال للاعتماد</button>`:''}${can('plansApprove')&&p.status==='submitted'?`<button class="btn bgreen bsm" onclick="planApprove('${id}')">✓ اعتماد الخطة</button>`:''}</div></div>`);}
function planItem(id,i,f,v){const p=S().plans.find(x=>x.id===id);if(!p)return;if(p.status==='approved'&&f==='title')return;p.items[i][f]=v;save();}
function planDone(id,i,v){const p=S().plans.find(x=>x.id===id);if(!p)return;p.items[i].done=v;p.items[i].doneDate=v?todayISO():'';save();planEditor(id);}
function planAddWeek(id){const p=S().plans.find(x=>x.id===id);p.items.push({week:(p.items.length?p.items[p.items.length-1].week+1:1),title:'',note:'',done:false,doneDate:''});save();planEditor(id);}
function planDel(id){confirmM('حذف هذه الخطة؟',()=>{S().plans=S().plans.filter(x=>x.id!==id);save();rePlans();toast('تم الحذف','e');});}
function planSubmit(id){const p=S().plans.find(x=>x.id===id);if(!(p.items||[]).some(i=>i.title))return toast('اكتب عناوين الدروس أولاً','e');p.status='submitted';logAct('إرسال خطة للاعتماد',subj(p.subId).name+' — فصل '+cls(p.classId).name);save();closeM();rePlans();toast('أُرسلت لاعتماد مدير المدرسة','s');}
function planApprove(id){const p=S().plans.find(x=>x.id===id);p.status='approved';p.editReq=false;p.approvedBy=SESSION.name;p.approvedAt=todayISO();logAct('اعتماد خطة منهج',subj(p.subId).name+' — '+tea(p.teacherId).name);save();closeM();rePlans();toast('تم اعتماد الخطة','s');}
function planReturn(id){const p=S().plans.find(x=>x.id===id);p.status='draft';logAct('إعادة خطة للتعديل',subj(p.subId).name);save();rePlans();toast('أُعيدت للمعلم للتعديل','w');}
function planRequestEdit(id){const p=S().plans.find(x=>x.id===id);p.editReq=true;logAct('طلب إذن تعديل خطة',subj(p.subId).name);save();rePlans();toast('أُرسل طلب التعديل لمدير المدرسة','s');}
function planGrantEdit(id){const p=S().plans.find(x=>x.id===id);p.status='draft';p.editReq=false;logAct('السماح بتعديل خطة',subj(p.subId).name+' — '+tea(p.teacherId).name);save();rePlans();toast('سُمح للمعلم بالتعديل','s');}

/* ============================================================
   PHASE 2 — QUALITY / COMPLIANCE
   ============================================================ */
var qF={teaId:'',classId:'',term:''};
function weekEndDate(s,w){const y=new Date(s.cfg.yearStart+'T00:00');return new Date(y.getTime()+((w-1)*7+6)*864e5);}
function compliance(s,f){let planned=0,done=0,due=0,doneDue=0,onTime=0,thisW=0,thisWDone=0,monW=0,monWDone=0;const cw=curWeek(s);const now=new Date();
  const rows=[];
  (s.plans||[]).filter(p=>p.status==='approved').forEach(p=>{if(f.teaId&&p.teacherId!==f.teaId)return;if(f.classId&&p.classId!==f.classId)return;if(f.term&&+p.term!==+f.term)return;
    let pt=0,pd=0,pdue=0,pdd=0;
    (p.items||[]).forEach(it=>{if(!it.title)return;planned++;pt++;const we=weekEndDate(s,it.week);const isDue=we<=now;if(isDue){due++;pdue++;}if(it.done){done++;pd++;if(isDue){doneDue++;pdd++;}if(it.doneDate&&new Date(it.doneDate+'T00:00')<=we)onTime++;}
      if(it.week===cw){thisW++;if(it.done)thisWDone++;}if(it.week>cw-4&&it.week<=cw){monW++;if(it.done)monWDone++;}});
    rows.push({p,pt,pd,pdue,pdd,pct:pt?Math.round(pd/pt*100):0,commit:pdue?Math.round(pdd/pdue*100):0});});
  return{planned,done,due,doneDue,onTime,commit:due?Math.round(doneDue/due*100):0,ontimePct:done?Math.round(onTime/done*100):0,cw,thisW,thisWDone,monW,monWDone,rows};}
function setQF(k,v){qF[k]=v;renderQuality(reC());}
function renderQuality(c){if(!can('quality')){c.innerHTML='<div class="empty"><div class="empty-ic">🔒</div><div class="empty-t">لمسؤول الجودة ومدير المدرسة ومدير إدارة الجدول</div></div>';return;}
  const s=S();const cm=compliance(s,qF);
  const teaOpts=`<option value="">كل المعلمين</option>`+s.teachers.map(t=>`<option value="${t.id}" ${qF.teaId===t.id?'selected':''}>${esc(t.name)}</option>`).join('');
  const clsOpts=`<option value="">كل الفصول</option>`+s.classes.map(x=>`<option value="${x.id}" ${qF.classId===x.id?'selected':''}>فصل ${esc(x.name)}</option>`).join('');
  const rows=cm.rows.map(R=>`<tr><td>${esc(tea(R.p.teacherId).name||'')}</td><td>${esc(grade(cls(R.p.classId).gradeId).name)}/${esc(cls(R.p.classId).name)}</td><td><span class="colordot" style="background:${subj(R.p.subId).color}"></span>${esc(subj(R.p.subId).name)}</td><td style="text-align:center">ت${R.p.term}</td><td style="text-align:center">${R.pt}</td><td style="text-align:center">${R.pd}</td><td style="text-align:center">${R.pdue}</td><td style="min-width:120px"><div class="sbar"><span style="width:${R.commit}%;background:${R.commit>=80?'#1D9E75':R.commit>=50?'#D97706':'#DC2626'}"></span></div><div style="font-size:9px;color:var(--t3);margin-top:2px">${R.commit}% التزام</div></td></tr>`).join('');
  c.innerHTML=`<div class="pghdr"><div><div class="pgtitle">🧭 الالتزام بالخطط الدراسية</div><div class="pgsub">مطابقة ما نُفِّذ فعلياً فى الجدول مع خطة المعلم المعتمدة — ${esc(schoolName(ACTIVE))}</div></div><button class="btn bout bsm" onclick="printQuality()">🖨️ PDF</button></div>${schoolBar('quality')}
    <div class="mets"><div class="met ${cm.commit>=80?'green':cm.commit>=50?'amber':'red'}"><div class="mic">🎯</div><div class="mlbl">الالتزام العام (حتى الآن)</div><div class="mval">${cm.due?cm.commit+'%':'—'}</div><div class="msub">${cm.doneDue}/${cm.due} بند مستحق</div></div>
      <div class="met teal"><div class="mic">📅</div><div class="mlbl">الأسبوع ${cm.cw>0?cm.cw:'—'}</div><div class="mval">${cm.thisW?Math.round(cm.thisWDone/cm.thisW*100):0}%</div><div class="msub">${cm.thisWDone}/${cm.thisW} هذا الأسبوع</div></div>
      <div class="met purple"><div class="mic">📆</div><div class="mlbl">آخر ٤ أسابيع</div><div class="mval">${cm.monW?Math.round(cm.monWDone/cm.monW*100):0}%</div><div class="msub">${cm.monWDone}/${cm.monW}</div></div>
      <div class="met"><div class="mic">⏱️</div><div class="mlbl">الالتزام بالتوقيت</div><div class="mval">${cm.ontimePct}%</div><div class="msub">${cm.done} بند مُنفّذ</div></div></div>
    <div class="filterbar"><div class="fg"><label>المعلم</label><select onchange="setQF('teaId',this.value)">${teaOpts}</select></div><div class="fg"><label>الفصل</label><select onchange="setQF('classId',this.value)">${clsOpts}</select></div><div class="fg"><label>الترم</label><select onchange="setQF('term',this.value)"><option value="">الكل</option><option value="1" ${qF.term==='1'?'selected':''}>الأول</option><option value="2" ${qF.term==='2'?'selected':''}>الثانى</option></select></div></div>
    <div class="card"><div class="ctitle" style="margin-bottom:10px">تفصيل الخطط المعتمدة</div><div class="tbwrap"><table><thead><tr><th>المعلم</th><th>الصف/الفصل</th><th>المادة</th><th>الترم</th><th>بنود</th><th>نُفِّذ</th><th>مستحق</th><th>الالتزام</th></tr></thead><tbody>${rows||'<tr><td colspan=8><div class="empty"><div class="empty-t">لا خطط معتمدة بعد — يعتمدها مدير المدرسة من «خطط المناهج»</div></div></td></tr>'}</tbody></table></div></div>`;
}
function printQuality(){const s=S();const cm=compliance(s,qF);let h=`<h2>الالتزام العام: ${cm.commit}% (${cm.doneDue}/${cm.due} بند مستحق)</h2><table><thead><tr><th>المعلم</th><th>الصف/الفصل</th><th>المادة</th><th>الترم</th><th>بنود</th><th>نُفِّذ</th><th>مستحق</th><th>الالتزام%</th></tr></thead><tbody>${cm.rows.map(R=>`<tr><td>${esc(tea(R.p.teacherId).name||'')}</td><td>${esc(grade(cls(R.p.classId).gradeId).name)}/${esc(cls(R.p.classId).name)}</td><td>${esc(subj(R.p.subId).name)}</td><td>ت${R.p.term}</td><td>${R.pt}</td><td>${R.pd}</td><td>${R.pdue}</td><td>${R.commit}%</td></tr>`).join('')}</tbody></table>`;printPDF('تقرير الالتزام بالخطط - '+schoolName(ACTIVE),h);}

  const gscode="var PROP=PropertiesService.getScriptProperties();\nfunction fileId_(){return PROP.getProperty('FILE_ID');}\nfunction getFile_(json){var id=fileId_();if(id){try{return DriveApp.getFileById(id);}catch(e){}}var f=DriveApp.createFile('ebda_db.json',json||'{}','application/json');PROP.setProperty('FILE_ID',f.getId());return f;}\nfunction doGet(e){var id=fileId_(),c='{}';if(id){try{c=DriveApp.getFileById(id).getBlob().getDataAsString();}catch(e){}}return ContentService.createTextOutput(c).setMimeType(ContentService.MimeType.JSON);}\nfunction doPost(e){var body=(e&&e.postData&&e.postData.contents)?JSON.parse(e.postData.contents):{};var json=JSON.stringify(body.db||{});getFile_(json).setContent(json);try{var ss=SpreadsheetApp.getActiveSpreadsheet();if(ss){var sh=ss.getSheetByName('Backups')||ss.insertSheet('Backups');sh.appendRow([new Date(),body.ts||'',json.length+' chars']);}}catch(e){}return ContentService.createTextOutput('ok');}";

      • <b>الإدارة والمعلمون (الكتّاب):</b> عددهم قليل، ويحفظون التعديلات إلى <b>Google Sheets</b> عبر Apps Script.<br>

    </div></div>
  <div class="card"><div class="chdr"><div class="ctitle">🧾 نماذج الخطط (تنزيل)</div></div><div class="info" style="margin-bottom:10px">نماذج CSV جاهزة: يملؤها مدير المدرسة (خطة التشغيل) والمعلم (خطة المنهج)، ثم تُستورد من صفحتى «الخطة التشغيلية» و«خطط المناهج».</div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn bteal bsm" onclick="dlOpTemplate()">⬇️ خطة التشغيل (Excel)</button><button class="btn bout bsm" onclick="dlOpTemplateCSV()">CSV</button><button class="btn bteal bsm" onclick="dlCurrTemplate()">⬇️ خطة المنهج (Excel)</button><button class="btn bout bsm" onclick="dlCurrTemplateCSV()">CSV</button></div></div><div class="card"><div class="chdr"><div class="ctitle">📄 Google Sheets (تخزين وكتابة الإدارة)</div><span class="badge ${g.url?'bg':'bn'}">${g.url?'مُهيّأ':'غير مُهيّأ'}</span></div>

/* ============================================================
   PHASE 4 — TEMPLATES & CSV IMPORT (operational plan + curriculum plan)
   ============================================================ */
function pickFile(cb){const inp=document.createElement('input');inp.type='file';inp.accept='.csv,.xlsx,text/csv';inp.onchange=()=>{const f=inp.files&&inp.files[0];if(!f)return;const name=(f.name||'').toLowerCase();
  if(name.endsWith('.xlsx')){loadSheetJS().then(()=>{const rd=new FileReader();rd.onload=()=>{try{const wb=XLSX.read(new Uint8Array(rd.result),{type:'array'});const ws=wb.Sheets[wb.SheetNames[0]];cb(XLSX.utils.sheet_to_csv(ws),f.name);}catch(e){toast('تعذّر قراءة ملف Excel — احفظه بصيغة CSV وأعد المحاولة','e');}};rd.readAsArrayBuffer(f);}).catch(()=>toast('تعذّر تحميل قارئ Excel (تحقق من الإنترنت) — استخدم CSV','e'));}
  else{const rd=new FileReader();rd.onload=()=>cb(rd.result,f.name);rd.readAsText(f,'utf-8');}};inp.click();}
function loadSheetJS(){return new Promise((res,rej)=>{if(typeof XLSX!=='undefined')return res();const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';sc.onload=()=>res();sc.onerror=()=>rej();document.head.appendChild(sc);});}
function dlData(uri,filename){const a=document.createElement('a');a.href=uri;a.download=filename;document.body.appendChild(a);a.click();a.remove();}
function parseCSV(text){text=String(text).replace(/^\uFEFF/,'');const rows=[];let i=0,field='',row=[],inQ=false;while(i<text.length){const ch=text[i];if(inQ){if(ch==='"'){if(text[i+1]==='"'){field+='"';i+=2;continue;}inQ=false;i++;continue;}field+=ch;i++;continue;}if(ch==='"'){inQ=true;i++;continue;}if(ch===','){row.push(field);field='';i++;continue;}if(ch==='\n'){row.push(field);rows.push(row);row=[];field='';i++;continue;}if(ch==='\r'){i++;continue;}field+=ch;i++;}if(field.length||row.length){row.push(field);rows.push(row);}return rows.filter(r=>r.some(c=>String(c).trim()!==''));}
/* ---- templates: Excel (embedded) + CSV fallback ---- */
function dlOpTemplate(){if(typeof window!=='undefined'&&window.__TPL&&__TPL.op){dlData(__TPL.op,'نموذج_خطة_التشغيل.xlsx');toast('تم تنزيل نموذج Excel','s');}else dlOpTemplateCSV();}
function dlCurrTemplate(){if(typeof window!=='undefined'&&window.__TPL&&__TPL.curr){dlData(__TPL.curr,'نموذج_خطة_المنهج.xlsx');toast('تم تنزيل نموذج Excel','s');}else dlCurrTemplateCSV();}
function dlOpTemplateCSV(){const rows=[['النوع','الاسم/المسمى','من (YYYY-MM-DD)','إلى (YYYY-MM-DD)'],
  ['عطلة أسبوعية','الجمعة','',''],['عطلة أسبوعية','السبت','',''],
  ['إجازة رسمية','إجازة نصف العام','2026-01-25','2026-02-07'],
  ['ترم','الفصل الدراسى الأول','2025-09-21','2026-01-22'],
  ['ترم','الفصل الدراسى الثانى','2026-02-08','2026-06-11'],
  ['امتحان تكوينى شهرى','اختبار شهر أكتوبر','2025-10-19','2025-10-23'],
  ['امتحان تجميعى نصف العام','امتحانات نصف العام','2026-01-11','2026-01-22'],
  ['امتحان تجميعى آخر العام','امتحانات آخر العام','2026-05-24','2026-06-11']];
  csvDownload(rows,'نموذج_خطة_التشغيل.csv');}
function dlCurrTemplateCSV(){const rows=[['الأسبوع','التاريخ','الوحدة','عنوان الدرس','ملاحظات','امتحان بعد الوحدة (نعم/لا)'],
  ['1','2025-09-21','الوحدة الأولى','مقدمة الوحدة','','لا'],
  ['2','','الوحدة الأولى','الدرس الثانى','','لا'],
  ['3','','الوحدة الأولى','مراجعة وتقييم الوحدة','امتحان تكوينى','نعم']];
  csvDownload(rows,'نموذج_خطة_المنهج.csv');}
/* ---- operational plan import (principal) ---- */
function importOpPlan(){pickFile((txt)=>{const rows=parseCSV(txt);if(rows.length<2)return toast('الملف فارغ','e');const s=S();
  let weekend=[],holidays=[],terms=[],exams=[];
  rows.slice(1).forEach(r=>{const t=(r[0]||'').trim(),nm=(r[1]||'').trim(),f=(r[2]||'').trim(),e=(r[3]||'').trim();if(!t)return;
    if(t.indexOf('عطلة أسبوعية')>=0){if(nm)weekend.push(nm);}
    else if(t.indexOf('إجازة')>=0){holidays.push({id:uid('hol'),name:nm,from:f,to:e||f,kind:'official'});}
    else if(t.indexOf('ترم')>=0){terms.push({name:nm,from:f,to:e});}
    else if(t.indexOf('تكوينى')>=0){exams.push({id:uid('ew'),name:nm,from:f,to:e||f,kind:'formative'});}
    else if(t.indexOf('نصف العام')>=0){exams.push({id:uid('ew'),name:nm,from:f,to:e||f,kind:'midyear'});}
    else if(t.indexOf('آخر العام')>=0){exams.push({id:uid('ew'),name:nm,from:f,to:e||f,kind:'final'});}
    else if(t.indexOf('تجميعى')>=0){exams.push({id:uid('ew'),name:nm,from:f,to:e||f,kind:'summative'});}});
  if(weekend.length)s.cfg.weekend=weekend;if(terms.length)s.cfg.terms=terms;if(holidays.length)s.cfg.holidays=holidays;if(exams.length)s.cfg.examWindows=exams;
  logAct('استيراد خطة التشغيل',holidays.length+' إجازة · '+exams.length+' امتحان');save();reOp();toast('تم استيراد خطة التشغيل ✓','s');});}
/* ---- curriculum import ---- */
function parseCurrItems(txt){const rows=parseCSV(txt);const items=[];rows.slice(1).forEach((r,idx)=>{const wk=parseInt(r[0])||idx+1;const title=(r[3]||'').trim();if(!title&&!(r[2]||'').trim())return;items.push({week:wk,date:(r[1]||'').trim(),unit:(r[2]||'').trim(),title:title,note:(r[4]||'').trim(),examAfterUnit:/نعم/.test(r[5]||''),done:false,doneDate:''});});return items;}
function importCurrToPlan(planId){const p=S().plans.find(x=>x.id===planId);if(!p)return;if(p.status==='approved')return toast('الخطة معتمدة — اطلب إذن تعديل أولاً','w');pickFile((txt)=>{const items=parseCurrItems(txt);if(!items.length)return toast('لا بنود صالحة فى الملف','e');p.items=items;logAct('استيراد بنود منهج',subj(p.subId).name+' — '+items.length+' بند');save();toast('تم استيراد '+items.length+' بند ✓','s');planEditor(planId);});}
function importCurrNew(){ // teacher: choose class+subject+term then upload
  const s=S();const clsPool=teacherClasses(SESSION.teacherId).map(cls);if(!clsPool.length)return toast('لا فصول مسندة إليك','w');const cid=clsPool[0].id;const subPool=teacherSubjectsInClass(SESSION.teacherId,cid).map(subj);
  openM(`<div class="mbox"><div class="mhdr teal"><span class="mtitle">استيراد خطة منهج من ملف</span><button class="mcls" onclick="closeM()">✕</button></div><div class="mbody"><div class="fgrid"><div class="fm"><label>الفصل</label><select id="ic-cls" onchange="icCls()">${clsPool.map(x=>`<option value="${x.id}">فصل ${esc(x.name)}</option>`).join('')}</select></div><div class="fm"><label>المادة</label><select id="ic-sub">${subPool.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></div><div class="fm"><label>الترم</label><select id="ic-term"><option value="1">الأول</option><option value="2">الثانى</option></select></div></div><div class="info" style="margin-top:8px">نزّل «نموذج خطة المنهج» أولاً، املأه، ثم استورده هنا.</div></div><div class="mfoot"><button class="btn bout bsm" onclick="dlCurrTemplate()">⬇️ تنزيل النموذج</button><div style="flex:1"></div><button class="btn bteal bsm" onclick="icGo()">اختر الملف واستورد</button></div></div>`);}
function icCls(){const cid=document.getElementById('ic-cls').value;const subPool=teacherSubjectsInClass(SESSION.teacherId,cid).map(subj);document.getElementById('ic-sub').innerHTML=subPool.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');}
function icGo(){const classId=document.getElementById('ic-cls').value,subId=document.getElementById('ic-sub').value,term=+document.getElementById('ic-term').value;const s=S();
  if(s.plans.some(p=>p.teacherId===SESSION.teacherId&&p.classId===classId&&p.subId===subId&&p.term===term))return toast('توجد خطة لنفس المادة والفصل والترم','e');
  pickFile((txt)=>{const items=parseCurrItems(txt);if(!items.length)return toast('لا بنود صالحة','e');const p={id:uid('pl'),teacherId:SESSION.teacherId,classId,subId,term,status:'draft',editReq:false,items,ts:Date.now()};s.plans.push(p);logAct('استيراد خطة منهج',subj(subId).name+' — '+items.length+' بند');save();closeM();rePlans();toast('تم إنشاء الخطة من الملف ✓','s');});}
function importCurrForTeacher(){ // principal uploads a curriculum on behalf of a teacher
  const s=S();openM(`<div class="mbox"><div class="mhdr teal"><span class="mtitle">رفع خطة منهج لمعلم</span><button class="mcls" onclick="closeM()">✕</button></div><div class="mbody"><div class="fgrid"><div class="fm"><label>المعلم</label><select id="ip-tea">${s.teachers.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select></div><div class="fm"><label>الفصل</label><select id="ip-cls">${s.classes.map(x=>`<option value="${x.id}">فصل ${esc(x.name)}</option>`).join('')}</select></div><div class="fm"><label>المادة</label><select id="ip-sub">${[...new Map(s.subjects.map(x=>[x.name,x])).values()].map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></div><div class="fm"><label>الترم</label><select id="ip-term"><option value="1">الأول</option><option value="2">الثانى</option></select></div></div><div class="info" style="margin-top:8px">تُنشأ الخطة معتمدة باسم المعلم المختار.</div></div><div class="mfoot"><button class="btn bout bsm" onclick="dlCurrTemplate()">⬇️ النموذج</button><div style="flex:1"></div><button class="btn bteal bsm" onclick="ipGo()">اختر الملف وارفع</button></div></div>`);}
function ipGo(){const teacherId=document.getElementById('ip-tea').value,classId=document.getElementById('ip-cls').value,subId=document.getElementById('ip-sub').value,term=+document.getElementById('ip-term').value;pickFile((txt)=>{const items=parseCurrItems(txt);if(!items.length)return toast('لا بنود صالحة','e');const s=S();const p={id:uid('pl'),teacherId,classId,subId,term,status:'approved',editReq:false,items,ts:Date.now(),approvedBy:SESSION.name,approvedAt:todayISO()};s.plans.push(p);logAct('رفع خطة منهج لمعلم',tea(teacherId).name+' — '+subj(subId).name);save();closeM();rePlans();toast('تم رفع الخطة واعتمادها ✓','s');});}
/* ---- exam windows CRUD (operational) ---- */
const EW_LABEL={formative:'تكوينى شهرى',midyear:'تجميعى نصف العام',final:'تجميعى آخر العام',summative:'تجميعى'};
function opExam(id,kind){const ew=id?(S().cfg.examWindows.find(x=>x.id===id)):{name:'',from:todayISO(),to:todayISO(),kind:kind||'formative',note:''};openM(`<div class="mbox"><div class="mhdr teal"><span class="mtitle">${id?'تعديل موعد امتحان':'إضافة موعد امتحان'}</span><button class="mcls" onclick="closeM()">✕</button></div><div class="mbody"><div class="fgrid"><div class="fm"><label>النوع</label><select id="ew-kind">${Object.keys(EW_LABEL).map(k=>`<option value="${k}" ${ew.kind===k?'selected':''}>${EW_LABEL[k]}</option>`).join('')}</select></div><div class="fm full"><label>المسمى</label><input id="ew-name" value="${esc(ew.name||'')}" placeholder="مثال: اختبار شهر أكتوبر"/></div><div class="fm"><label>من</label><input type="date" id="ew-from" value="${ew.from}"/></div><div class="fm"><label>إلى</label><input type="date" id="ew-to" value="${ew.to||ew.from}"/></div><div class="fm full"><label>ملاحظة</label><input id="ew-note" value="${esc(ew.note||'')}" placeholder="مثال: مواد التخصص بعد انتهاء الوحدة"/></div></div></div><div class="mfoot"><button class="btn bout bsm" onclick="closeM()">إلغاء</button><button class="btn bteal bsm" onclick="opSaveExam('${id||''}')">حفظ</button></div></div>`);}
function opSaveExam(id){const o={name:document.getElementById('ew-name').value.trim(),from:document.getElementById('ew-from').value,to:document.getElementById('ew-to').value,kind:document.getElementById('ew-kind').value,note:document.getElementById('ew-note').value.trim()};if(!o.name)return toast('المسمى مطلوب','e');if(id){Object.assign(S().cfg.examWindows.find(x=>x.id===id),o);}else{o.id=uid('ew');S().cfg.examWindows.push(o);}logAct('موعد امتحان',o.name);save();closeM();reOp();toast('تم الحفظ','s');}
function opDelExam(id){confirmM('حذف موعد الامتحان؟',()=>{S().cfg.examWindows=S().cfg.examWindows.filter(x=>x.id!==id);save();reOp();toast('تم الحذف','e');});}
function afterUnitExams(){const s=S();const out=[];(s.plans||[]).forEach(p=>{(p.items||[]).forEach(it=>{if(it.examAfterUnit)out.push({p,it});});});return out;}

loadDB();roleChange();

(function restore(){try{const raw=localStorage.getItem(SK+'_sess');if(!raw)return;const sess=JSON.parse(raw);if(sess.k==='s'){const sd=DB.data[sess.schoolId];if(sd){const cl=sd.classes.find(c=>c.id===sess.classId);if(cl){SESSION={role:'student',name:'طالب — فصل '+cl.name,username:'student',schoolId:sess.schoolId,classId:sess.classId};ACTIVE=sess.schoolId;enterApp();}}}}catch(e){}})();
